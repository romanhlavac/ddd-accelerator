name: DDDA platform Change Request
description: Založit konkrétní implementační požadavek jako Child Issue pod Work Package.
title: "[CR] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Change Request je autorita pro konkrétní plánovanou změnu. Branch a Draft PR vzniknou až při zahájení implementace.
  - type: input
    id: parent_wp
    attributes:
      label: Parent Work Package
      description: Uveď WP-XX a odkaz na Parent Issue.
      placeholder: WP-09 — #123
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Jakou konkrétní platformní capability má tento inkrement dodat?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Jaké omezení, riziko nebo ruční práci řeší?
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: checkboxes
    id: platform_areas
    attributes:
      label: Affected platform areas
      options:
        - label: DOC
        - label: METHODOLOGY
        - label: TEMPLATE
        - label: SCHEMA
        - label: ORCHESTRATION
        - label: INGESTION
        - label: CLI
        - label: WORKSPACE-GENERATOR
        - label: EXAMPLE
        - label: TESTING
        - label: RELEASE
        - label: SECURITY-GOVERNANCE
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - LOW
        - MEDIUM
        - HIGH
        - BREAKING
    validations:
      required: true
  - type: dropdown
    id: migration_impact
    attributes:
      label: Migration impact
      options:
        - None
        - Non-breaking / additive
        - Breaking
        - Unknown — discovery required
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Kritéria musí být konkrétní a doložitelná implementační, testovací nebo human-review evidencí.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: repository_changes
    attributes:
      label: Required repository changes
      description: Očekávané oblasti/soubory; nejde o závazek k přesným interním názvům, pokud veřejný kontrakt zůstane zachován.
      placeholder: |
        - runtime/...
        - schemas/...
        - tests/...
        - docs/...
    validations:
      required: true
  - type: checkboxes
    id: tests
    attributes:
      label: Required tests
      options:
        - label: lint
        - label: schema
        - label: unit
        - label: component
        - label: integration
        - label: smoke
        - label: regression
        - label: security/isolation
        - label: acceptance
        - label: E2E
        - label: migration/compatibility
        - label: manual methodology/architecture/usability review
  - type: textarea
    id: evidence
    attributes:
      label: Expected validation evidence
      description: CI, validation report, exact SHA, package hash, online integration evidence, screenshots nebo HRDR podle potřeby.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Blocking issues, ADRs, Work Packages, external tools nebo rozhodnutí.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and mitigations
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Zahrň implementaci, testy, docs, ADR/changelog/migration podle dopadu, review a aktualizaci parent WP.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Backlog readiness
      options:
        - label: Scope je oddělen od sousedních Work Packages a out-of-scope GAP bloků.
          required: true
        - label: Acceptance criteria lze před zahájením implementace objektivně vyhodnotit.
          required: true
        - label: Branch ani PR zatím nevznikly, pokud implementace nebyla zahájena.
          required: true
        - label: Issue neobsahuje secrets ani klientská data.
          required: true

name: Apply REM-PR8-HVA-CC-003

on:
  push:
    branches:
      - feat/project-steering-and-documentation
    paths:
      - .github/workflows/rem-003-apply.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: rem-pr8-hva-cc-003
  cancel-in-progress: true

jobs:
  apply-test-commit-push:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      EXPECTED_PARENT_SHA: 156a8e436888b131ccf8b7b28592d42f9bfc4091
      TARGET_BRANCH: feat/project-steering-and-documentation
      REMEDIATION_SCRIPT: scripts/remediation/REM-PR8-HVA-CC-003.ps1
      TRANSPORT_WORKFLOW: .github/workflows/rem-003-apply.yml
      PR_NUMBER: '8'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact transport commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Verify transport preconditions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD^).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "Checkout SHA '$actual' neodpovídá event SHA '${{ github.sha }}'."
          }
          if ($parent -ne $env:EXPECTED_PARENT_SHA) {
            throw "REM-003 transport parent '$parent' neodpovídá '$env:EXPECTED_PARENT_SHA'."
          }
          if ($env:GITHUB_REF_NAME -ne $env:TARGET_BRANCH) {
            throw "REM-003 smí běžet pouze na '$env:TARGET_BRANCH'."
          }
          foreach ($path in @($env:REMEDIATION_SCRIPT, $env:TRANSPORT_WORKFLOW)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Transport file nebyl nalezen: $path"
            }
          }
          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace(($changes -join "`n"))) {
            throw "Transport checkout není čistý:`n$($changes -join "`n")"
          }

      - name: Announce remediation start
        shell: pwsh
        run: |
          $body = @"
          REM-PR8-HVA-CC-003 remote orchestration STARTED.

          - transport SHA: $env:GITHUB_SHA
          - expected parent: $env:EXPECTED_PARENT_SHA
          - workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          No merge, tag, release or promotion is part of this run.
          "@
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body $body

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply governed remediation content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath $env:REMEDIATION_SCRIPT -Raw -Encoding UTF8
          $marker = 'Write-Base64File -RelativePath "scripts/platform/Assert-DDDAMiroRuntimeProvenance.ps1"'
          $index = $source.IndexOf($marker, [System.StringComparison]::Ordinal)
          if ($index -lt 0) {
            throw 'REM-003 governed prefix marker was not found.'
          }
          $prefix = $source.Substring(0, $index)
          $postconditions = @'
          $expectedChanged = @(
              ".github/workflows/platform-ci.yml",
              "CHANGELOG.md",
              "config/platform/development-policy.yaml",
              "scripts/Initialize-DDDAAfterClone.ps1",
              "scripts/Initialize-DDDAProjectMiro.ps1",
              "scripts/Test-DDDAAcceptance.ps1",
              "scripts/platform/Invoke-DDDAPlatformTest.ps1",
              "scripts/platform/Invoke-DDDAValidatePr.ps1"
          )
          $permanentMarkers = [ordered]@{
              ".github/workflows/assistant-command.yml" = "DDDA remote execution broker"
              "docs/developer-guide/remote-validation-broker.md" = "Remote validation and remediation broker"
              "scripts/platform/Assert-DDDAMiroRuntimeProvenance.ps1" = "checked_before_remote_write"
              "scripts/platform/Test-DDDARemoteExecutionRequest.ps1" = "Remote execution is disabled by platform policy"
              "tests/powershell/Test-DDDARuntimeIsolation.ps1" = "OLD-CONTAMINATED-RENDERER"
          }
          $changed = @(& git -C $root diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $expectedChanged })
          if ($unexpected.Count -gt 0) {
              throw "Unexpected REM-003 paths:`n$($unexpected -join "`n")"
          }
          foreach ($path in $expectedChanged) {
              if ($path -notin $changed) {
                  throw "REM-003 did not change required path: $path"
              }
          }
          foreach ($entry in $permanentMarkers.GetEnumerator()) {
              $path = Join-Path $root $entry.Key
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Permanent governed file is missing: $($entry.Key)"
              }
              $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
              if ($text -notmatch [regex]::Escape([string]$entry.Value)) {
                  throw "Permanent governed marker is missing in $($entry.Key): $($entry.Value)"
              }
          }
          $validateText = Get-Content -LiteralPath (Join-Path $root "scripts/platform/Invoke-DDDAValidatePr.ps1") -Raw -Encoding UTF8
          if ($validateText -notmatch 'sanitizedEnvironmentNames') {
              throw 'validate-pr environment sanitization postcondition failed.'
          }
          $miroText = Get-Content -LiteralPath (Join-Path $root "scripts/Initialize-DDDAProjectMiro.ps1") -Raw -Encoding UTF8
          if ($miroText -notmatch '\$script:MiroPython -I -m ddda_miro' -or $miroText -notmatch 'SuppressCommitInstructions') {
              throw 'Miro CLI isolation postcondition failed.'
          }
          $acceptanceText = Get-Content -LiteralPath (Join-Path $root "scripts/Test-DDDAAcceptance.ps1") -Raw -Encoding UTF8
          if ($acceptanceText -notmatch 'runtime_provenance_status' -or $acceptanceText -notmatch 'invalid diagnostic output') {
              throw 'Acceptance provenance postcondition failed.'
          }
          $policy = Get-Content -LiteralPath (Join-Path $root "config/platform/development-policy.yaml") -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not [bool]$policy.remote_execution.enabled) {
              throw 'Remote execution policy postcondition failed.'
          }
          Write-Host "REM-PR8-HVA-CC-003 content application: PASS"
          Write-Host "Changed existing paths: $($changed.Count)"
          Write-Host "Permanent governed paths: $($permanentMarkers.Count)"
          '@
          $tempScript = Join-Path $env:RUNNER_TEMP 'Invoke-REM003Content.ps1'
          [System.IO.File]::WriteAllText($tempScript, $prefix + [Environment]::NewLine + $postconditions, (New-Object System.Text.UTF8Encoding($false)))
          & $tempScript -RepositoryRoot $PWD.Path -NoPush
          if ($LASTEXITCODE -ne 0) {
            throw "REM-003 content application failed with exit code $LASTEXITCODE."
          }
          git rm -- $env:REMEDIATION_SCRIPT $env:TRANSPORT_WORKFLOW

      - name: Create local implementation commit
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'DDDA Remediation Bot'
          git config user.email 'ddda-remediation@example.invalid'
          git add --all
          git commit -m 'fix(platform): isolate candidate runtime and add remote execution broker'
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Local implementation SHA: $sha"

      - name: Verify committed postconditions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = [ordered]@{
            'scripts/platform/Invoke-DDDAValidatePr.ps1' = 'sanitizedEnvironmentNames'
            'scripts/platform/Assert-DDDAMiroRuntimeProvenance.ps1' = 'checked_before_remote_write'
            'tests/powershell/Test-DDDARuntimeIsolation.ps1' = 'OLD-CONTAMINATED-RENDERER'
            '.github/workflows/assistant-command.yml' = 'DDDA remote execution broker'
            'docs/developer-guide/remote-validation-broker.md' = 'Remote validation and remediation broker'
            '.github/workflows/platform-ci.yml' = 'online-miro-acceptance'
          }
          foreach ($entry in $checks.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $entry.Key -PathType Leaf)) {
              throw "Committed postcondition file missing: $($entry.Key)"
            }
            $text = Get-Content -LiteralPath $entry.Key -Raw -Encoding UTF8
            if ($text -notmatch [regex]::Escape([string]$entry.Value)) {
              throw "Committed marker missing in $($entry.Key): $($entry.Value)"
            }
          }
          if (Test-Path -LiteralPath $env:REMEDIATION_SCRIPT -or Test-Path -LiteralPath $env:TRANSPORT_WORKFLOW) {
            throw 'Transport files were not removed from the implementation commit.'
          }

      - name: Source-level validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\ddda.ps1 doctor
          foreach ($suite in @('lint', 'schema', 'unit', 'component', 'regression', 'security')) {
            Write-Host "=== REM-003 source suite: $suite ==="
            .\ddda.ps1 test -Suite $suite -NonInteractive
          }

      - name: Build exact-SHA candidate package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ steps.commit.outputs.sha }}'
          $version = '0.1.0-rem003.' + $env:GITHUB_RUN_ID + '.' + $sha.Substring(0, 12)
          $output = Join-Path $env:RUNNER_TEMP ('ddda-rem003-' + $sha.Substring(0, 12) + '.zip')
          $json = .\scripts\platform\New-DDDAPlatformPackage.ps1 `
            -PlatformPath $PWD.Path `
            -Kind candidate `
            -Version $version `
            -SourceRef $sha `
            -OutputPath $output `
            -Json | Out-String
          $package = $json.Trim() | ConvertFrom-Json
          if ($package.source_commit -ne $sha) {
            throw 'Candidate package není svázán s lokálním implementation SHA.'
          }
          "path=$($package.path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package-first exact-SHA validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = '${{ steps.package.outputs.path }}'
          $sha = '${{ steps.commit.outputs.sha }}'
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 `
            -PackagePath $packagePath `
            -ExpectedCommit $sha `
            -ExpectedKind candidate
          foreach ($suite in @('integration', 'smoke', 'security', 'e2e')) {
            Write-Host "=== REM-003 package suite: $suite ==="
            .\ddda.ps1 test -Suite $suite -PackagePath $packagePath -NonInteractive
          }
          .\ddda.ps1 test `
            -Suite acceptance `
            -PackagePath $packagePath `
            -CleanupOnFailure `
            -NonInteractive

      - name: Verify clean exact implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace(($changes -join "`n"))) {
            throw "REM-003 testy zanechaly nečistý repozitář:`n$($changes -join "`n")"
          }
          $count = [int](git rev-list --count "${{ github.sha }}..HEAD")
          if ($count -ne 1) {
            throw "REM-003 orchestration must create exactly one implementation commit; created $count."
          }
          if ((git rev-parse HEAD).Trim() -ne '${{ steps.commit.outputs.sha }}') {
            throw 'Implementation SHA drifted during validation.'
          }

      - name: Push validated implementation commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git push origin "HEAD:$env:TARGET_BRANCH"

      - name: Upload candidate package
        if: always() && steps.package.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: rem-pr8-hva-cc-003-${{ steps.commit.outputs.sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish remediation result
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          IMPLEMENTATION_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          $implementation = if ([string]::IsNullOrWhiteSpace($env:IMPLEMENTATION_SHA)) { '<not-created>' } else { $env:IMPLEMENTATION_SHA }
          $body = @"
          REM-PR8-HVA-CC-003 remote orchestration: $env:JOB_STATUS.

          - transport SHA: $env:GITHUB_SHA
          - implementation SHA: $implementation
          - workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          No merge, tag, release or promotion was performed.
          "@
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body $body

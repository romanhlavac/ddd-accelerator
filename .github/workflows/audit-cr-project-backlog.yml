name: Audit CR backlog consistency

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/audit-cr-project-backlog.yml

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  audit-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0

      - name: Verify staging scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/github-native-backlog-governance"
          test -f config/governance/github-bootstrap.json
          test -f config/governance/backlog-policy.yaml
          python - <<'PY'
          import json
          cfg=json.load(open('config/governance/github-bootstrap.json',encoding='utf-8-sig'))
          assert cfg['repository']=='romanhlavac/ddd-accelerator'
          assert cfg['project_title']=='DDDA Platform Backlog'
          assert cfg['project_owner']=='romanhlavac'
          PY

      - name: Start GitHub CLI browser authorization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          AUTH_LOG="$RUNNER_TEMP/gh-auth.log"
          AUTH_PID_FILE="$RUNNER_TEMP/gh-auth.pid"
          AUTH_SAFE_FILE="$RUNNER_TEMP/gh-device-auth.txt"
          rm -f "$AUTH_LOG" "$AUTH_PID_FILE" "$AUTH_SAFE_FILE"
          (gh auth login --hostname github.com --git-protocol https --web --scopes project >"$AUTH_LOG" 2>&1) &
          auth_pid=$!
          echo "$auth_pid" > "$AUTH_PID_FILE"
          code=''
          for attempt in $(seq 1 60); do
            code="$(grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' "$AUTH_LOG" 2>/dev/null | head -n1 || true)"
            [ -n "$code" ] && break
            if ! kill -0 "$auth_pid" 2>/dev/null; then
              cat "$AUTH_LOG" >&2 || true
              exit 1
            fi
            sleep 1
          done
          test -n "$code"
          printf 'Verification URL: https://github.com/login/device\nDevice code: %s\n' "$code" > "$AUTH_SAFE_FILE"

      - name: Upload temporary device challenge
        uses: actions/upload-artifact@v4
        with:
          name: cr-backlog-audit-device-auth
          path: ${{ runner.temp }}/gh-device-auth.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for browser authorization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          pid="$(cat "$RUNNER_TEMP/gh-auth.pid")"
          for attempt in $(seq 1 900); do
            if gh auth status --hostname github.com >/dev/null 2>&1; then
              echo 'USER_AUTHORIZATION_COMPLETE'
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/gh-auth.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo 'Timed out waiting for GitHub device authorization.' >&2
          exit 1

      - name: Delete temporary device challenge artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="cr-backlog-audit-device-auth") | .id')"
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done

      - name: Audit, repair deterministic inconsistencies and read back
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          mkdir -p .reports/cr-backlog-audit
          python - <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path

          OWNER='romanhlavac'
          REPO='romanhlavac/ddd-accelerator'
          PROJECT_TITLE='DDDA Platform Backlog'
          WP_PARENT={'WP-08':17,'WP-09':18,'WP-10':19,'WP-11':20}
          PARENT_WP={v:k for k,v in WP_PARENT.items()}
          SAFE_CONFIG_FIELDS={'Status','Work Package','Item Type','Target Release','Blocked','Human Review','Outcome summary'}

          def gh(*args, json_out=False, allow=False):
              p=subprocess.run(['gh',*args],text=True,capture_output=True)
              if p.returncode and not allow:
                  raise RuntimeError(f"gh {' '.join(args)} failed ({p.returncode}): {p.stderr or p.stdout}")
              if json_out:
                  return json.loads(p.stdout) if p.stdout.strip() else None
              return p.stdout.strip()

          def gql(query, variables):
              args=['api','graphql','-f',f'query={query}']
              for k,v in variables.items():
                  if isinstance(v,int): args += ['-F',f'{k}={v}']
                  elif v is not None: args += ['-f',f'{k}={v}']
              return gh(*args,json_out=True)

          cfg_path=Path('config/governance/github-bootstrap.json')
          cfg=json.loads(cfg_path.read_text(encoding='utf-8-sig'))

          # Repository-wide issue discovery, open + closed, excluding Pull Requests.
          pages=gh('api','--paginate','--slurp',f'repos/{REPO}/issues?state=all&per_page=100',json_out=True)
          issues=[]
          for page in pages or []:
              issues.extend(page)
          issues=[i for i in issues if 'pull_request' not in i]

          def is_cr(i):
              title=i.get('title') or ''
              body=i.get('body') or ''
              return bool(re.search(r'\[CR\]',title,re.I) or re.search(r'^\s*#\s*Change Request\b',body,re.I|re.M) or re.search(r'Item Type\s*:\s*`?Change Request`?',body,re.I))

          crs=sorted([i for i in issues if is_cr(i)],key=lambda x:x['number'])

          # Expand each CR because list payloads are not relied on for parent/state-reason details.
          detailed={}
          for i in crs:
              detailed[i['number']]=gh('api',f'repos/{REPO}/issues/{i["number"]}',json_out=True)

          # Versioned mapping indexes.
          cfg_parent={}
          for rel in cfg.get('hierarchy',[]):
              wp=PARENT_WP.get(int(rel['parent']))
              if wp:
                  for n in rel.get('children',[]): cfg_parent[int(n)]=wp

          groups_by_issue={}
          for idx,g in enumerate(cfg.get('item_groups',[])):
              if g.get('kind')!='issue': continue
              for n in g.get('numbers',[]): groups_by_issue.setdefault(int(n),[]).append(idx)

          def parent_from_url(url):
              if not url: return None,None
              try: n=int(str(url).rstrip('/').split('/')[-1])
              except: return None,None
              return PARENT_WP.get(n),n

          def expected_wp(issue):
              n=issue['number']; title=issue.get('title') or ''; body=issue.get('body') or ''
              signals=[]
              live_wp,live_parent=parent_from_url(issue.get('parent_issue_url'))
              if live_wp: signals.append(('native_parent',live_wp))
              m=re.match(r'^\[WP-(08|09|10|11)\]\[CR\]',title,re.I)
              if m: signals.append(('title','WP-'+m.group(1)))
              m=re.search(r'Parent Work Package[\s\S]{0,180}?\b(WP-(?:08|09|10|11))\b',body,re.I)
              if m: signals.append(('body_parent',m.group(1).upper()))
              m=re.search(r'Work Package\s*:\s*`?(WP-(?:08|09|10|11)|Other)`?',body,re.I)
              if m: signals.append(('body_field',m.group(1).upper() if m.group(1).upper().startswith('WP-') else 'Other'))
              if n in cfg_parent: signals.append(('versioned_hierarchy',cfg_parent[n]))
              for gi in groups_by_issue.get(n,[]):
                  v=(cfg['item_groups'][gi].get('metadata') or {}).get('Work Package')
                  if v: signals.append(('versioned_item_group',v))
              values={v for _,v in signals if v}
              if len(values)>1:
                  return None,signals,'AMBIGUOUS_REQUIRES_DECISION'
              if len(values)==1: return next(iter(values)),signals,None
              # Explicit cross-cutting CR forms belong to Other unless another signal says otherwise.
              if re.match(r'^\[(?:DOC)\]\[CR\]',title,re.I) or re.match(r'^\[CR\]\[GOV\]',title,re.I) or re.search(r'cross-cutting',body,re.I):
                  return 'Other',signals,None
              return None,signals,'AMBIGUOUS_REQUIRES_DECISION'

          # Resolve Project and full field catalog.
          plist=gh('project','list','--owner',OWNER,'--limit','100','--format','json',json_out=True)
          project=next((p for p in plist.get('projects',[]) if p.get('title')==PROJECT_TITLE and not p.get('closed')),None)
          if not project: raise RuntimeError('DDDA Platform Backlog Project not found')
          project_number=int(project['number'])

          q_fields='''query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id number title fields(first:100){nodes{__typename ... on ProjectV2FieldCommon{id name dataType} ... on ProjectV2SingleSelectField{options{id name}}}}}}}'''
          pd=gql(q_fields,{'login':OWNER,'number':project_number})['data']['user']['projectV2']
          project_id=pd['id']
          fields={f.get('name'):f for f in pd['fields']['nodes'] if f.get('name')}

          def all_items():
              out=[]; after=None
              q='''query($login:String!,$number:Int!,$after:String){user(login:$login){projectV2(number:$number){items(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{id content{__typename ... on Issue{id number url state} ... on PullRequest{id number url state}} fieldValues(first:50){nodes{__typename ... on ProjectV2ItemFieldSingleSelectValue{name field{... on ProjectV2FieldCommon{name}}} ... on ProjectV2ItemFieldTextValue{text field{... on ProjectV2FieldCommon{name}}}}}}}}}}}'''
              while True:
                  data=gql(q,{'login':OWNER,'number':project_number,'after':after})['data']['user']['projectV2']['items']
                  out.extend(data['nodes'])
                  if not data['pageInfo']['hasNextPage']: break
                  after=data['pageInfo']['endCursor']
              return out

          def item_map():
              return {x['content']['number']:x for x in all_items() if x.get('content',{}).get('__typename')=='Issue'}

          def values(item):
              v={}
              for x in item.get('fieldValues',{}).get('nodes',[]):
                  f=(x.get('field') or {}).get('name')
                  if f: v[f]=x.get('name') if x.get('name') is not None else x.get('text')
              return v

          def add_project_item(issue):
              mut='''mutation($projectId:ID!,$contentId:ID!){addProjectV2ItemById(input:{projectId:$projectId,contentId:$contentId}){item{id}}}'''
              return gql(mut,{'projectId':project_id,'contentId':issue['node_id']})['data']['addProjectV2ItemById']['item']['id']

          def set_select(item_id,field_name,option_name):
              f=fields[field_name]
              opt=next((o for o in f.get('options',[]) if o['name']==option_name),None)
              if not opt: raise RuntimeError(f'Missing option {field_name}={option_name}')
              mut='''mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{singleSelectOptionId:$optionId}}){projectV2Item{id}}}'''
              gql(mut,{'projectId':project_id,'itemId':item_id,'fieldId':f['id'],'optionId':opt['id']})

          def set_text(item_id,field_name,text):
              f=fields[field_name]
              mut='''mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$text:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{text:$text}}){projectV2Item{id}}}'''
              gql(mut,{'projectId':project_id,'itemId':item_id,'fieldId':f['id'],'text':text})

          def config_metadata(n):
              hits=groups_by_issue.get(n,[])
              if not hits: return {}
              # If duplicates exist, first metadata is used for non-authority fields; duplicates are repaired below.
              return dict(cfg['item_groups'][hits[0]].get('metadata') or {})

          initial_items=item_map()
          findings=[]; repairs=[]; ambiguous=[]; config_changed=False

          # First pass: classify and repair native hierarchy + Project membership/fields.
          for base in crs:
              n=base['number']; issue=detailed[n]
              wp,signals,problem=expected_wp(issue)
              live_wp,live_parent=parent_from_url(issue.get('parent_issue_url'))
              if problem or not wp:
                  ambiguous.append({'issue':n,'title':issue['title'],'signals':signals,'reason':problem or 'NO_WP'})
                  findings.append({'issue':n,'classification':'AMBIGUOUS_REQUIRES_DECISION','expected_wp':wp,'signals':signals})
                  continue

              # Native parent is required for WP-scoped CRs and forbidden-by-convention for Other.
              if wp!='Other':
                  expected_parent=WP_PARENT[wp]
                  if live_parent is None:
                      issue_id=issue['id']
                      gh('api','--method','POST',f'repos/{REPO}/issues/{expected_parent}/sub_issues','-F',f'sub_issue_id={issue_id}')
                      repairs.append({'issue':n,'action':'ADD_NATIVE_PARENT','value':expected_parent})
                      issue=gh('api',f'repos/{REPO}/issues/{n}',json_out=True); detailed[n]=issue
                  elif live_parent!=expected_parent:
                      ambiguous.append({'issue':n,'title':issue['title'],'signals':signals,'reason':f'LIVE_PARENT_{live_parent}_EXPECTED_{expected_parent}'})
                      findings.append({'issue':n,'classification':'WP_MISMATCH','expected_wp':wp,'native_parent':live_parent})
                      continue

              items=initial_items
              item=items.get(n)
              if item is None:
                  add_project_item(issue)
                  repairs.append({'issue':n,'action':'ADD_PROJECT_ITEM'})
                  initial_items=item_map(); item=initial_items[n]
              vals=values(item)

              if vals.get('Item Type')!='Change Request':
                  set_select(item['id'],'Item Type','Change Request')
                  repairs.append({'issue':n,'action':'SET_ITEM_TYPE','value':'Change Request'})
              if vals.get('Work Package')!=wp:
                  set_select(item['id'],'Work Package',wp)
                  repairs.append({'issue':n,'action':'SET_WORK_PACKAGE','value':wp})

              cm=config_metadata(n)
              # Status: closed Issues must not remain active; open Issues must not remain Done/Cancelled.
              current_status=vals.get('Status')
              if issue['state']=='closed':
                  desired='Cancelled' if issue.get('state_reason') in ('not_planned','duplicate') else 'Done'
                  if current_status!=desired:
                      set_select(item['id'],'Status',desired)
                      repairs.append({'issue':n,'action':'SET_STATUS','value':desired})
              else:
                  desired=cm.get('Status')
                  if current_status in ('Done','Cancelled') or not current_status:
                      desired=desired if desired and desired not in ('Done','Cancelled') else 'Backlog'
                      set_select(item['id'],'Status',desired)
                      repairs.append({'issue':n,'action':'SET_STATUS','value':desired})
                  elif desired and current_status!=desired:
                      # Versioned explicit status is deterministic, except no automatic human/approval semantics are encoded here.
                      set_select(item['id'],'Status',desired)
                      repairs.append({'issue':n,'action':'SET_STATUS_FROM_CONFIG','value':desired})

              # Apply other explicitly versioned, non-strategic deterministic values only.
              for fname,val in cm.items():
                  if fname not in SAFE_CONFIG_FIELDS or fname in ('Status','Work Package','Item Type') or val in (None,''): continue
                  if fname=='Human Review' and val not in ('Not required','Pending'): continue
                  if fname not in fields: continue
                  if fields[fname].get('dataType')=='SINGLE_SELECT':
                      if vals.get(fname)!=val:
                          set_select(item['id'],fname,str(val)); repairs.append({'issue':n,'action':'SET_CONFIG_FIELD','field':fname,'value':val})
                  elif fields[fname].get('dataType')=='TEXT':
                      if vals.get(fname)!=str(val):
                          set_text(item['id'],fname,str(val)); repairs.append({'issue':n,'action':'SET_CONFIG_FIELD','field':fname,'value':val})

          # Re-fetch detailed issues after native-parent writes and normalize versioned hierarchy/item-group projection.
          for i in crs: detailed[i['number']]=gh('api',f'repos/{REPO}/issues/{i["number"]}',json_out=True)

          # Rebuild current group index per mutation cycle.
          def rebuild_group_index():
              m={}
              for idx,g in enumerate(cfg.get('item_groups',[])):
                  if g.get('kind')!='issue': continue
                  for n in g.get('numbers',[]): m.setdefault(int(n),[]).append(idx)
              return m

          for base in crs:
              n=base['number']; issue=detailed[n]
              wp,signals,problem=expected_wp(issue)
              if problem or not wp: continue
              # hierarchy projection
              for rel in cfg.get('hierarchy',[]):
                  parent=int(rel['parent']); children=[int(x) for x in rel.get('children',[])]
                  should=(wp!='Other' and parent==WP_PARENT[wp])
                  if n in children and not should:
                      rel['children']=[x for x in rel.get('children',[]) if int(x)!=n]; config_changed=True
                  if should and n not in children:
                      rel.setdefault('children',[]).append(n); config_changed=True
              # item group projection: ensure exactly one group and canonical WP/Item Type without changing unrelated siblings.
              groups_by_issue=rebuild_group_index(); hits=groups_by_issue.get(n,[])
              if not hits:
                  cfg.setdefault('item_groups',[]).append({'kind':'issue','numbers':[n],'metadata':{'Work Package':wp,'Item Type':'Change Request'}})
                  config_changed=True
              else:
                  source_meta=dict(cfg['item_groups'][hits[0]].get('metadata') or {})
                  needs_split=len(hits)>1 or source_meta.get('Work Package')!=wp or source_meta.get('Item Type')!='Change Request'
                  if needs_split:
                      for idx in sorted(hits,reverse=True):
                          g=cfg['item_groups'][idx]
                          g['numbers']=[x for x in g.get('numbers',[]) if int(x)!=n]
                      cfg['item_groups']=[g for g in cfg['item_groups'] if g.get('kind')!='issue' or g.get('numbers')]
                      source_meta['Work Package']=wp; source_meta['Item Type']='Change Request'
                      # stale configured closed/open Status is normalized here as well.
                      if issue['state']=='closed': source_meta['Status']='Cancelled' if issue.get('state_reason') in ('not_planned','duplicate') else 'Done'
                      elif source_meta.get('Status') in ('Done','Cancelled'): source_meta['Status']='Backlog'
                      cfg['item_groups'].append({'kind':'issue','numbers':[n],'metadata':source_meta})
                      config_changed=True
                  else:
                      g=cfg['item_groups'][hits[0]]; meta=g.setdefault('metadata',{})
                      desired_closed='Cancelled' if issue.get('state_reason') in ('not_planned','duplicate') else 'Done'
                      if issue['state']=='closed' and meta.get('Status') and meta.get('Status')!=desired_closed:
                          meta['Status']=desired_closed; config_changed=True
                      elif issue['state']=='open' and meta.get('Status') in ('Done','Cancelled'):
                          meta['Status']='Backlog'; config_changed=True

          if config_changed:
              cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Final read-back and final consistency classification.
          final_items=item_map()
          final=[]; remaining=[]
          # reload versioned indices
          final_cfg=json.loads(cfg_path.read_text(encoding='utf-8-sig'))
          final_parent={}
          for rel in final_cfg.get('hierarchy',[]):
              wp=PARENT_WP.get(int(rel['parent']))
              if wp:
                  for n in rel.get('children',[]): final_parent[int(n)]=wp
          final_groups={}
          for g in final_cfg.get('item_groups',[]):
              if g.get('kind')!='issue': continue
              for n in g.get('numbers',[]): final_groups.setdefault(int(n),[]).append(g)

          for base in crs:
              n=base['number']; issue=gh('api',f'repos/{REPO}/issues/{n}',json_out=True)
              wp,signals,problem=expected_wp(issue)
              row={'issue':n,'title':issue['title'],'state':issue['state'],'expected_wp':wp}
              if problem or not wp:
                  row['classification']='AMBIGUOUS_REQUIRES_DECISION'; remaining.append(row); final.append(row); continue
              live_wp,live_parent=parent_from_url(issue.get('parent_issue_url'))
              item=final_items.get(n); row['native_parent']=live_parent; row['project_member']=bool(item)
              if not item:
                  row['classification']='MISSING_PROJECT_ITEM'; remaining.append(row); final.append(row); continue
              vals=values(item); row['project_fields']={k:vals.get(k) for k in ('Status','Work Package','Item Type','Blocked','Human Review','Target Release')}
              problems=[]
              if wp!='Other' and live_parent!=WP_PARENT[wp]: problems.append('MISSING_PARENT' if live_parent is None else 'WP_MISMATCH')
              if vals.get('Item Type')!='Change Request': problems.append('ITEM_TYPE_MISMATCH')
              if vals.get('Work Package')!=wp: problems.append('WP_MISMATCH')
              if issue['state']=='closed' and vals.get('Status') not in ('Done','Cancelled'): problems.append('STATUS_MISMATCH')
              if issue['state']=='open' and vals.get('Status') in (None,'Done','Cancelled'): problems.append('STATUS_MISMATCH')
              if wp!='Other' and final_parent.get(n)!=wp: problems.append('VERSIONED_CONFIG_CONFLICT' if n in final_parent else 'VERSIONED_CONFIG_MISSING')
              gs=final_groups.get(n,[])
              if len(gs)!=1: problems.append('VERSIONED_CONFIG_MISSING' if not gs else 'VERSIONED_CONFIG_CONFLICT')
              elif (gs[0].get('metadata') or {}).get('Work Package')!=wp or (gs[0].get('metadata') or {}).get('Item Type')!='Change Request': problems.append('VERSIONED_CONFIG_CONFLICT')
              # Configured deterministic metadata read-back.
              if len(gs)==1:
                  for fname,val in (gs[0].get('metadata') or {}).items():
                      if fname not in SAFE_CONFIG_FIELDS or fname in ('Work Package','Item Type') or val in (None,''): continue
                      if fname=='Human Review' and val not in ('Not required','Pending'): continue
                      if fname in vals and vals.get(fname)!=str(val): problems.append('VERSIONED_CONFIG_CONFLICT')
              row['classification']='PASS' if not problems else '+'.join(sorted(set(problems)))
              if problems: remaining.append(row)
              final.append(row)

          report={
              'schema_version':1,
              'repository':REPO,
              'project':{'title':PROJECT_TITLE,'number':project_number},
              'governance_branch':'feature/github-native-backlog-governance',
              'source_sha':gh('rev-parse','HEAD'),
              'cr_count':len(crs),
              'repair_count':len(repairs),
              'remaining_count':len(remaining),
              'config_changed':config_changed,
              'repairs':repairs,
              'ambiguous_initial':ambiguous,
              'final':final,
          }
          out=Path('.reports/cr-backlog-audit')
          (out/'audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=['# DDDA CR ↔ Project Backlog consistency audit','',f'- Repository: `{REPO}`',f'- Project: `{PROJECT_TITLE}` (#{project_number})',f'- CRs found: **{len(crs)}**',f'- Deterministic repairs: **{len(repairs)}**',f'- Remaining inconsistencies/ambiguities: **{len(remaining)}**',f'- Versioned config changed: **{config_changed}**','','## Final status','','| CR | State | Expected WP | Native parent | Project | Status | Item Type | Classification |','|---:|---|---|---:|---|---|---|---|']
          for r in final:
              pf=r.get('project_fields') or {}
              lines.append(f"| #{r['issue']} | {r['state']} | {r.get('expected_wp') or '-'} | {r.get('native_parent') or '-'} | {'yes' if r.get('project_member') else 'no'} | {pf.get('Status') or '-'} | {pf.get('Item Type') or '-'} | {r['classification']} |")
          lines += ['','## Repairs','']
          if repairs:
              for x in repairs: lines.append('- '+json.dumps(x,ensure_ascii=False))
          else: lines.append('- none')
          if remaining:
              lines += ['','## Remaining','']
              for x in remaining: lines.append('- '+json.dumps(x,ensure_ascii=False))
          (out/'audit.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'audit.env').write_text(f"CR_COUNT={len(crs)}\nREPAIR_COUNT={len(repairs)}\nREMAINING_COUNT={len(remaining)}\nCONFIG_CHANGED={'1' if config_changed else '0'}\n",encoding='utf-8')
          print(json.dumps({'cr_count':len(crs),'repairs':len(repairs),'remaining':len(remaining),'config_changed':config_changed}))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr-project-backlog-consistency-audit
          path: .reports/cr-backlog-audit/
          retention-days: 30
          if-no-files-found: error

      - name: Commit versioned reconciliation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/audit-cr-project-backlog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/governance .github/workflows
          if git diff --cached --quiet; then
            echo 'No versioned governance change apart from already-cleaned staging workflow.'
          else
            git commit -m 'fix(governance): reconcile CRs with project backlog (#16)'
            git push origin HEAD:feature/github-native-backlog-governance
          fi

      - name: Enforce clean final audit
        shell: bash
        run: |
          set -euo pipefail
          source .reports/cr-backlog-audit/audit.env
          echo "CR_COUNT=$CR_COUNT REPAIR_COUNT=$REPAIR_COUNT REMAINING_COUNT=$REMAINING_COUNT CONFIG_CHANGED=$CONFIG_CHANGED"
          test "$REMAINING_COUNT" -eq 0

name: Align CHR52 into WP-11 backlog

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/align-chr52-wp11.yml

permissions:
  contents: write
  issues: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0

      - name: Update versioned governance contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          p = root / 'config/governance/github-bootstrap.json'
          data = json.loads(p.read_text(encoding='utf-8-sig'))

          for rel in data['hierarchy']:
              if rel['parent'] == 20:
                  children = [int(x) for x in rel['children']]
                  if 52 not in children:
                      idx = children.index(34) + 1 if 34 in children else 0
                      children.insert(idx, 52)
                  rel['children'] = children
                  break
          else:
              data['hierarchy'].append({'parent': 20, 'children': [52]})

          dep_map = {int(d['blocked']): d for d in data['dependencies']}
          for blocked in (35, 41, 46):
              d = dep_map.get(blocked)
              if d is None:
                  d = {'blocked': blocked, 'blocked_by': [52]}
                  data['dependencies'].append(d)
              else:
                  blockers = [int(x) for x in d['blocked_by']]
                  if 52 not in blockers:
                      blockers.append(52)
                  d['blocked_by'] = blockers

          covered = {int(n) for g in data['item_groups'] if g.get('kind') == 'issue' for n in g.get('numbers', [])}
          if 52 not in covered:
              target = None
              for g in data['item_groups']:
                  md = g.get('metadata', {})
                  if (g.get('kind') == 'issue' and md.get('Work Package') == 'WP-11'
                      and md.get('Item Type') == 'Change Request' and md.get('Blocked') == 'No'
                      and md.get('Target Release') == 'TBD'):
                      target = g
                      break
              if target is not None:
                  target['numbers'].append(52)
              else:
                  data['item_groups'].append({
                      'kind': 'issue',
                      'numbers': [52],
                      'metadata': {
                          'Status': 'Backlog',
                          'Work Package': 'WP-11',
                          'Item Type': 'Change Request',
                          'Target Release': 'TBD',
                          'Blocked': 'No',
                          'Human Review': 'Not required'
                      }
                  })

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = root / 'config/governance/backlog-policy.yaml'
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace(
              'children: [34, 35, 36, 37, 38, 39, 40, 47, 41, 48, 46]',
              'children: [34, 52, 35, 36, 37, 38, 39, 40, 47, 41, 48, 46]'
          )

          def add_edge_once(text, anchor, block):
              if block.strip() in text:
                  return text
              if anchor not in text:
                  raise RuntimeError(f'Anchor not found: {anchor}')
              return text.replace(anchor, block + anchor, 1)

          text = add_edge_once(
              text,
              '    - blocking: 36\n      blocked: 37\n',
              '    - blocking: 52\n      blocked: 35\n      rationale: detailed EventStorming facilitation methodology must be stable before final Miro workshop semantics acceptance\n'
          )
          text = add_edge_once(
              text,
              '    - blocking: 47\n      blocked: 41\n',
              '    - blocking: 52\n      blocked: 41\n      rationale: final package-first EventStorming acceptance must validate methodology fidelity against the canonical facilitation guide\n'
          )
          text = add_edge_once(
              text,
              '    - blocking: 48\n      blocked: 46\n',
              '    - blocking: 52\n      blocked: 46\n      rationale: final first-user guide must route detailed EventStorming facilitation to the canonical guide without duplication\n'
          )
          p.write_text(text, encoding='utf-8')

          p = root / 'docs/roadmap/work-packages/WP-11-eventstorming-multi-agent-orchestration.md'
          text = p.read_text(encoding='utf-8-sig')
          if '| #52 |' not in text:
              text = text.replace(
                  '| #34 | executable EventStorming session/item model |',
                  '| #34 | executable EventStorming session/item model |\n| #52 | detailed human facilitation for Big Picture, Process Modeling and Design-Level EventStorming |'
              )
          text = text.replace('#34 → #35', '#34 + #52 → #35')
          text = text.replace('#35 + #40 + #47 → #41', '#35 + #40 + #47 + #52 → #41')
          text = text.replace('#47 + #41 + #48 → final as-built closure #46', '#47 + #41 + #48 + #52 → final as-built closure #46')
          if '#52 owns the canonical detailed human facilitation' not in text:
              text = text.replace(
                  '9. #48 owns the canonical Discover/Connect, COTS/BC and tactical-design phase rules used by #46.',
                  '9. #48 owns the canonical Discover/Connect, COTS/BC and tactical-design phase rules used by #46.\n10. #52 owns the canonical detailed human facilitation for all three EventStorming workshop types; #34/#35 consume it without duplicating it.'
              )
          p.write_text(text, encoding='utf-8')

          data2 = json.loads((root / 'config/governance/github-bootstrap.json').read_text(encoding='utf-8'))
          assert 52 in next(x['children'] for x in data2['hierarchy'] if x['parent'] == 20)
          for blocked in (35, 41, 46):
              assert 52 in next(x['blocked_by'] for x in data2['dependencies'] if x['blocked'] == blocked)
          assert 'children: [34, 52, 35, 36, 37, 38, 39, 40, 47, 41, 48, 46]' in (root / 'config/governance/backlog-policy.yaml').read_text(encoding='utf-8')
          PY

      - name: Verify native hierarchy and dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: romanhlavac/ddd-accelerator
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/issues/52" --jq '.parent_issue_url')" = "https://api.github.com/repos/$GH_REPO/issues/20"
          for blocked in 35 41 46; do
            gh api "repos/$GH_REPO/issues/$blocked/dependencies/blocked_by?per_page=100" --jq '.[].number' | grep -qx 52
          done

      - name: Commit versioned alignment and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/align-chr52-wp11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/governance docs/roadmap .github/workflows
          git commit -m 'docs(governance): align CHR52 with WP-11 backlog (#16)'
          git push origin HEAD:feature/github-native-backlog-governance

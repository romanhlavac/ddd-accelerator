name: DDDA REM-012.3.6 frame 00 inline maturity markers

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: ddda-rem-012-3-6-frame-00-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.pull_request.number == 8 && github.actor == 'romanhlavac' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIOUS_SHA: b893dbd94445a1e12ad047d2db3f3b19f10cf715
      PRODUCT_SHA: 8b50f8e8c0e47521a8028010058db48c6f79fb95
      BASE_SHA: 12d7b67cca1c4c3fc68d3de4b7033a375368ce3a
      PAYLOAD_COMMENT_ID: '5203019262'
      PAYLOAD_SHA256: 45850a4cfb7d94458bc65cda3a057dec8725d17add1d7fb4dfdc7f763c7dfa57
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ env.HEAD_SHA }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify lineage and materialize pinned payload
        shell: pwsh
        run: |
          $env:EVIDENCE = Join-Path $env:RUNNER_TEMP 'rem-012-3-6'
          New-Item -ItemType Directory -Path $env:EVIDENCE -Force | Out-Null
          "EVIDENCE=$env:EVIDENCE" | Out-File $env:GITHUB_ENV -Append
          @'
          import base64, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          g=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          h,p,b=[os.environ[x] for x in ('HEAD_SHA','PRODUCT_SHA','BASE_SHA')]
          prev=os.environ['PREVIOUS_SHA']; w='.github/workflows/miro-anchor-remediation.yml'
          assert g('rev-parse','HEAD')==h and g('rev-parse',h+'^')==prev
          assert g('rev-parse',prev+'^^^')==p and g('rev-parse',p+'^')==b
          assert g('show','-s','--format=%s',h)=='fix(ci): execute pinned REM-012.3.6 remediation'
          assert g('diff-tree','--no-commit-id','--name-only','-r',h)==w
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{os.environ['PAYLOAD_COMMENT_ID']}"
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r: item=json.load(r)
          assert item['user']['login']=='romanhlavac'
          m=re.search(r'```text\n([A-Za-z0-9+/=\n]+)\n```',item['body'])
          assert m
          raw=base64.b64decode(''.join(m.group(1).split()))
          assert hashlib.sha256(raw).hexdigest()==os.environ['PAYLOAD_SHA256']
          Path(os.environ['EVIDENCE'],'apply.py').write_bytes(raw)
          compile(raw,'apply.py','exec')
          Path(os.environ['EVIDENCE'],'identity.json').write_text(json.dumps({'status':'PASS','base_sha':b,'product_sha':p,'transport_sha':h,'payload_comment_id':int(os.environ['PAYLOAD_COMMENT_ID']),'payload_sha256':os.environ['PAYLOAD_SHA256'],'human_review_status':'PENDING','merge_allowed':False,'release_allowed':False},indent=2)+'\n')
          '@ | python -
      - name: Wait for exact-SHA CI
        shell: pwsh
        run: |
          @'
          import json,os,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; hdr={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=hdr)) as r:return json.load(r)
          def wait(sha,names):
            for _ in range(320):
              rs=get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs'];ok=True
              for n in names:
                xs=[x for x in rs if x['name']==n];x=max(xs,key=lambda z:z['run_number']) if xs else None
                if x and x['status']=='completed' and x['conclusion']!='success':raise SystemExit(f'{n}={x["conclusion"]}')
                ok &= bool(x and x['status']=='completed' and x['conclusion']=='success')
              if ok:return
              time.sleep(15)
            raise SystemExit('CI timeout')
          wait(os.environ['PRODUCT_SHA'],['Validate DDDA','DDDA exact-code Miro image probe'])
          wait(os.environ['HEAD_SHA'],['Validate DDDA','DDDA platform CI','DDDA exact-code Miro image probe'])
          '@ | python -
      - name: Verify Miro secret
        shell: pwsh
        env: {MIRO_ACCESS_TOKEN: "${{ secrets.MIRO_ACCESS_TOKEN }}"}
        run: if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)){throw 'MIRO_ACCESS_TOKEN required'}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ env.PRODUCT_SHA }}"}
      - name: Test and build candidate
        id: pkg
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH=Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_3_5_frame_00.py -q
          if($LASTEXITCODE){throw 'product tests failed'}
          git reset --hard $env:PRODUCT_SHA; git clean -ffdx
          $o=Join-Path $env:RUNNER_TEMP ('rem-012-3-6-'+$env:PRODUCT_SHA.Substring(0,12)+'.zip');$v='rem-012-3-6.'+$env:GITHUB_RUN_ID
          $p=(.\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $v -SourceRef $env:PRODUCT_SHA -OutputPath $o -Json|Out-String).Trim()|ConvertFrom-Json
          if([string]$p.source_commit-ne$env:PRODUCT_SHA){throw 'provenance mismatch'}
          "path=$($p.path)"|Out-File $env:GITHUB_OUTPUT -Append;"sha=$($p.sha256)"|Out-File $env:GITHUB_OUTPUT -Append
          [ordered]@{status='PASS';source_sha=$env:PRODUCT_SHA;package_sha256=[string]$p.sha256}|ConvertTo-Json|Set-Content (Join-Path $env:EVIDENCE 'package.json')
      - name: Apply and verify frame 00
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
          PACKAGE_PATH: ${{ steps.pkg.outputs.path }}
          PACKAGE_SHA256: ${{ steps.pkg.outputs.sha }}
          TRANSPORT_SHA: ${{ env.HEAD_SHA }}
        run: |
          $r=Join-Path $env:RUNNER_TEMP 'rem-012-3-6-package';Expand-Archive $env:PACKAGE_PATH $r -Force
          $rt=Join-Path $r 'runtime\miro';python -m pip install --disable-pip-version-check --no-input $rt;$env:PYTHONPATH=$rt
          $env:REMEDIATION_MANIFEST=Join-Path $r 'scaffolds\miro\rem-012-3-5-frame-00.yaml';$env:REPORT_PATH=Join-Path $env:EVIDENCE 'result.json'
          python (Join-Path $env:EVIDENCE 'apply.py')
          if($LASTEXITCODE){Get-Content $env:REPORT_PATH -ErrorAction SilentlyContinue;throw 'REM-012.3.6 failed'}
          $x=Get-Content $env:REPORT_PATH -Raw|ConvertFrom-Json
          if($x.status-ne'PASS'-or$x.second_run.unchanged-ne33-or$x.marker_item_count-ne12-or$x.detached_marker_count-ne0){throw 'verification failed'}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-3-6-frame-00-${{ env.PR_NUMBER }}-${{ env.PRODUCT_SHA }}
          path: ${{ env.EVIDENCE }}/**
          if-no-files-found: error
          retention-days: 30

name: DDDA REM-012.2 anchor remediation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-2-anchor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  anchor-remediation:
    name: Exact-code anchor remediation
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TRANSPORT_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_SOURCE_SHA: 65709005ca721202679241d6e33bd875e9c93a6e
      TARGET_PARENT_SHA: 640a344ad1bd638535d30f3e3a3217c2c66ce381
      CANONICAL_SOURCE_SHA: cccfa7d4cf999a3c9bb011f9125144e30f94f995
      IMPLEMENTATION_SHA: c7750543237506bb43e268e6523c72eba84d2ed9
      AUTHORIZED_BASE_SHA: 7badffb6ef6f3364569e68926eb511600eed38d3
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TRANSPORT_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'rem-012-2-anchor-remediation'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "EVIDENCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            pr = [int]$env:PR_NUMBER
            transport_sha = $env:TRANSPORT_SHA
            target_source_sha = $env:TARGET_SOURCE_SHA
            canonical_source_sha = $env:CANONICAL_SOURCE_SHA
            implementation_sha = $env:IMPLEMENTATION_SHA
            authorized_base_sha = $env:AUTHORIZED_BASE_SHA
            board_id = 'uXjVH1phki0='
            merge_allowed = $false
            promotion_allowed = $false
            release_allowed = $false
            human_review_status = 'PENDING'
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $root 'identity.json') -Encoding utf8

      - name: Verify immutable product source and transport-only lineage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Parents([string]$sha) {
            $line = (git show -s --format=%P $sha).Trim()
            if ([string]::IsNullOrWhiteSpace($line)) { return @() }
            return @($line.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries))
          }

          function ExactPaths([string]$base, [string]$head, [string[]]$expected, [string]$label) {
            $actual = @((git diff --name-only $base $head) | Where-Object { $_ })
            $unexpected = @($actual | Where-Object { $_ -notin $expected })
            $missing = @($expected | Where-Object { $_ -notin $actual })
            if ($unexpected.Count -or $missing.Count -or $actual.Count -ne $expected.Count) {
              throw "$label path mismatch. Unexpected: $($unexpected -join ', '); missing: $($missing -join ', '); actual=$($actual.Count), expected=$($expected.Count)."
            }
          }

          function WorkflowOnlyCommits([string]$base, [string]$head, [string]$label) {
            git merge-base --is-ancestor $base $head
            if ($LASTEXITCODE -ne 0) { throw "$label head is not descended from base." }
            $commits = @((git rev-list --reverse "$base..$head") | Where-Object { $_ })
            foreach ($commit in $commits) {
              if (@(Parents $commit).Count -ne 1) { throw "$label commit '$commit' is not linear." }
              $paths = @((git diff-tree --no-commit-id --name-only -r $commit) | Where-Object { $_ })
              if ($paths.Count -ne 1 -or $paths[0] -ne '.github/workflows/miro-anchor-remediation.yml') {
                throw "$label commit '$commit' changes unauthorized paths: $($paths -join ', ')."
              }
            }
            return $commits
          }

          if ((git rev-parse HEAD).Trim() -ne $env:TRANSPORT_SHA) { throw 'Transport checkout mismatch.' }

          $transportCommits = @(WorkflowOnlyCommits $env:TARGET_SOURCE_SHA $env:TRANSPORT_SHA 'Post-target transport')
          if ($transportCommits.Count -lt 1) { throw 'At least one post-target workflow-only transport commit is required.' }

          $targetParents = @(Parents $env:TARGET_SOURCE_SHA)
          if ($targetParents.Count -ne 1 -or $targetParents[0] -ne $env:TARGET_PARENT_SHA) { throw 'Target source parent mismatch.' }
          if ((git show -s --format=%s $env:TARGET_SOURCE_SHA).Trim() -ne 'fix(miro): align protected frame IDs with review board') { throw 'Target source identity mismatch.' }
          ExactPaths $env:TARGET_PARENT_SHA $env:TARGET_SOURCE_SHA @('scaffolds/miro/rem-012-2-anchor-frames.yaml') 'Remote-contract correction'

          $preTargetTransport = @(WorkflowOnlyCommits $env:CANONICAL_SOURCE_SHA $env:TARGET_PARENT_SHA 'Pre-target transport')

          $canonicalParents = @(Parents $env:CANONICAL_SOURCE_SHA)
          $implementationParents = @(Parents $env:IMPLEMENTATION_SHA)
          if ($canonicalParents.Count -ne 1 -or $canonicalParents[0] -ne $env:IMPLEMENTATION_SHA) { throw 'Canonical source parent mismatch.' }
          if ($implementationParents.Count -ne 1 -or $implementationParents[0] -ne $env:AUTHORIZED_BASE_SHA) { throw 'Implementation parent mismatch.' }
          if ((git show -s --format=%s $env:IMPLEMENTATION_SHA).Trim() -ne 'feat(miro): remediate anchor frames for human review') { throw 'Implementation identity mismatch.' }
          if ((git show -s --format=%s $env:CANONICAL_SOURCE_SHA).Trim() -ne 'fix(miro): restore anchor text canonicalization') { throw 'Canonical corrective identity mismatch.' }

          $implementationPaths = @(
            '.github/workflows/miro-anchor-remediation.yml'
            'docs/reviews/REM-PR8-HVA-CC-012-2-anchor-frames.md'
            'runtime/miro/ddda_miro/anchor_contract.py'
            'runtime/miro/ddda_miro/anchor_evidence.py'
            'runtime/miro/ddda_miro/anchor_plan.py'
            'runtime/miro/ddda_miro/anchor_remediation.py'
            'runtime/miro/tests/test_anchor_remediation.py'
            'scaffolds/miro/rem-012-2-anchor-frames.yaml'
            'schemas/miro-anchor-remediation.schema.json'
          )
          $canonicalCorrectivePaths = @(
            'runtime/miro/ddda_miro/anchor_contract.py'
            'runtime/miro/ddda_miro/anchor_evidence.py'
            'runtime/miro/ddda_miro/anchor_plan.py'
            'runtime/miro/tests/test_anchor_remediation.py'
          )
          ExactPaths $env:AUTHORIZED_BASE_SHA $env:IMPLEMENTATION_SHA $implementationPaths 'Implementation'
          ExactPaths $env:IMPLEMENTATION_SHA $env:CANONICAL_SOURCE_SHA $canonicalCorrectivePaths 'Canonical corrective'

          [ordered]@{
            status = 'PASS'
            transport_sha = $env:TRANSPORT_SHA
            post_target_transport_commits = $transportCommits
            target_source_sha = $env:TARGET_SOURCE_SHA
            target_parent_sha = $env:TARGET_PARENT_SHA
            remote_contract_correction_path = 'scaffolds/miro/rem-012-2-anchor-frames.yaml'
            pre_target_transport_commits = $preTargetTransport
            canonical_source_sha = $env:CANONICAL_SOURCE_SHA
            implementation_sha = $env:IMPLEMENTATION_SHA
            authorized_base_sha = $env:AUTHORIZED_BASE_SHA
          } | ConvertTo-Json -Depth 20 |
            Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'source-contract.json') -Encoding utf8

      - name: Verify exact-SHA CI evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Runs([string]$sha) {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request&per_page=100"
            return @((Invoke-RestMethod -Method Get -Uri $uri -Headers $headers).workflow_runs)
          }

          function LatestRun([object[]]$runs, [string]$name) {
            return @($runs | Where-Object { [string]$_.name -eq $name } | Sort-Object run_number -Descending) | Select-Object -First 1
          }

          function WaitTransport([string]$sha, [int]$attempts) {
            $required = @('Validate DDDA', 'DDDA platform CI', 'DDDA exact-code Miro image probe')
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              $runs = @(Runs $sha)
              $evidence = @()
              $allPassed = $true
              foreach ($name in $required) {
                $run = LatestRun $runs $name
                if ($null -eq $run) {
                  $allPassed = $false
                  $evidence += [ordered]@{ name = $name; status = 'missing'; conclusion = $null; run_id = $null }
                  continue
                }
                $evidence += [ordered]@{ name = [string]$run.name; status = [string]$run.status; conclusion = [string]$run.conclusion; run_id = [long]$run.id; html_url = [string]$run.html_url }
                if ([string]$run.status -eq 'completed' -and [string]$run.conclusion -ne 'success') {
                  $evidence | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'transport-ci.json') -Encoding utf8
                  throw "Transport workflow '$name' failed with '$($run.conclusion)'."
                }
                if ([string]$run.status -ne 'completed' -or [string]$run.conclusion -ne 'success') { $allPassed = $false }
              }
              $evidence | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'transport-ci.json') -Encoding utf8
              if ($allPassed) { return }
              if ($attempt -lt $attempts) { Start-Sleep -Seconds 15 }
            }
            throw 'Transport CI did not reach PASS.'
          }

          $targetRuns = @(Runs $env:TARGET_SOURCE_SHA)
          $targetValidate = LatestRun $targetRuns 'Validate DDDA'
          $targetProbe = LatestRun $targetRuns 'DDDA exact-code Miro image probe'
          $targetPlatform = LatestRun $targetRuns 'DDDA platform CI'
          if ($null -eq $targetValidate -or [string]$targetValidate.status -ne 'completed' -or [string]$targetValidate.conclusion -ne 'success') {
            throw 'Target-source Validate DDDA evidence is not PASS.'
          }
          if ($null -eq $targetProbe -or [string]$targetProbe.status -ne 'completed' -or [string]$targetProbe.conclusion -ne 'success') {
            throw 'Target-source exact-code image probe evidence is not PASS.'
          }
          if ($null -eq $targetPlatform) { throw 'Target-source platform CI evidence is missing.' }

          $jobsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$([long]$targetPlatform.id)/jobs?per_page=100"
          $targetJobs = @((Invoke-RestMethod -Method Get -Uri $jobsUri -Headers $headers).jobs)
          $platformJob = @($targetJobs | Where-Object { [string]$_.name -eq 'Platform validation' } | Sort-Object id -Descending) | Select-Object -First 1
          if ($null -eq $platformJob -or [string]$platformJob.status -ne 'completed' -or [string]$platformJob.conclusion -ne 'success') {
            throw 'Target-source package-first Platform validation job is not PASS.'
          }

          [ordered]@{
            validation = @{ run_id = [long]$targetValidate.id; conclusion = [string]$targetValidate.conclusion }
            image_probe = @{ run_id = [long]$targetProbe.id; conclusion = [string]$targetProbe.conclusion }
            platform_validation = @{ run_id = [long]$targetPlatform.id; job_id = [long]$platformJob.id; conclusion = [string]$platformJob.conclusion }
            note = 'Historical target source uses job-level package validation because PR-head validation is defined only for the current transport head.'
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'target-source-ci.json') -Encoding utf8

          WaitTransport $env:TRANSPORT_SHA 220

      - name: Verify Miro secret
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) { throw 'MIRO_ACCESS_TOKEN is required.' }

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SOURCE_SHA }}

      - name: Run targeted tests and restore clean tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml jsonschema
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_anchor_remediation.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Targeted tests failed.' }
          git reset --hard $env:TARGET_SOURCE_SHA
          git clean -ffdx
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SOURCE_SHA -or (git status --porcelain)) { throw 'Product source is not clean.' }

      - name: Build exact-SHA candidate
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'rem-012-2.' + $env:GITHUB_RUN_ID + '.' + $env:TARGET_SOURCE_SHA.Substring(0, 12)
          $output = Join-Path $env:RUNNER_TEMP ('ddda-rem-012-2-' + $env:TARGET_SOURCE_SHA.Substring(0, 12) + '.zip')
          $json = .\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $version -SourceRef $env:TARGET_SOURCE_SHA -OutputPath $output -Json | Out-String
          $package = $json.Trim() | ConvertFrom-Json
          if ([string]$package.source_commit -ne $env:TARGET_SOURCE_SHA) { throw 'Candidate provenance mismatch.' }
          [ordered]@{ status = 'PASS'; transport_sha = $env:TRANSPORT_SHA; target_source_sha = $env:TARGET_SOURCE_SHA; package_path = [string]$package.path; package_sha256 = [string]$package.sha256; package_source_commit = [string]$package.source_commit } |
            ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'package.json') -Encoding utf8
          "package_path=$($package.path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sha256=$($package.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run exact-code REM-012.2
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:EVIDENCE_ROOT 'result.json'
          $stderrPath = Join-Path $env:EVIDENCE_ROOT 'stderr.log'
          $candidate = '${{ steps.package.outputs.package_path }}'
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $candidate -ExpectedCommit $env:TARGET_SOURCE_SHA -ExpectedKind candidate

          $packageRoot = Join-Path $env:RUNNER_TEMP 'rem-012-2-package'
          if (Test-Path -LiteralPath $packageRoot) { Remove-Item -LiteralPath $packageRoot -Recurse -Force }
          Expand-Archive -LiteralPath $candidate -DestinationPath $packageRoot -Force
          $manifest = Get-Content -LiteralPath (Join-Path $packageRoot 'ddda-package.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$manifest.source_commit -ne $env:TARGET_SOURCE_SHA -or [string]$manifest.kind -ne 'candidate') { throw 'Expanded package provenance mismatch.' }

          $runtime = Join-Path $packageRoot 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Candidate runtime installation failed.' }
          $env:PYTHONPATH = $runtime
          $env:GITHUB_SHA = $env:TARGET_SOURCE_SHA
          $anchorManifest = Join-Path $packageRoot 'scaffolds\miro\rem-012-2-anchor-frames.yaml'
          python -m ddda_miro.anchor_remediation --manifest $anchorManifest --report $reportPath --source-sha $env:TARGET_SOURCE_SHA --apply 2> $stderrPath
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $stderrPath -ErrorAction SilentlyContinue
            throw 'REM-012.2 execution failed.'
          }

          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$report.status -ne 'PASS') { throw 'Technical status is not PASS.' }
          if ([string]$report.source_sha -ne $env:TARGET_SOURCE_SHA -or [string]$report.board_id -ne 'uXjVH1phki0=') { throw 'Result identity mismatch.' }
          if ([int]$report.images.asset_count -ne 17) { throw 'Image asset count mismatch.' }
          if ([int]$report.images.second_run.created -ne 0 -or [int]$report.images.second_run.updated -ne 0 -or [int]$report.images.second_run.unchanged -ne 17) { throw 'Second image reconcile is not zero mutation.' }
          if (@($report.images.remote_verification.items).Count -ne 17) { throw 'Remote image verification count mismatch.' }
          foreach ($item in @($report.images.remote_verification.items)) {
            if ([string]$item.remote_type -ne 'image' -or [string]$item.sha256 -notmatch '^[0-9a-f]{64}$') { throw "Invalid remote image evidence for '$($item.target_item_id)'." }
          }
          if ([string]$report.native_table.status -ne 'PASS' -or [string]$report.native_table.type -ne 'data_table_format') { throw 'Native table verification failed.' }
          if ([int]$report.geometry.collision_count -ne 0) { throw 'Anchor overlap remains.' }
          if (-not [bool]$report.protected_frames.unchanged -or [int]$report.protected_frames.count -ne 15) { throw 'Protected frames changed.' }
          if ([string]$report.human_review_status -ne 'PENDING' -or [string]$report.overall_status -ne 'READY_FOR_HUMAN_REVIEW') { throw 'HVR checkpoint semantics failed.' }

          @(
            "Transport SHA: $env:TRANSPORT_SHA"
            "Product source SHA: $env:TARGET_SOURCE_SHA"
            "Candidate SHA-256: ${{ steps.package.outputs.package_sha256 }}"
            "Frames: updated=$($report.frames.updated), unchanged=$($report.frames.unchanged)"
            "Images: $($report.images.asset_count), second-run mutations=0"
            "Protected frames: $($report.protected_frames.count), unchanged=$($report.protected_frames.unchanged)"
            "Human review: $($report.human_review_status)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-2-anchor-remediation-${{ env.PR_NUMBER }}-${{ env.TARGET_SOURCE_SHA }}
          path: ${{ runner.temp }}/rem-012-2-anchor-remediation/**
          if-no-files-found: error
          retention-days: 30

name: DDDA REM-012.3.6 frame 00 preflight
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions: {contents: read}
concurrency: {group: "ddda-rem-012-3-6-${{ github.ref }}", cancel-in-progress: false}
jobs:
  preflight:
    if: github.event.pull_request.number == 8 && github.actor == 'romanhlavac' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BAD_TRANSPORT_SHA: 228bc5783e6313685d826a32cf4133d9f79a97c9
      PRODUCT_SHA: 8b50f8e8c0e47521a8028010058db48c6f79fb95
      BASE_SHA: 12d7b67cca1c4c3fc68d3de4b7033a375368ce3a
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ env.HEAD_SHA }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify exact lineage and allowlists
        shell: pwsh
        run: |
          @'
          import os,subprocess
          g=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          h,bad,p,b=[os.environ[x] for x in ('HEAD_SHA','BAD_TRANSPORT_SHA','PRODUCT_SHA','BASE_SHA')]
          w='.github/workflows/miro-anchor-remediation.yml'
          assert g('rev-parse','HEAD')==h
          assert g('rev-parse',h+'^')==bad
          assert g('rev-parse',bad+'^')==p
          assert g('rev-parse',p+'^')==b
          assert g('show','-s','--format=%s',p)=='fix(miro): align REM-012.3.6 maturity markers'
          assert sorted(g('diff-tree','--no-commit-id','--name-only','-r',p).splitlines())==sorted(['scaffolds/miro/rem-012-3-5-frame-00.yaml','runtime/miro/tests/test_rem_012_3_5_frame_00.py'])
          assert g('show','-s','--format=%s',bad)=='fix(ci): authorize REM-012.3.6 frame 00 remediation'
          assert g('diff-tree','--no-commit-id','--name-only','-r',bad)==w
          assert g('show','-s','--format=%s',h)=='fix(ci): replace REM-012.3.6 transport workflow'
          assert g('diff-tree','--no-commit-id','--name-only','-r',h)==w
          '@|python -
      - name: Run exact product tests
        shell: pwsh
        run: |
          git checkout --force $env:PRODUCT_SHA
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19'
          python -m pytest runtime/miro/tests/test_rem_012_3_5_frame_00.py -q
          if($LASTEXITCODE){throw 'REM-012.3.6 product tests failed'}

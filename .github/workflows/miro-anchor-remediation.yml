name: DDDA REM-012.3.4 frame 00 screenshot remediation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-3-4-frame-00-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Exact-code frame 00 screenshot remediation
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TRANSPORT_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCT_SHA: 747bd48a9ca6fdda92c6887dc7d3bd34e8ea0193
      BASE_SHA: afabd41ad2767984c62029d4db6c4c3862706dd1
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TRANSPORT_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact lineage and initialize evidence
        shell: pwsh
        run: |
          $env:EVIDENCE_ROOT = Join-Path $env:RUNNER_TEMP 'rem-012-3-4-frame-00'
          New-Item -ItemType Directory -Path $env:EVIDENCE_ROOT -Force | Out-Null
          "EVIDENCE_ROOT=$env:EVIDENCE_ROOT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          transport = os.environ["TRANSPORT_SHA"]
          product = os.environ["PRODUCT_SHA"]
          base = os.environ["BASE_SHA"]
          workflow = ".github/workflows/miro-anchor-remediation.yml"
          if git("rev-parse", "HEAD") != transport:
              raise SystemExit("transport checkout mismatch")
          if git("rev-parse", f"{transport}^") != product:
              raise SystemExit("transport parent mismatch")
          if git("rev-parse", f"{product}^") != base:
              raise SystemExit("product parent mismatch")
          if git("show", "-s", "--format=%s", product) != "fix(miro): align frame 00 summary to approved screenshot":
              raise SystemExit("product message mismatch")
          product_paths = sorted(filter(None, git("diff-tree", "--no-commit-id", "--name-only", "-r", product).splitlines()))
          expected_product_paths = sorted([
              "scaffolds/miro/rem-012-3-hvr-remediation.yaml",
              "runtime/miro/tests/test_hvr_remediation.py",
          ])
          if product_paths != expected_product_paths:
              raise SystemExit(f"product allowlist mismatch: {product_paths}")
          if git("show", "-s", "--format=%s", transport) != "fix(ci): authorize REM-012.3.4 frame 00 remediation":
              raise SystemExit("transport message mismatch")
          transport_paths = list(filter(None, git("diff-tree", "--no-commit-id", "--name-only", "-r", transport).splitlines()))
          if transport_paths != [workflow]:
              raise SystemExit(f"transport is not workflow-only: {transport_paths}")
          Path(os.environ["EVIDENCE_ROOT"], "identity.json").write_text(
              json.dumps({
                  "status": "PASS",
                  "product_sha": product,
                  "transport_sha": transport,
                  "base_sha": base,
                  "product_paths": product_paths,
                  "transport_paths": transport_paths,
                  "merge_allowed": False,
                  "promotion_allowed": False,
                  "release_allowed": False,
                  "gate_approval_allowed": False,
                  "human_review_status": "PENDING",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          '@ | python -

      - name: Wait for exact-SHA CI
        shell: pwsh
        run: |
          @'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def wait_for(sha, required, label):
              for _ in range(320):
                  runs = get(
                      f"https://api.github.com/repos/{repo}/actions/runs"
                      f"?head_sha={sha}&event=pull_request&per_page=100"
                  )["workflow_runs"]
                  state = []
                  complete = True
                  for name in required:
                      matches = [run for run in runs if run["name"] == name]
                      run = max(matches, key=lambda item: item["run_number"]) if matches else None
                      state.append({
                          "name": name,
                          "id": run and run["id"],
                          "status": run and run["status"],
                          "conclusion": run and run["conclusion"],
                          "html_url": run and run["html_url"],
                      })
                      if run and run["status"] == "completed" and run["conclusion"] != "success":
                          raise SystemExit(f"{label} workflow {name} failed: {run['conclusion']}")
                      complete &= bool(run and run["status"] == "completed" and run["conclusion"] == "success")
                  Path(os.environ["EVIDENCE_ROOT"], f"{label}-ci.json").write_text(
                      json.dumps(state, indent=2) + "\n",
                      encoding="utf-8",
                  )
                  if complete:
                      return state
                  time.sleep(15)
              raise SystemExit(f"{label} CI timeout")

          required = ["Validate DDDA", "DDDA platform CI", "DDDA exact-code Miro image probe"]
          product = wait_for(os.environ["PRODUCT_SHA"], required, "product")
          transport = wait_for(os.environ["TRANSPORT_SHA"], required, "transport")
          Path(os.environ["EVIDENCE_ROOT"], "ci-summary.json").write_text(
              json.dumps({"product": product, "transport": transport}, indent=2) + "\n",
              encoding="utf-8",
          )
          '@ | python -

      - name: Verify Miro secret
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) {
            throw 'MIRO_ACCESS_TOKEN is required.'
          }

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.PRODUCT_SHA }}

      - name: Test and build exact-SHA candidate
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_hvr_remediation.py runtime/miro/tests/test_hvr_remediation_inventory_compat.py runtime/miro/tests/test_hvr_remediation_api_compat.py runtime/miro/tests/test_anchor_remediation.py -q
          if ($LASTEXITCODE -ne 0) {
            throw 'Targeted REM-012.3.4 tests failed.'
          }
          git reset --hard $env:PRODUCT_SHA
          git clean -ffdx
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SHA -or (git status --porcelain)) {
            throw 'Product source is not clean.'
          }
          $version = 'rem-012-3-4.' + $env:GITHUB_RUN_ID + '.' + $env:PRODUCT_SHA.Substring(0, 12)
          $output = Join-Path $env:RUNNER_TEMP ('ddda-rem-012-3-4-' + $env:PRODUCT_SHA.Substring(0, 12) + '.zip')
          $package = (.\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $version -SourceRef $env:PRODUCT_SHA -OutputPath $output -Json | Out-String).Trim() | ConvertFrom-Json
          if ([string]$package.source_commit -ne $env:PRODUCT_SHA) {
            throw 'Candidate provenance mismatch.'
          }
          [ordered]@{
            status = 'PASS'
            source_sha = $env:PRODUCT_SHA
            package_path = [string]$package.path
            package_sha256 = [string]$package.sha256
          } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_ROOT 'package.json') -Encoding utf8
          "path=$($package.path)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$($package.sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Apply, read back, and reconcile frame 00
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'rem-012-3-4-package'
          Expand-Archive $env:PACKAGE_PATH $packageRoot -Force
          $runtime = Join-Path $packageRoot 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH = $runtime
          $env:MANIFEST = Join-Path $packageRoot 'scaffolds\miro\rem-012-3-hvr-remediation.yaml'
          $env:REPORT = Join-Path $env:EVIDENCE_ROOT 'result.json'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path

          from ddda_miro.anchor_contract import (
              _close,
              _get_item,
              _patch,
              _protected_snapshot,
              _seg,
              _writable,
              canonical_miro_text,
          )
          from ddda_miro.client import MiroClient
          from ddda_miro.yamlio import load_yaml

          BOARD = "uXjVH1phki0="
          FRAME = "3458764679756478046"
          PANEL_ID = "3458764679756523217"
          SUMMARY_ID = "3458764679756523219"
          FIXED_IDS = {PANEL_ID, SUMMARY_ID}

          manifest = load_yaml(Path(os.environ["MANIFEST"]))
          client = MiroClient(os.environ["MIRO_ACCESS_TOKEN"])
          updates = {str(item["id"]): item for item in manifest["updates"]}
          panel_spec = updates[PANEL_ID]
          summary_spec = updates[SUMMARY_ID]
          legend_spec = updates["3458764679756523220"]
          registry_spec = manifest["frame_00_registry_reference"]
          maturity_specs = manifest["frame_00_maturity_items"]

          protected_ids = [
              str(manifest["frames"]["journey"]["id"]),
              str(manifest["frames"]["align"]["id"]),
              *[str(item) for item in manifest["protected_frames"]],
          ]

          def text(item):
              return canonical_miro_text((item.get("data") or {}).get("content"))

          def stable(item):
              return {
                  "id": str(item.get("id") or ""),
                  "type": str(item.get("type") or ""),
                  "parent": str((item.get("parent") or {}).get("id") or ""),
                  "data": item.get("data") or {},
                  "style": item.get("style") or {},
                  "geometry": item.get("geometry") or {},
                  "position": item.get("position") or {},
              }

          def digest(items):
              raw = json.dumps(
                  sorted((stable(item) for item in items), key=lambda item: item["id"]),
                  sort_keys=True,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def normalize(value):
              return str(value).lower() if isinstance(value, str) else value

          def payload_from_spec(spec, item_type):
              payload = {
                  "parent": {"id": FRAME},
                  "position": {
                      "x": float(spec["x"]),
                      "y": float(spec["y"]),
                      "origin": "center",
                  },
                  "data": {"content": str(spec["content"])},
                  "style": {
                      "fontSize": int(spec["font_size"]),
                      **dict(spec.get("style") or {}),
                  },
                  "geometry": {"width": float(spec["width"])},
              }
              if item_type == "shape":
                  payload["data"]["shape"] = "rectangle"
                  payload["geometry"]["height"] = float(spec["height"])
              return payload

          def payload_from_maturity(spec):
              return {
                  "parent": {"id": FRAME},
                  "position": {
                      "x": float(spec["x"]),
                      "y": float(spec["y"]),
                      "origin": "center",
                  },
                  "data": {
                      "shape": "rectangle",
                      "content": f"<p><strong>{int(spec['count'])} · {spec['label']}</strong></p>",
                  },
                  "geometry": {
                      "width": float(spec["width"]),
                      "height": float(spec["height"]),
                  },
                  "style": {
                      "fillColor": str(spec["fill_color"]),
                      "fillOpacity": "1.0",
                      "fontFamily": "arial",
                      "fontSize": int(spec["font_size"]),
                      "borderColor": "#4B79A1",
                      "borderWidth": 2,
                      "borderOpacity": "1.0",
                      "borderStyle": "normal",
                      "textAlign": "center",
                      "textAlignVertical": "middle",
                      "color": str(spec["text_color"]),
                  },
              }

          def matches(remote, expected, item_type):
              if str(remote.get("type") or "") != item_type:
                  return False
              if str((remote.get("parent") or {}).get("id") or "") != FRAME:
                  return False
              if text(remote) != canonical_miro_text(expected["data"]["content"]):
                  return False
              position = remote.get("position") or {}
              if not _close(position.get("x"), expected["position"]["x"]):
                  return False
              tolerance = 180 if item_type == "text" else 1
              if abs(float(position.get("y") or 0) - float(expected["position"]["y"])) > tolerance:
                  return False
              geometry = remote.get("geometry") or {}
              for key, value in expected["geometry"].items():
                  if not _close(geometry.get(key), value):
                      return False
              style = remote.get("style") or {}
              for key, value in expected["style"].items():
                  actual = style.get(key)
                  if key in {"fillColor", "borderColor", "color"}:
                      if normalize(actual) != normalize(value):
                          return False
                  elif key in {"fontSize", "borderWidth"}:
                      if not _close(actual, value):
                          return False
                  elif actual != value:
                      return False
              return True

          snapshots = {}
          created = []
          deleted = []
          stale_ids = set()

          def update_existing(item_id, spec, item_type):
              remote = _get_item(client, BOARD, item_id)
              snapshots.setdefault(item_id, remote)
              expected = payload_from_spec(spec, item_type)
              if matches(remote, expected, item_type):
                  return item_id, "unchanged"
              payload = _writable(remote)
              payload.update({
                  "parent": expected["parent"],
                  "position": expected["position"],
                  "geometry": expected["geometry"],
              })
              payload.setdefault("data", {})["content"] = expected["data"]["content"]
              if item_type == "shape":
                  payload["data"]["shape"] = "rectangle"
              payload["style"] = {**(payload.get("style") or {}), **expected["style"]}
              updated = _patch(client, BOARD, item_type, item_id, payload)
              if not matches(updated, expected, item_type):
                  raise ValueError(f"fixed item {item_id} read-back mismatch")
              return item_id, "updated"

          def find_candidates(item_type, predicate):
              return [
                  item
                  for item in client.list_items(BOARD, item_type)
                  if str((item.get("parent") or {}).get("id") or "") == FRAME
                  and predicate(text(item))
              ]

          def upsert_semantic(item_type, expected, predicate):
              candidates = find_candidates(item_type, predicate)
              exact = [item for item in candidates if matches(item, expected, item_type)]
              if len(exact) > 1:
                  raise ValueError("duplicate exact semantic target")
              if exact:
                  stale_ids.update(
                      str(item["id"]) for item in candidates if str(item["id"]) != str(exact[0]["id"])
                  )
                  return str(exact[0]["id"]), "unchanged"
              if len(candidates) > 1:
                  raise ValueError("ambiguous semantic source")
              if candidates:
                  current = candidates[0]
                  item_id = str(current["id"])
                  snapshots.setdefault(item_id, current)
                  try:
                      updated = _patch(client, BOARD, item_type, item_id, expected)
                      if matches(updated, expected, item_type):
                          return item_id, "updated"
                  except Exception:
                      pass
                  stale_ids.add(item_id)
              endpoint = "shapes" if item_type == "shape" else "texts"
              created_item = client._request(
                  "POST",
                  f"boards/{_seg(BOARD)}/{endpoint}",
                  body=expected,
              )
              item_id = str(created_item["id"])
              created.append(item_id)
              if not matches(created_item, expected, item_type):
                  raise ValueError(f"created {item_type} {item_id} read-back mismatch")
              return item_id, "created"

          def maturity_predicate(label):
              return lambda value: label in value

          panel_before = _get_item(client, BOARD, PANEL_ID)
          summary_before = _get_item(client, BOARD, SUMMARY_ID)
          if "ARTIFACT HEALTH — acceptance-claims-modernization" not in text(panel_before):
              raise ValueError("panel precondition mismatch")
          if "3 ARTEFAKTY" not in text(summary_before):
              raise ValueError("summary precondition mismatch")

          all_before = client.list_items(BOARD)
          current_managed_ids = {
              PANEL_ID,
              SUMMARY_ID,
              *[
                  str(item["id"])
                  for item in all_before
                  if str((item.get("parent") or {}).get("id") or "") == FRAME
                  and (
                      "ARTIFACT REGISTRY" in text(item)
                      or (
                          "MATURITY" in text(item)
                          and "ATTENTION" in text(item)
                          and str(item.get("type")) == "text"
                      )
                      or any(spec["label"] in text(item) for spec in maturity_specs)
                  )
              ],
          }
          protected_before = _protected_snapshot(client, BOARD, protected_ids)
          unmanaged_before = digest([
              item
              for item in all_before
              if str((item.get("parent") or {}).get("id") or "") == FRAME
              and str(item.get("id") or "") not in current_managed_ids
          ])

          def reconcile():
              result = {"created": 0, "updated": 0, "unchanged": 0, "item_ids": []}
              for item_id, spec in ((PANEL_ID, panel_spec), (SUMMARY_ID, summary_spec)):
                  resolved_id, action = update_existing(item_id, spec, "shape")
                  result[action] += 1
                  result["item_ids"].append(resolved_id)

              legend_expected = payload_from_spec(legend_spec, "text")
              legend_id, action = upsert_semantic(
                  "text",
                  legend_expected,
                  lambda value: (
                      ("MATURITY" in value and "REVIEW FLAGS" in value)
                      or ("MATURITY" in value and "ATTENTION" in value and "BLOCKING" in value)
                  ),
              )
              result[action] += 1
              result["item_ids"].append(legend_id)

              registry_expected = payload_from_spec(registry_spec, "text")
              registry_id, action = upsert_semantic(
                  "text",
                  registry_expected,
                  lambda value: "ARTIFACT REGISTRY" in value,
              )
              result[action] += 1
              result["item_ids"].append(registry_id)

              for spec in maturity_specs:
                  expected = payload_from_maturity(spec)
                  item_id, action = upsert_semantic(
                      "shape",
                      expected,
                      maturity_predicate(str(spec["label"])),
                  )
                  result[action] += 1
                  result["item_ids"].append(item_id)
              return result

          def rollback():
              errors = []
              for item_id in reversed(created):
                  try:
                      client.delete_item(BOARD, item_id)
                  except Exception as exc:
                      errors.append(f"delete created {item_id}: {exc}")
              for item_id, snapshot in reversed(list(snapshots.items())):
                  try:
                      if item_id in deleted:
                          endpoint = "shapes" if snapshot["type"] == "shape" else "texts"
                          client._request(
                              "POST",
                              f"boards/{_seg(BOARD)}/{endpoint}",
                              body=_writable(snapshot),
                          )
                      else:
                          _patch(client, BOARD, snapshot["type"], item_id, _writable(snapshot))
                  except Exception as exc:
                      errors.append(f"restore {item_id}: {exc}")
              return {"status": "PASS" if not errors else "PARTIAL", "errors": errors}

          report_path = Path(os.environ["REPORT"])
          try:
              first = reconcile()
              second = reconcile()
              if second["created"] or second["updated"] or second["unchanged"] != 10:
                  raise ValueError(f"second reconcile mutated target: {second}")

              active_ids = set(second["item_ids"])
              for item_id in sorted(stale_ids):
                  if item_id in active_ids:
                      continue
                  if item_id not in snapshots:
                      try:
                          snapshots[item_id] = _get_item(client, BOARD, item_id)
                      except Exception:
                          pass
                  client.delete_item(BOARD, item_id)
                  deleted.append(item_id)

              final_items = client.list_items(BOARD)
              protected_after = _protected_snapshot(client, BOARD, protected_ids)
              if protected_after["digest"] != protected_before["digest"]:
                  raise ValueError("frames 01, 10, or 20+ changed")
              unmanaged_after = digest([
                  item
                  for item in final_items
                  if str((item.get("parent") or {}).get("id") or "") == FRAME
                  and str(item.get("id") or "") not in active_ids
              ])
              if unmanaged_after != unmanaged_before:
                  raise ValueError("unmanaged frame 00 item changed")

              final_by_id = {str(item["id"]): item for item in final_items}
              for item_id in active_ids:
                  if item_id not in final_by_id:
                      raise ValueError(f"managed item {item_id} missing after cleanup")

              summary_text = text(final_by_id[SUMMARY_ID])
              if not all(
                  phrase in summary_text
                  for phrase in (
                      "3 ARTEFAKTY",
                      "Summary maturity:",
                      "SCAFFOLD: 1",
                      "WORKING: 2",
                      "SUPERSEDED: 0",
                      "Summary review flagů:",
                      "ATTENTION: 1",
                      "BLOCKING: 0",
                  )
              ):
                  raise ValueError("summary screenshot contract mismatch")

              result = {
                  "status": "PASS",
                  "technical_status": "PASS",
                  "remediation_id": "REM-PR8-HVA-CC-012.3.4",
                  "board_id": BOARD,
                  "product_sha": os.environ["PRODUCT_SHA"],
                  "transport_sha": os.environ["TRANSPORT_SHA"],
                  "candidate_sha256": os.environ["PACKAGE_SHA256"],
                  "authorized_frame": "00",
                  "first_run": first,
                  "second_run": second,
                  "zero_mutation_second_run": True,
                  "deleted_stale_items": deleted,
                  "protected_frames": {
                      "count": len(protected_ids),
                      "unchanged": True,
                      "before_digest": protected_before["digest"],
                      "after_digest": protected_after["digest"],
                  },
                  "frame_00_unmanaged_unchanged": True,
                  "rollback": {"status": "NOT_REQUIRED"},
                  "human_review_status": "PENDING",
                  "overall_status": "READY_FOR_HUMAN_REVIEW",
              }
              report_path.write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          except Exception as exc:
              result = {
                  "status": "FAIL",
                  "technical_status": "FAIL",
                  "error": str(exc),
                  "rollback": rollback(),
                  "human_review_status": "PENDING",
                  "overall_status": "NOT_READY_FOR_HUMAN_REVIEW",
              }
              report_path.write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              raise
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            Get-Content $env:REPORT -ErrorAction SilentlyContinue
            throw 'REM-012.3.4 frame 00 execution failed.'
          }
          $result = Get-Content $env:REPORT -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$result.status -ne 'PASS' -or [string]$result.technical_status -ne 'PASS') {
            throw 'Technical status is not PASS.'
          }
          if (-not [bool]$result.zero_mutation_second_run) {
            throw 'Second reconcile was not idempotent.'
          }
          if (-not [bool]$result.protected_frames.unchanged -or [int]$result.protected_frames.count -ne 17) {
            throw 'Protected frames changed.'
          }
          if (-not [bool]$result.frame_00_unmanaged_unchanged) {
            throw 'Unmanaged frame 00 content changed.'
          }
          @(
            "REM-012.3.4 technical status: $($result.technical_status)"
            "Product SHA: $env:PRODUCT_SHA"
            "Transport SHA: $env:TRANSPORT_SHA"
            "Candidate SHA-256: $env:PACKAGE_SHA256"
            "Managed frame 00 items: 10"
            "Second reconcile: zero mutation"
            "Frames 01, 10 and 20+: unchanged"
            "Human review: PENDING — repeat HVR-1 only"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-3-4-frame-00-${{ env.PR_NUMBER }}-${{ env.PRODUCT_SHA }}
          path: ${{ env.EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30

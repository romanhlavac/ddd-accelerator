name: DDDA REM-012.3.5 frame 00 maturity summary remediation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions: {actions: read, contents: read}
concurrency:
  group: ddda-rem-012-3-5-frame-00-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.pull_request.number == 8 && github.actor == 'romanhlavac' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TRANSPORT_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCT_SHA: e781e01d1144b56bb16698b7f6245ea85dc19a77
      BASE_SHA: e4b0c99f21517a9291a165cbb38d17cb57241fa1
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ env.TRANSPORT_SHA }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Verify exact lineage
        shell: pwsh
        run: |
          $env:EVIDENCE = Join-Path $env:RUNNER_TEMP 'rem-012-3-5'
          New-Item -ItemType Directory -Path $env:EVIDENCE -Force | Out-Null
          "EVIDENCE=$env:EVIDENCE" | Out-File $env:GITHUB_ENV -Append
          @'
          import json, os, subprocess
          from pathlib import Path
          g=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          h,p,b=os.environ['TRANSPORT_SHA'],os.environ['PRODUCT_SHA'],os.environ['BASE_SHA']
          w='.github/workflows/miro-anchor-remediation.yml'
          assert g('rev-parse','HEAD')==h
          assert g('rev-parse',h+'^')==p
          assert g('rev-parse',p+'^')==b
          assert g('show','-s','--format=%s',p)=='fix(miro): place maturity counts in frame 00 summary'
          assert sorted(g('diff-tree','--no-commit-id','--name-only','-r',p).splitlines())==sorted([
            'scaffolds/miro/rem-012-3-5-frame-00.yaml',
            'runtime/miro/tests/test_rem_012_3_5_frame_00.py'])
          assert g('show','-s','--format=%s',h)=='fix(ci): authorize REM-012.3.5 frame 00 remediation'
          assert g('diff-tree','--no-commit-id','--name-only','-r',h)==w
          Path(os.environ['EVIDENCE'],'identity.json').write_text(json.dumps({
            'status':'PASS','base_sha':b,'product_sha':p,'transport_sha':h,
            'merge_allowed':False,'release_allowed':False,'gate_approval_allowed':False,
            'human_review_status':'PENDING'},indent=2)+'\n')
          '@ | python -

      - name: Wait for exact-SHA CI
        shell: pwsh
        run: |
          @'
          import json, os, time, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:return json.load(r)
          def wait(sha,names,label):
            for _ in range(320):
              runs=get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs']
              state=[]; complete=True
              for name in names:
                found=[x for x in runs if x['name']==name]
                run=max(found,key=lambda x:x['run_number']) if found else None
                state.append({'name':name,'id':run and run['id'],'status':run and run['status'],'conclusion':run and run['conclusion']})
                if run and run['status']=='completed' and run['conclusion']!='success':raise SystemExit(f'{label} {name}={run["conclusion"]}')
                complete &= bool(run and run['status']=='completed' and run['conclusion']=='success')
              Path(os.environ['EVIDENCE'],label+'-ci.json').write_text(json.dumps(state,indent=2)+'\n')
              if complete:return
              time.sleep(15)
            raise SystemExit(label+' CI timeout')
          wait(os.environ['PRODUCT_SHA'],['Validate DDDA','DDDA exact-code Miro image probe'],'product')
          wait(os.environ['TRANSPORT_SHA'],['Validate DDDA','DDDA platform CI','DDDA exact-code Miro image probe'],'transport')
          '@ | python -

      - name: Verify Miro secret
        shell: pwsh
        env: {MIRO_ACCESS_TOKEN: '${{ secrets.MIRO_ACCESS_TOKEN }}'}
        run: if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) { throw 'MIRO_ACCESS_TOKEN required' }

      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ env.PRODUCT_SHA }}'}

      - name: Test and build candidate
        id: pkg
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_3_5_frame_00.py runtime/miro/tests/test_hvr_remediation.py runtime/miro/tests/test_anchor_remediation.py -q
          if ($LASTEXITCODE) { throw 'targeted tests failed' }
          git reset --hard $env:PRODUCT_SHA
          git clean -ffdx
          $out=Join-Path $env:RUNNER_TEMP ('ddda-rem-012-3-5-'+$env:PRODUCT_SHA.Substring(0,12)+'.zip')
          $ver='rem-012-3-5.'+$env:GITHUB_RUN_ID+'.'+$env:PRODUCT_SHA.Substring(0,12)
          $pkg=(.\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $ver -SourceRef $env:PRODUCT_SHA -OutputPath $out -Json | Out-String).Trim() | ConvertFrom-Json
          if ([string]$pkg.source_commit -ne $env:PRODUCT_SHA) { throw 'candidate provenance mismatch' }
          "path=$($pkg.path)" | Out-File $env:GITHUB_OUTPUT -Append
          "sha=$($pkg.sha256)" | Out-File $env:GITHUB_OUTPUT -Append
          [ordered]@{status='PASS';source_sha=$env:PRODUCT_SHA;package_sha256=[string]$pkg.sha256} | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE 'package.json')

      - name: Apply, verify, and reconcile frame 00
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
          PACKAGE_PATH: ${{ steps.pkg.outputs.path }}
          PACKAGE_SHA256: ${{ steps.pkg.outputs.sha }}
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rem-012-3-5-package'
          Expand-Archive $env:PACKAGE_PATH $root -Force
          $runtime=Join-Path $root 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH=$runtime
          $env:TARGET=Join-Path $root 'scaffolds\miro\rem-012-3-5-frame-00.yaml'
          $env:REPORT=Join-Path $env:EVIDENCE 'result.json'
          @'
          import hashlib, json, os
          from pathlib import Path
          from ddda_miro.anchor_contract import _close,_get_item,_patch,_protected_snapshot,_seg,_writable,canonical_miro_text
          from ddda_miro.client import MiroClient
          from ddda_miro.yamlio import load_yaml

          cfg=load_yaml(Path(os.environ['TARGET']))
          board=str(cfg['board_id']); frame=str(cfg['frame_id']); client=MiroClient(os.environ['MIRO_ACCESS_TOKEN'])
          snapshots={}; created=[]
          fixed=list(cfg['fixed_items'].values()); summary_markers=cfg['summary_markers']; legend_markers=cfg['legend_markers']
          fixed_ids={str(x['id']) for x in fixed}; marker_ids={str(x['id']) for x in summary_markers}

          def text(item): return canonical_miro_text((item.get('data') or {}).get('content'))
          def stable(item):
            return {'id':str(item.get('id') or ''),'type':item.get('type'),'parent':str((item.get('parent') or {}).get('id') or ''),'data':item.get('data') or {},'style':item.get('style') or {},'geometry':item.get('geometry') or {},'position':item.get('position') or {}}
          def digest(items):
            raw=json.dumps(sorted(map(stable,items),key=lambda x:x['id']),sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()
            return hashlib.sha256(raw).hexdigest()
          def expected(spec):
            out={'parent':{'id':frame},'position':{'x':float(spec['x']),'y':float(spec['y']),'origin':'center'},'data':{'content':str(spec.get('content') or '')},'geometry':{'width':float(spec['width'])},'style':{'fontSize':int(spec.get('font_size') or 24),**dict(spec.get('style') or {})}}
            if spec['type']=='shape':out['data']['shape']='rectangle';out['geometry']['height']=float(spec['height'])
            return out
          def marker_expected(spec):
            color=cfg['palette'][spec['key']]
            return {'parent':{'id':frame},'position':{'x':float(spec['x']),'y':float(spec['y']),'origin':'center'},'data':{'shape':'rectangle','content':''},'geometry':{'width':float(spec['width']),'height':float(spec['height'])},'style':{'fillColor':color,'fillOpacity':'1.0','borderColor':'#4B79A1','borderWidth':2,'borderOpacity':'1.0','borderStyle':'normal','fontFamily':'arial','fontSize':24,'textAlign':'center','textAlignVertical':'middle','color':color}}
          def matches(remote,target,item_type,tol=1):
            if str(remote.get('type'))!=item_type or str((remote.get('parent') or {}).get('id'))!=frame:return False
            if text(remote)!=canonical_miro_text(target['data']['content']):return False
            pos=remote.get('position') or {}
            if not _close(pos.get('x'),target['position']['x']) or abs(float(pos.get('y') or 0)-target['position']['y'])>tol:return False
            for k,v in target['geometry'].items():
              if not _close((remote.get('geometry') or {}).get(k),v):return False
            for k,v in target['style'].items():
              actual=(remote.get('style') or {}).get(k)
              if k in ('fillColor','borderColor','color'):
                if str(actual).lower()!=str(v).lower():return False
              elif k in ('fontSize','borderWidth'):
                if not _close(actual,v):return False
              elif actual!=v:return False
            return True
          def patch_fixed(spec):
            item_id=str(spec['id']); item_type=str(spec['type']); remote=_get_item(client,board,item_id); snapshots.setdefault(item_id,remote); target=expected(spec)
            if matches(remote,target,item_type,180 if item_type=='text' else 1):return item_id,'unchanged'
            payload=_writable(remote);payload['parent']=target['parent'];payload['position']=target['position'];payload['geometry']={**(payload.get('geometry') or {}),**target['geometry']};payload.setdefault('data',{}).update(target['data']);payload['style']={**(payload.get('style') or {}),**target['style']}
            updated=_patch(client,board,item_type,item_id,payload)
            if not matches(updated,target,item_type,180 if item_type=='text' else 1):raise ValueError('fixed item mismatch '+item_id)
            return item_id,'updated'
          def patch_summary_marker(spec):
            item_id=str(spec['id']);remote=_get_item(client,board,item_id);snapshots.setdefault(item_id,remote);target=marker_expected({**spec,'type':'shape'})
            if matches(remote,target,'shape'):return item_id,'unchanged'
            updated=_patch(client,board,'shape',item_id,target)
            if not matches(updated,target,'shape'):raise ValueError('summary marker mismatch '+item_id)
            return item_id,'updated'
          def find_legend_marker(spec):
            target=marker_expected({**spec,'type':'shape'})
            candidates=[x for x in client.list_items(board,'shape') if str((x.get('parent') or {}).get('id'))==frame and matches(x,target,'shape')]
            if len(candidates)>1:raise ValueError('duplicate legend marker '+spec['key'])
            return (str(candidates[0]['id']),target) if candidates else (None,target)
          def upsert_legend_marker(spec):
            item_id,target=find_legend_marker(spec)
            if item_id:return item_id,'unchanged'
            remote=client._request('POST',f'boards/{_seg(board)}/shapes',body=target);item_id=str(remote['id']);created.append(item_id)
            if not matches(remote,target,'shape'):raise ValueError('legend marker create mismatch '+spec['key'])
            return item_id,'created'
          def rollback():
            errors=[]
            for item_id in reversed(created):
              try:client.delete_item(board,item_id)
              except Exception as exc:errors.append(f'{item_id}: {exc}')
            for item_id,remote in reversed(list(snapshots.items())):
              try:_patch(client,board,str(remote['type']),item_id,_writable(remote))
              except Exception as exc:errors.append(f'{item_id}: {exc}')
            return {'status':'PASS' if not errors else 'PARTIAL','errors':errors}

          protected_before=_protected_snapshot(client,board,[str(x) for x in cfg['protected_frame_ids']])
          all_before=client.list_items(board)
          unmanaged_before=digest([x for x in all_before if str((x.get('parent') or {}).get('id'))==frame and str(x.get('id')) not in fixed_ids|marker_ids])
          one={'created':0,'updated':0,'unchanged':0,'ids':[]};two={'created':0,'updated':0,'unchanged':0,'ids':[]}
          def reconcile(result):
            for spec in fixed:
              item_id,state=patch_fixed(spec);result[state]+=1;result['ids'].append(item_id)
            for spec in summary_markers:
              item_id,state=patch_summary_marker(spec);result[state]+=1;result['ids'].append(item_id)
            for spec in legend_markers:
              item_id,state=upsert_legend_marker(spec);result[state]+=1;result['ids'].append(item_id)
          try:
            reconcile(one);reconcile(two)
            if two['created'] or two['updated'] or two['unchanged']!=16:raise ValueError('second reconcile mutated: '+str(two))
            protected_after=_protected_snapshot(client,board,[str(x) for x in cfg['protected_frame_ids']])
            if protected_after['digest']!=protected_before['digest']:raise ValueError('protected frame digest changed')
            active=set(two['ids']);all_after=client.list_items(board)
            unmanaged_after=digest([x for x in all_after if str((x.get('parent') or {}).get('id'))==frame and str(x.get('id')) not in active])
            if unmanaged_after!=unmanaged_before:raise ValueError('unmanaged frame 00 changed')
            summary=text(_get_item(client,board,str(cfg['fixed_items']['summary']['id'])))
            legend=text(_get_item(client,board,str(cfg['fixed_items']['legend']['id'])))
            for phrase in ('SCAFFOLD: 1','WORKING: 2','CANDIDATE: 0','VALIDATED: 0','ACCEPTED: 0','SUPERSEDED: 0','ATTENTION: 1','BLOCKING: 0'):
              if phrase not in summary:raise ValueError('summary missing '+phrase)
            for phrase in ('SCAFFOLD — založená počáteční struktura','WORKING — aktivně rozpracovaná pracovní verze','CANDIDATE — připravená k formálnímu review','VALIDATED — prošla technickou a metodickou validací','ACCEPTED — člověkem přijatá pro další použití','SUPERSEDED — nahrazená novější verzí'):
              if phrase not in legend:raise ValueError('legend missing '+phrase)
            for phrase in cfg['forbidden_phrases']:
              if phrase in summary or phrase in legend:raise ValueError('forbidden phrase '+phrase)
            report={'status':'PASS','technical_status':'PASS','remediation_id':cfg['remediation_id'],'product_sha':os.environ['PRODUCT_SHA'],'transport_sha':os.environ['TRANSPORT_SHA'],'candidate_sha256':os.environ['PACKAGE_SHA256'],'first_run':one,'second_run':two,'zero_mutation_second_run':True,'protected_frames':{'count':len(cfg['protected_frame_ids']),'unchanged':True,'digest':protected_after['digest']},'frame_00_unmanaged_unchanged':True,'rollback':{'status':'NOT_REQUIRED'},'human_review_status':'PENDING','overall_status':'READY_FOR_HUMAN_REVIEW'}
            Path(os.environ['REPORT']).write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          except Exception as exc:
            Path(os.environ['REPORT']).write_text(json.dumps({'status':'FAIL','technical_status':'FAIL','error':str(exc),'rollback':rollback()},ensure_ascii=False,indent=2)+'\n')
            raise
          '@ | python -
          $result=Get-Content $env:REPORT -Raw | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or -not $result.zero_mutation_second_run -or -not $result.protected_frames.unchanged) { throw 'REM-012.3.5 verification failed' }
          @("technical_status: $($result.technical_status)","product: $env:PRODUCT_SHA","transport: $env:TRANSPORT_SHA","managed items: 16","second reconcile: zero mutation","protected frames: 17 unchanged","human review: PENDING") | Add-Content $env:GITHUB_STEP_SUMMARY

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-3-5-frame-00-${{ github.event.pull_request.number }}-${{ env.PRODUCT_SHA }}
          path: ${{ env.EVIDENCE }}\**
          if-no-files-found: error
          retention-days: 30

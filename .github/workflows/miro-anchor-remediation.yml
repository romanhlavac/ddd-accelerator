name: DDDA REM-012.4 frame 00 decision cockpit

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-4-frame-00-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Exact-code REM-012.4 frame 00 remediation
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TRANSPORT_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCT_SHA: 7a54422a0a7c0398da6a30fe2ecdce6f345fed44
      BASE_SHA: ca2e7d7c5430ca08620eecf1b27975c2a857cad4
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TRANSPORT_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize evidence
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rem-012-4-frame-00'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "EVIDENCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            pr = [int]$env:PR_NUMBER
            transport_sha = $env:TRANSPORT_SHA
            product_sha = $env:PRODUCT_SHA
            base_sha = $env:BASE_SHA
            board_id = 'uXjVH1phki0='
            frame_id = '3458764679756478046'
            remediation_id = 'REM-PR8-HVA-CC-012.4'
            merge_allowed = $false
            promotion_allowed = $false
            release_allowed = $false
            gate_approval_allowed = $false
            human_review_status = 'PENDING'
          } | ConvertTo-Json | Set-Content (Join-Path $root 'identity.json') -Encoding utf8

      - name: Verify exact lineage and path allowlist
        shell: pwsh
        run: |
          @'
          import json, os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          transport = os.environ['TRANSPORT_SHA']
          product = os.environ['PRODUCT_SHA']
          base = os.environ['BASE_SHA']
          workflow = '.github/workflows/miro-anchor-remediation.yml'
          expected_product_paths = sorted([
              'runtime/miro/ddda_miro/frame00_contract.py',
              'runtime/miro/tests/test_rem_012_4_frame_00.py',
          ])

          assert git('rev-parse', 'HEAD') == transport, 'transport checkout mismatch'
          assert git('rev-parse', transport + '^') == product, 'transport parent mismatch'
          assert git('rev-parse', product + '^') == base, 'product parent mismatch'
          assert git('show', '-s', '--format=%s', product) == 'fix(miro): ignore unmanaged sticky-note style normalization'
          assert git('show', '-s', '--format=%s', transport) == 'fix(ci): authorize REM-012.4 frame 00 remediation'
          product_paths = sorted(filter(None, git('diff-tree', '--no-commit-id', '--name-only', '-r', product).splitlines()))
          transport_paths = list(filter(None, git('diff-tree', '--no-commit-id', '--name-only', '-r', transport).splitlines()))
          assert product_paths == expected_product_paths, f'product allowlist mismatch: {product_paths}'
          assert transport_paths == [workflow], f'transport is not workflow-only: {transport_paths}'
          Path(os.environ['EVIDENCE_ROOT'], 'source-contract.json').write_text(json.dumps({
              'status': 'PASS',
              'base_sha': base,
              'product_sha': product,
              'transport_sha': transport,
              'product_paths': product_paths,
              'transport_paths': transport_paths,
          }, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Wait for exact-SHA CI
        shell: pwsh
        run: |
          @'
          import json, os, time, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          def runs(sha):
              return get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs']

          def latest(items, name):
              matches = [item for item in items if item['name'] == name]
              return max(matches, key=lambda item: item['run_number']) if matches else None

          def wait_for(sha, required, label):
              for _ in range(320):
                  current = runs(sha)
                  state, complete = [], True
                  for name in required:
                      run = latest(current, name)
                      if not run:
                          state.append({'name': name, 'status': 'missing'})
                          complete = False
                          continue
                      snapshot = {key: run.get(key) for key in ('id', 'name', 'status', 'conclusion', 'html_url')}
                      state.append(snapshot)
                      if run['status'] == 'completed' and run['conclusion'] != 'success':
                          raise SystemExit(f'{label} workflow {name} failed: {run["conclusion"]}')
                      if run['status'] != 'completed' or run['conclusion'] != 'success':
                          complete = False
                  Path(os.environ['EVIDENCE_ROOT'], f'{label}-ci.json').write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
                  if complete:
                      return state
                  time.sleep(15)
              raise SystemExit(f'{label} CI did not reach PASS')

          product = wait_for(os.environ['PRODUCT_SHA'], ['Validate DDDA', 'DDDA platform CI', 'DDDA exact-code Miro image probe'], 'product')
          transport = wait_for(os.environ['TRANSPORT_SHA'], ['Validate DDDA', 'DDDA platform CI', 'DDDA exact-code Miro image probe'], 'transport')
          Path(os.environ['EVIDENCE_ROOT'], 'ci-summary.json').write_text(json.dumps({'product': product, 'transport': transport}, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Verify Miro secret
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) { throw 'MIRO_ACCESS_TOKEN is required.' }

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.PRODUCT_SHA }}

      - name: Test and build exact-SHA candidate
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_4_frame_00.py -q
          if ($LASTEXITCODE -ne 0) { throw 'REM-012.4 product tests failed.' }
          git reset --hard $env:PRODUCT_SHA
          git clean -ffdx
          if ((git rev-parse HEAD).Trim() -ne $env:PRODUCT_SHA -or (git status --porcelain)) { throw 'Product source is not clean.' }
          $version = 'rem-012-4.' + $env:GITHUB_RUN_ID + '.' + $env:PRODUCT_SHA.Substring(0, 12)
          $output = Join-Path $env:RUNNER_TEMP ('ddda-rem-012-4-' + $env:PRODUCT_SHA.Substring(0, 12) + '.zip')
          $package = (.\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $version -SourceRef $env:PRODUCT_SHA -OutputPath $output -Json | Out-String).Trim() | ConvertFrom-Json
          if ([string]$package.source_commit -ne $env:PRODUCT_SHA) { throw 'Candidate provenance mismatch.' }
          [ordered]@{
            status = 'PASS'
            source_sha = $env:PRODUCT_SHA
            package_path = [string]$package.path
            package_sha256 = [string]$package.sha256
          } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_ROOT 'package.json') -Encoding utf8
          "package_path=$($package.path)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sha256=$($package.sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Apply and verify frame 00 only
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $env:PACKAGE_PATH -ExpectedCommit $env:PRODUCT_SHA -ExpectedKind candidate
          $packageRoot = Join-Path $env:RUNNER_TEMP 'rem-012-4-package'
          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          Expand-Archive $env:PACKAGE_PATH $packageRoot -Force
          $packageManifest = Get-Content (Join-Path $packageRoot 'ddda-package.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$packageManifest.source_commit -ne $env:PRODUCT_SHA -or [string]$packageManifest.kind -ne 'candidate') { throw 'Expanded package provenance mismatch.' }
          $runtime = Join-Path $packageRoot 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH = $runtime
          $manifest = Join-Path $packageRoot 'scaffolds\miro\rem-012-4-frame-00.yaml'
          $report = Join-Path $env:EVIDENCE_ROOT 'result.json'
          python -m ddda_miro.frame00_control_center --manifest $manifest --report $report --source-sha $env:PRODUCT_SHA --apply
          if ($LASTEXITCODE -ne 0) {
            Get-Content $report -ErrorAction SilentlyContinue
            throw 'REM-012.4 online remediation failed.'
          }
          $result = Get-Content $report -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.status -ne 'PASS') { throw 'Result status is not PASS.' }
          if ($result.second_run.updated -ne 0 -or $result.second_run.deleted -ne 0 -or $result.second_run.unchanged -ne 8) { throw 'Second reconcile is not zero mutation.' }
          if (-not $result.protected_frames.unchanged -or $result.protected_frames.count -ne 17) { throw 'Protected frame contract failed.' }
          if ($result.technical_status -ne 'PASS' -or $result.human_review_status -ne 'PENDING' -or $result.overall_status -ne 'READY_FOR_HUMAN_REVIEW') { throw 'Acceptance state mismatch.' }
          if ($result.merge_allowed -or $result.promotion_allowed -or $result.release_allowed -or $result.gate_approval_allowed) { throw 'Governance fail-closed contract failed.' }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-4-frame-00-pr-${{ env.PR_NUMBER }}-${{ env.PRODUCT_SHA }}
          path: ${{ env.EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30

name: DDDA REM-012.3.6 frame 00 inline maturity markers

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-3-6-frame-00-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Exact-code frame 00 inline marker remediation
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TRANSPORT_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCT_SHA: 8b50f8e8c0e47521a8028010058db48c6f79fb95
      BASE_SHA: 12d7b67cca1c4c3fc68d3de4b7033a375368ce3a
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TRANSPORT_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact lineage and initialize evidence
        shell: pwsh
        run: |
          $env:EVIDENCE_ROOT = Join-Path $env:RUNNER_TEMP 'rem-012-3-6-frame-00'
          New-Item -ItemType Directory -Path $env:EVIDENCE_ROOT -Force | Out-Null
          "EVIDENCE_ROOT=$env:EVIDENCE_ROOT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          transport = os.environ["TRANSPORT_SHA"]
          product = os.environ["PRODUCT_SHA"]
          base = os.environ["BASE_SHA"]
          workflow = ".github/workflows/miro-anchor-remediation.yml"
          product_paths = sorted([
              "runtime/miro/tests/test_rem_012_3_5_frame_00.py",
              "scaffolds/miro/rem-012-3-5-frame-00.yaml",
          ])

          if git("rev-parse", "HEAD") != transport:
              raise SystemExit("transport checkout mismatch")
          if git("rev-parse", f"{transport}^") != product:
              raise SystemExit("transport parent mismatch")
          if git("rev-parse", f"{product}^") != base:
              raise SystemExit("product predecessor mismatch")
          if git("show", "-s", "--format=%s", product) != "fix(miro): align REM-012.3.6 maturity markers":
              raise SystemExit("product message mismatch")
          actual_product_paths = sorted(filter(None, git(
              "diff-tree", "--no-commit-id", "--name-only", "-r", product
          ).splitlines()))
          if actual_product_paths != product_paths:
              raise SystemExit(f"product allowlist mismatch: {actual_product_paths}")
          if git("show", "-s", "--format=%s", transport) != "fix(ci): authorize REM-012.3.6 frame 00 remediation":
              raise SystemExit("transport message mismatch")
          actual_transport_paths = list(filter(None, git(
              "diff-tree", "--no-commit-id", "--name-only", "-r", transport
          ).splitlines()))
          if actual_transport_paths != [workflow]:
              raise SystemExit(f"transport is not workflow-only: {actual_transport_paths}")

          Path(os.environ["EVIDENCE_ROOT"], "identity.json").write_text(
              json.dumps({
                  "status": "PASS",
                  "remediation_id": "REM-PR8-HVA-CC-012.3.6",
                  "base_sha": base,
                  "product_sha": product,
                  "transport_sha": transport,
                  "product_paths": product_paths,
                  "transport_paths": actual_transport_paths,
                  "merge_allowed": False,
                  "promotion_allowed": False,
                  "release_allowed": False,
                  "gate_approval_allowed": False,
                  "human_review_status": "PENDING",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          '@ | python -

      - name: Wait for exact-SHA CI
        shell: pwsh
        run: |
          @'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def wait_for(sha, required, label):
              for _ in range(320):
                  runs = get(
                      f"https://api.github.com/repos/{repo}/actions/runs"
                      f"?head_sha={sha}&event=pull_request&per_page=100"
                  )["workflow_runs"]
                  state = []
                  complete = True
                  for name in required:
                      matches = [item for item in runs if item["name"] == name]
                      run = max(matches, key=lambda item: item["run_number"]) if matches else None
                      state.append({
                          "name": name,
                          "id": run and run["id"],
                          "status": run and run["status"],
                          "conclusion": run and run["conclusion"],
                          "html_url": run and run["html_url"],
                      })
                      if run and run["status"] == "completed" and run["conclusion"] != "success":
                          raise SystemExit(f"{label} {name}={run['conclusion']}")
                      complete = complete and bool(
                          run and run["status"] == "completed" and run["conclusion"] == "success"
                      )
                  Path(
                      os.environ["EVIDENCE_ROOT"], f"{label}-ci.json"
                  ).write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
                  if complete:
                      return
                  time.sleep(15)
              raise SystemExit(f"{label} CI timeout")

          wait_for(
              os.environ["PRODUCT_SHA"],
              ["Validate DDDA", "DDDA exact-code Miro image probe"],
              "product",
          )
          wait_for(
              os.environ["TRANSPORT_SHA"],
              ["Validate DDDA", "DDDA platform CI", "DDDA exact-code Miro image probe"],
              "transport",
          )
          '@ | python -

      - name: Verify Miro secret
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) {
            throw 'MIRO_ACCESS_TOKEN is required.'
          }

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.PRODUCT_SHA }}

      - name: Test and build exact-SHA candidate
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_3_5_frame_00.py runtime/miro/tests/test_hvr_remediation.py runtime/miro/tests/test_anchor_remediation.py -q
          if ($LASTEXITCODE -ne 0) {
            throw 'Targeted REM-012.3.6 tests failed.'
          }
          git reset --hard $env:PRODUCT_SHA
          git clean -ffdx
          $output = Join-Path $env:RUNNER_TEMP ('ddda-rem-012-3-6-' + $env:PRODUCT_SHA.Substring(0,12) + '.zip')
          $version = 'rem-012-3-6.' + $env:GITHUB_RUN_ID + '.' + $env:PRODUCT_SHA.Substring(0,12)
          $package = (.\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $version -SourceRef $env:PRODUCT_SHA -OutputPath $output -Json | Out-String).Trim() | ConvertFrom-Json
          if ([string]$package.source_commit -ne $env:PRODUCT_SHA) {
            throw 'Candidate provenance mismatch.'
          }
          "package_path=$($package.path)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sh256=$($package.sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          [ordered]@{
            status = 'PASS'
            source_sha = $env:PRODUCT_SHA
            package_sha256 = [string]$package.sha256
          } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_ROOT 'package.json') -Encoding utf8

      - name: Apply, verify, and reconcile frame 00
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'rem-012-3-6-package'
          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }
          Expand-Archive $env:PACKAGE_PATH $packageRoot -Force
          $runtime = Join-Path $packageRoot 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH = $runtime
          $env:REMEDIATION_MANIFEST= Join-Path $packageRoot 'scaffolds\miro\rem-012-3-5-frame-00.yaml'
          $env:REPORT_PATH = Join-Path $env:EVIDENCE_ROOT 'result.json'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path

          from ddda_miro.anchor_contract import (
              _close,
              _get_item,
              _patch,
              _protected_snapshot,
              _seg,
              _writable,
              canonical_miro_text,
          )
          from ddda_miro.client import MiroClient
          from ddda_miro.yamlio import load_yaml

          config = load_yaml(Path(os.environ["REMEDIATION_MANIFEST"]))
          client = MiroClient(os.environ["MIRO_ACCESS_TOKEN"])
          board = str(config["board_id"])
          frame = str(config["frame_id"])
          snapshots = {}
          created_ids = []

          def canonical(item):
              return canonical_miro_text(item.get("data") or {}).get("content")

          def stable(item):
              return {
                  "id": str(item.get("id") or ""),
                  "type": str(item.get("type") or ""),
                  "parent": str((item.get("parent") or {}).get("id") or ""),
                  "data": item.get("data") or {},
                  "style": item.get("style") or {},
                  "geometry": item.get("geometry") or {},
                  "position": item.get("position") or {},
              }

          def digest(items):
              raw = json.dumps(
                  sorted([map(stable, items)],key=lambda value: value["id"]),
                  sort_keys=True,
                  ensure_ascii=Falsl
              separators=(",", ":"),
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def style_matches(actual, expected):

name: DDDA REM-012.2 anchor remediation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-2-anchor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  anchor-remediation:
    name: Exact-code anchor remediation
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TRANSPORT_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIOUS_TRANSPORT_SHA: 2d7ddeba85acdae32d88fd6c280d98b9952dc7f2
      TARGET_SOURCE_SHA: cccfa7d4cf999a3c9bb011f9125144e30f94f995
      IMPLEMENTATION_SHA: c7750543237506bb43e268e6523c72eba84d2ed9
      AUTHORIZED_BASE_SHA: 7badffb6ef6f3364569e68926eb511600eed38d3
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact transport commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TRANSPORT_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'rem-012-2-anchor-remediation'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          "EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            pr = [int]$env:PR_NUMBER
            transport_sha = $env:TRANSPORT_SHA
            previous_transport_sha = $env:PREVIOUS_TRANSPORT_SHA
            target_source_sha = $env:TARGET_SOURCE_SHA
            implementation_sha = $env:IMPLEMENTATION_SHA
            authorized_base_sha = $env:AUTHORIZED_BASE_SHA
            board_id = 'uXjVH1phki0='
            merge_allowed = $false
            promotion_allowed = $false
            release_allowed = $false
            human_review_status = 'PENDING'
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $evidenceRoot 'identity.json') -Encoding utf8

      - name: Verify exact transport and product source chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-Parents([string]$Sha) {
            $line = (git show -s --format=%P $Sha).Trim()
            if ([string]::IsNullOrWhiteSpace($line)) {
              return @()
            }
            return @($line.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries))
          }

          function Assert-ExactPaths(
            [string]$Base,
            [string]$Head,
            [string[]]$Expected,
            [string]$Label
          ) {
            $actual = @((git diff --name-only $Base $Head) | Where-Object { $_ })
            $unexpected = @($actual | Where-Object { $_ -notin $Expected })
            $missing = @($Expected | Where-Object { $_ -notin $actual })
            if ($unexpected.Count -or $missing.Count -or $actual.Count -ne $Expected.Count) {
              throw "$Label path contract mismatch. Unexpected: $($unexpected -join ', '); missing: $($missing -join ', '); actual count: $($actual.Count); expected count: $($Expected.Count)."
            }
          }

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TRANSPORT_SHA) {
            throw "Checkout SHA '$actual' does not match transport SHA '$env:TRANSPORT_SHA'."
          }

          $transportParents = @(Get-Parents $env:TRANSPORT_SHA)
          if ($transportParents.Count -ne 1 -or $transportParents[0] -ne $env:PREVIOUS_TRANSPORT_SHA) {
            throw "Current transport commit must have exactly one parent equal to previous transport '$env:PREVIOUS_TRANSPORT_SHA'."
          }

          $transportMessage = (git show -s --format=%s $env:TRANSPORT_SHA).Trim()
          if ($transportMessage -ne 'fix(ci): make REM-012.2 workflow context-valid') {
            throw "Unexpected current transport commit message '$transportMessage'."
          }

          $previousTransportParents = @(Get-Parents $env:PREVIOUS_TRANSPORT_SHA)
          if ($previousTransportParents.Count -ne 1 -or $previousTransportParents[0] -ne $env:TARGET_SOURCE_SHA) {
            throw "Previous transport commit must have exactly one parent equal to target source '$env:TARGET_SOURCE_SHA'."
          }

          $previousTransportMessage = (git show -s --format=%s $env:PREVIOUS_TRANSPORT_SHA).Trim()
          if ($previousTransportMessage -ne 'fix(ci): authorize corrected REM-012.2 source chain') {
            throw "Unexpected previous transport commit message '$previousTransportMessage'."
          }

          $targetParents = @(Get-Parents $env:TARGET_SOURCE_SHA)
          if ($targetParents.Count -ne 1 -or $targetParents[0] -ne $env:IMPLEMENTATION_SHA) {
            throw "Target source must have exactly one parent equal to implementation SHA '$env:IMPLEMENTATION_SHA'."
          }

          $implementationParents = @(Get-Parents $env:IMPLEMENTATION_SHA)
          if ($implementationParents.Count -ne 1 -or $implementationParents[0] -ne $env:AUTHORIZED_BASE_SHA) {
            throw "Implementation SHA must have exactly one parent equal to authorized base '$env:AUTHORIZED_BASE_SHA'."
          }

          $implementationMessage = (git show -s --format=%s $env:IMPLEMENTATION_SHA).Trim()
          if ($implementationMessage -ne 'feat(miro): remediate anchor frames for human review') {
            throw "Unexpected implementation commit message '$implementationMessage'."
          }

          $targetMessage = (git show -s --format=%s $env:TARGET_SOURCE_SHA).Trim()
          if ($targetMessage -ne 'fix(miro): restore anchor text canonicalization') {
            throw "Unexpected corrective commit message '$targetMessage'."
          }

          $transportPaths = @(
            '.github/workflows/miro-anchor-remediation.yml'
          )
          $implementationPaths = @(
            '.github/workflows/miro-anchor-remediation.yml'
            'docs/reviews/REM-PR8-HVA-CC-012-2-anchor-frames.md'
            'runtime/miro/ddda_miro/anchor_contract.py'
            'runtime/miro/ddda_miro/anchor_evidence.py'
            'runtime/miro/ddda_miro/anchor_plan.py'
            'runtime/miro/ddda_miro/anchor_remediation.py'
            'runtime/miro/tests/test_anchor_remediation.py'
            'scaffolds/miro/rem-012-2-anchor-frames.yaml'
            'schemas/miro-anchor-remediation.schema.json'
          )
          $correctivePaths = @(
            'runtime/miro/ddda_miro/anchor_contract.py'
            'runtime/miro/ddda_miro/anchor_evidence.py'
            'runtime/miro/ddda_miro/anchor_plan.py'
            'runtime/miro/tests/test_anchor_remediation.py'
          )

          Assert-ExactPaths $env:PREVIOUS_TRANSPORT_SHA $env:TRANSPORT_SHA $transportPaths 'Current transport'
          Assert-ExactPaths $env:TARGET_SOURCE_SHA $env:PREVIOUS_TRANSPORT_SHA $transportPaths 'Previous transport'
          Assert-ExactPaths $env:AUTHORIZED_BASE_SHA $env:IMPLEMENTATION_SHA $implementationPaths 'Implementation'
          Assert-ExactPaths $env:IMPLEMENTATION_SHA $env:TARGET_SOURCE_SHA $correctivePaths 'Corrective'

          [ordered]@{
            status = 'PASS'
            transport_sha = $env:TRANSPORT_SHA
            transport_parent = $transportParents[0]
            previous_transport_sha = $env:PREVIOUS_TRANSPORT_SHA
            previous_transport_parent = $previousTransportParents[0]
            target_source_sha = $env:TARGET_SOURCE_SHA
            target_parent = $targetParents[0]
            implementation_sha = $env:IMPLEMENTATION_SHA
            implementation_parent = $implementationParents[0]
            authorized_base_sha = $env:AUTHORIZED_BASE_SHA
            current_transport_paths = $transportPaths
            previous_transport_paths = $transportPaths
            implementation_paths = $implementationPaths
            corrective_paths = $correctivePaths
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'source-contract.json') -Encoding utf8

      - name: Verify exact-SHA CI gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Get-Runs([string]$Sha) {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$Sha&event=pull_request&per_page=100"
            return (Invoke-RestMethod -Method Get -Uri $uri -Headers $headers).workflow_runs
          }

          function Wait-WorkflowSet(
            [string]$Sha,
            [string[]]$RequiredNames,
            [string]$Label,
            [int]$MaxAttempts
          ) {
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              $runs = @(Get-Runs $Sha)
              $evidence = @()
              $allPassed = $true

              foreach ($name in $RequiredNames) {
                $run = @(
                  $runs |
                    Where-Object { [string]$_.name -eq $name } |
                    Sort-Object -Property run_number -Descending
                ) | Select-Object -First 1

                if ($null -eq $run) {
                  $allPassed = $false
                  $evidence += [ordered]@{
                    name = $name
                    status = 'missing'
                    conclusion = $null
                    run_id = $null
                    html_url = $null
                  }
                  continue
                }

                $evidence += [ordered]@{
                  name = [string]$run.name
                  status = [string]$run.status
                  conclusion = [string]$run.conclusion
                  run_id = [long]$run.id
                  html_url = [string]$run.html_url
                }

                if ([string]$run.status -eq 'completed' -and [string]$run.conclusion -ne 'success') {
                  $evidence | ConvertTo-Json -Depth 10 |
                    Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT "$Label-ci.json") -Encoding utf8
                  throw "$Label workflow '$name' completed with conclusion '$($run.conclusion)'."
                }

                if ([string]$run.status -ne 'completed' -or [string]$run.conclusion -ne 'success') {
                  $allPassed = $false
                }
              }

              $evidence | ConvertTo-Json -Depth 10 |
                Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT "$Label-ci.json") -Encoding utf8

              if ($allPassed) {
                return
              }

              if ($attempt -lt $MaxAttempts) {
                Start-Sleep -Seconds 15
              }
            }

            throw "$Label exact-SHA CI did not reach PASS within the allowed wait window."
          }

          $targetWorkflows = @(
            'Validate DDDA'
            'DDDA platform CI'
            'DDDA exact-code Miro image probe'
          )
          $transportWorkflows = @(
            'Validate DDDA'
            'DDDA platform CI'
            'DDDA exact-code Miro image probe'
          )

          Wait-WorkflowSet $env:TARGET_SOURCE_SHA $targetWorkflows 'target-source' 8
          Wait-WorkflowSet $env:TRANSPORT_SHA $transportWorkflows 'transport' 220

      - name: Verify Miro secret availability
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) {
            throw 'MIRO_ACCESS_TOKEN is required for REM-012.2 brokered implementation.'
          }

      - name: Checkout exact target source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SOURCE_SHA }}

      - name: Run targeted source-level tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input `
            pytest `
            pyyaml `
            jsonschema `
            requests
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install targeted test dependencies.'
          }
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_anchor_remediation.py -q
          if ($LASTEXITCODE -ne 0) {
            throw 'Targeted REM-012.2 source-level tests failed.'
          }

      - name: Build exact-SHA candidate package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SOURCE_SHA) {
            throw "Candidate checkout '$actual' does not match target source '$env:TARGET_SOURCE_SHA'."
          }

          $version = 'rem-012-2.' + $env:GITHUB_RUN_ID + '.' + $env:TARGET_SOURCE_SHA.Substring(0, 12)
          $output = Join-Path $env:RUNNER_TEMP ('ddda-rem-012-2-' + $env:TARGET_SOURCE_SHA.Substring(0, 12) + '.zip')
          $json = .\scripts\platform\New-DDDAPlatformPackage.ps1 `
            -PlatformPath $PWD.Path `
            -Kind candidate `
            -Version $version `
            -SourceRef $env:TARGET_SOURCE_SHA `
            -OutputPath $output `
            -Json | Out-String
          $package = $json.Trim() | ConvertFrom-Json
          if ([string]$package.source_commit -ne $env:TARGET_SOURCE_SHA) {
            throw 'Candidate package source_commit does not match target source.'
          }

          [ordered]@{
            status = 'PASS'
            transport_sha = $env:TRANSPORT_SHA
            previous_transport_sha = $env:PREVIOUS_TRANSPORT_SHA
            target_source_sha = $env:TARGET_SOURCE_SHA
            package_path = [string]$package.path
            package_sha256 = [string]$package.sha256
            package_source_commit = [string]$package.source_commit
          } | ConvertTo-Json -Depth 10 |
            Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'package.json') -Encoding utf8

          "package_path=$($package.path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sha256=$($package.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run exact-code REM-012.2 from candidate package
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:EVIDENCE_ROOT 'result.json'
          $stderrPath = Join-Path $env:EVIDENCE_ROOT 'stderr.log'

          $candidate = '${{ steps.package.outputs.package_path }}'
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 `
            -PackagePath $candidate `
            -ExpectedCommit $env:TARGET_SOURCE_SHA `
            -ExpectedKind candidate

          $packageRoot = Join-Path $env:RUNNER_TEMP 'rem-012-2-package'
          if (Test-Path -LiteralPath $packageRoot) {
            Remove-Item -LiteralPath $packageRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $candidate -DestinationPath $packageRoot -Force
          $packageManifest = Get-Content -LiteralPath (Join-Path $packageRoot 'ddda-package.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$packageManifest.source_commit -ne $env:TARGET_SOURCE_SHA -or [string]$packageManifest.kind -ne 'candidate') {
            throw 'Expanded package provenance does not match the exact target source.'
          }

          $runtimePackage = Join-Path $packageRoot 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtimePackage
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install exact candidate Miro runtime.'
          }

          $env:PYTHONPATH = Join-Path $packageRoot 'runtime\miro'
          $manifestPath = Join-Path $packageRoot 'scaffolds\miro\rem-012-2-anchor-frames.yaml'
          python -m ddda_miro.anchor_remediation `
            --manifest $manifestPath `
            --report $reportPath `
            --source-sha $env:TARGET_SOURCE_SHA `
            --apply 2> $stderrPath
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content -LiteralPath $stderrPath -ErrorAction SilentlyContinue
            throw "REM-012.2 failed with exit code $exitCode."
          }

          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.status -ne 'PASS') { throw 'REM-012.2 report status is not PASS.' }
          if ([string]$report.source_sha -ne $env:TARGET_SOURCE_SHA) { throw 'Report source SHA mismatch.' }
          if ([string]$report.board_id -ne 'uXjVH1phki0=') { throw 'Report board ID mismatch.' }
          if ([int]$report.images.asset_count -ne 17) { throw 'Expected exactly 17 managed image assets.' }
          if ([int]$report.images.second_run.created -ne 0 -or [int]$report.images.second_run.updated -ne 0 -or [int]$report.images.second_run.unchanged -ne 17) {
            throw 'Second managed-image reconcile is not zero mutation.'
          }
          if (@($report.images.remote_verification.items).Count -ne 17) { throw 'Remote image verification count mismatch.' }
          foreach ($item in @($report.images.remote_verification.items)) {
            if ([string]$item.remote_type -ne 'image') { throw "Remote item '$($item.target_item_id)' is not an image." }
            if ([string]$item.sha256 -notmatch '^[0-9a-f]{64}$') { throw "Remote item '$($item.target_item_id)' has invalid digest evidence." }
          }
          if ($report.native_table.status -ne 'PASS' -or [string]$report.native_table.type -ne 'data_table_format') {
            throw 'Native artifact registry table verification failed.'
          }
          if ([int]$report.geometry.collision_count -ne 0) { throw 'Anchor-frame overlap remains.' }
          if (-not [bool]$report.protected_frames.unchanged -or [int]$report.protected_frames.count -ne 15) {
            throw 'Protected frames 20+ changed.'
          }
          if ([string]$report.human_review_status -ne 'PENDING' -or [string]$report.overall_status -ne 'READY_FOR_HUMAN_REVIEW') {
            throw 'REM-012.2 must stop at the human-review checkpoint.'
          }

          @(
            "Transport SHA: $env:TRANSPORT_SHA"
            "Previous transport SHA: $env:PREVIOUS_TRANSPORT_SHA"
            "Exact product source SHA: $env:TARGET_SOURCE_SHA"
            "Candidate SHA-256: ${{ steps.package.outputs.package_sha256 }}"
            "Anchor frames: updated=$($report.frames.updated), unchanged=$($report.frames.unchanged)"
            "Managed images: $($report.images.asset_count); second-run mutations=0"
            "Protected 20+ frames: $($report.protected_frames.count), unchanged=$($report.protected_frames.unchanged)"
            "Human review: $($report.human_review_status)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload REM-012.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-2-anchor-remediation-${{ env.PR_NUMBER }}-${{ env.TARGET_SOURCE_SHA }}
          path: ${{ runner.temp }}/rem-012-2-anchor-remediation/**
          if-no-files-found: error
          retention-days: 30

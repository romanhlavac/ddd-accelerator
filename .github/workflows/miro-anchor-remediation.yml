name: DDDA REM-012.4 frame 00 decision cockpit

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-4-frame-00-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Exact-code REM-012.4 frame 00 remediation
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: cbc9963e13a1674e466cbceebfeff6f0b531a663
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize evidence
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rem-012-4-frame-00'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "EVIDENCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            pr = [int]$env:PR_NUMBER
            source_sha = $env:SOURCE_SHA
            authorized_base_sha = $env:BASE_SHA
            board_id = 'uXjVH1phki0='
            frame_id = '3458764679756478046'
            remediation_id = 'REM-PR8-HVA-CC-012.4'
            candidate_reused = $true
            merge_allowed = $false
            promotion_allowed = $false
            release_allowed = $false
            gate_approval_allowed = $false
            human_review_status = 'PENDING'
          } | ConvertTo-Json | Set-Content (Join-Path $root 'identity.json') -Encoding utf8

      - name: Verify exact lineage and path allowlist
        shell: pwsh
        run: |
          @'
          import json, os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          source = os.environ['SOURCE_SHA']
          base = os.environ['BASE_SHA']
          expected_paths = sorted([
              '.github/workflows/miro-anchor-remediation.yml',
              'runtime/miro/ddda_miro/frame00_contract.py',
              'runtime/miro/tests/test_rem_012_4_frame_00.py',
              'scaffolds/miro/rem-012-4-frame-00.yaml',
          ])
          actual_paths = sorted(filter(None, git('diff-tree', '--no-commit-id', '--name-only', '-r', source).splitlines()))
          manifest = Path('scaffolds/miro/rem-012-4-frame-00.yaml').read_text(encoding='utf-8')

          assert git('rev-parse', 'HEAD') == source, 'source checkout mismatch'
          assert git('rev-parse', source + '^') == base, 'authorized base mismatch'
          assert git('show', '-s', '--format=%s', source) == 'fix(miro): complete frame 00 Artifact Health HVR', 'unexpected source commit'
          assert actual_paths == expected_paths, f'path allowlist mismatch: {actual_paths}'
          assert f'authorized_base_sha: {base}' in manifest, 'manifest authorization mismatch'
          Path(os.environ['EVIDENCE_ROOT'], 'source-contract.json').write_text(json.dumps({
              'status': 'PASS',
              'authorized_base_sha': base,
              'source_sha': source,
              'changed_paths': actual_paths,
          }, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Wait for authoritative exact-SHA evidence and candidate
        id: ci
        shell: pwsh
        run: |
          @'
          import json, os, time, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          def latest(items, name):
              matches = [item for item in items if item['name'] == name]
              return max(matches, key=lambda item: item['run_number']) if matches else None

          def require_success(item, label):
              if item and item['status'] == 'completed' and item.get('conclusion') != 'success':
                  raise SystemExit(f'{label} failed: {item.get("conclusion")}')
              return bool(item and item['status'] == 'completed' and item.get('conclusion') == 'success')

          candidate_name = f'ddda-candidate-{sha}'
          snapshot = {}
          for _ in range(240):
              runs = get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs']
              validate = latest(runs, 'Validate DDDA')
              probe = latest(runs, 'DDDA exact-code Miro image probe')
              platform = latest(runs, 'DDDA platform CI')
              validate_ok = require_success(validate, 'Validate DDDA')
              probe_ok = require_success(probe, 'Miro image probe')

              platform_jobs = []
              artifacts = []
              platform_ok = False
              if platform:
                  platform_jobs = get(f'https://api.github.com/repos/{repo}/actions/runs/{platform["id"]}/jobs?per_page=100')['jobs']
                  required_jobs = []
                  for name in ('Platform validation', 'One-command PR validation'):
                      matches = [job for job in platform_jobs if job['name'] == name]
                      job = max(matches, key=lambda value: value.get('run_attempt', 1)) if matches else None
                      if job and job['status'] == 'completed' and job.get('conclusion') != 'success':
                          raise SystemExit(f'platform job {name} failed: {job.get("conclusion")}')
                      required_jobs.append(bool(job and job['status'] == 'completed' and job.get('conclusion') == 'success'))
                  artifacts = get(f'https://api.github.com/repos/{repo}/actions/runs/{platform["id"]}/artifacts?per_page=100')['artifacts']
                  platform_ok = all(required_jobs) and any(item['name'] == candidate_name and not item['expired'] for item in artifacts)

              snapshot = {
                  'source_sha': sha,
                  'validate': validate,
                  'probe': probe,
                  'platform_run': platform,
                  'platform_jobs': [{key: job.get(key) for key in ('id', 'name', 'status', 'conclusion')} for job in platform_jobs],
                  'candidate_artifacts': [{key: item.get(key) for key in ('id', 'name', 'expired', 'digest')} for item in artifacts if item['name'] == candidate_name],
              }
              Path(os.environ['EVIDENCE_ROOT'], 'ci-evidence.json').write_text(json.dumps(snapshot, indent=2) + '\n', encoding='utf-8')
              if validate_ok and probe_ok and platform_ok:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write(f'platform_run_id={platform["id"]}\n')
                  break
              time.sleep(15)
          else:
              raise SystemExit('exact-SHA evidence or candidate did not become ready within 60 minutes')
          '@ | python -

      - name: Run targeted Frame 00 source tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_4_frame_00.py -q
          if ($LASTEXITCODE -ne 0) { throw 'REM-012.4 targeted source tests failed.' }

      - name: Verify Miro secret
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) { throw 'MIRO_ACCESS_TOKEN is required.' }

      - name: Download exact-SHA candidate package
        uses: actions/download-artifact@v4
        with:
          name: ddda-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.platform_run_id }}

      - name: Apply and verify Frame 00 only from reused candidate
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'candidate') -Filter '*.zip' -File)
          if ($candidate.Count -ne 1) { throw "Expected exactly one candidate package, found $($candidate.Count)." }
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $candidate[0].FullName -ExpectedCommit $env:SOURCE_SHA -ExpectedKind candidate
          $packageSha256 = (Get-FileHash -LiteralPath $candidate[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            status = 'PASS'
            source_sha = $env:SOURCE_SHA
            reused_from_platform_run = '${{ steps.ci.outputs.platform_run_id }}'
            package_file = $candidate[0].Name
            package_sha256 = $packageSha256
          } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_ROOT 'package.json') -Encoding utf8

          $packageRoot = Join-Path $env:RUNNER_TEMP 'rem-012-4-package'
          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          Expand-Archive $candidate[0].FullName $packageRoot -Force
          $packageManifest = Get-Content (Join-Path $packageRoot 'ddda-package.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$packageManifest.source_commit -ne $env:SOURCE_SHA -or [string]$packageManifest.kind -ne 'candidate') { throw 'Expanded package provenance mismatch.' }

          $runtime = Join-Path $packageRoot 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH = $runtime
          $manifest = Join-Path $packageRoot 'scaffolds\miro\rem-012-4-frame-00.yaml'
          $report = Join-Path $env:EVIDENCE_ROOT 'result.json'
          python -m ddda_miro.frame00_control_center --manifest $manifest --report $report --source-sha $env:SOURCE_SHA --apply
          if ($LASTEXITCODE -ne 0) {
            Get-Content $report -ErrorAction SilentlyContinue
            throw 'REM-012.4 online remediation failed.'
          }
          $result = Get-Content $report -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.status -ne 'PASS') { throw 'Result status is not PASS.' }
          if ($result.second_run.updated -ne 0 -or $result.second_run.deleted -ne 0 -or $result.second_run.unchanged -ne 8) { throw 'Second reconcile is not zero mutation.' }
          if (-not $result.protected_frames.unchanged -or $result.protected_frames.count -ne 17) { throw 'Protected frame contract failed.' }
          if ($result.technical_status -ne 'PASS' -or $result.human_review_status -ne 'PENDING' -or $result.overall_status -ne 'READY_FOR_HUMAN_REVIEW') { throw 'Acceptance state mismatch.' }
          if ($result.merge_allowed -or $result.promotion_allowed -or $result.release_allowed -or $result.gate_approval_allowed) { throw 'Governance fail-closed contract failed.' }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-4-frame-00-pr-${{ env.PR_NUMBER }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30

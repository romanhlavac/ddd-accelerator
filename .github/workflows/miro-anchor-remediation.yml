name: DDDA REM-012.3 HVR remediation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-3-hvr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hvr-remediation:
    name: Exact-code HVR remediation
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TRANSPORT_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_SOURCE_SHA: 6d4878daac07b3694100d46ecdc89b960139c8cd
      AUTHORIZED_PREDECESSOR_SHA: f6cc263eeb17fd70eacca9e42f2761ba02d3e63d
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TRANSPORT_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize evidence
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rem-012-3-hvr-remediation'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "EVIDENCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            pr = [int]$env:PR_NUMBER
            transport_sha = $env:TRANSPORT_SHA
            target_source_sha = $env:TARGET_SOURCE_SHA
            authorized_predecessor_sha = $env:AUTHORIZED_PREDECESSOR_SHA
            board_id = 'uXjVH1phki0='
            source_board_id = 'uXjVH27wYU4='
            remediation_id = 'REM-PR8-HVA-CC-012.3'
            merge_allowed = $false
            promotion_allowed = $false
            release_allowed = $false
            gate_approval_allowed = $false
            human_review_status = 'PENDING'
          } | ConvertTo-Json | Set-Content (Join-Path $root 'identity.json') -Encoding utf8

      - name: Verify exact corrective source and workflow transport
        shell: pwsh
        run: |
          @'
          import json, os, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          target = os.environ['TARGET_SOURCE_SHA']
          predecessor = os.environ['AUTHORIZED_PREDECESSOR_SHA']
          transport = os.environ['TRANSPORT_SHA']
          workflow = '.github/workflows/miro-anchor-remediation.yml'
          if git('rev-parse', 'HEAD') != transport:
              raise SystemExit('transport checkout mismatch')
          if git('rev-parse', f'{transport}^') != target:
              raise SystemExit('transport parent is not the exact corrective product source')
          if git('rev-parse', f'{target}^') != predecessor:
              raise SystemExit('corrective product parent mismatch')
          if git('show', '-s', '--format=%s', target) != 'fix(miro): align onboarding count with source inventory':
              raise SystemExit('corrective product message mismatch')
          product_paths = sorted(filter(None, git('diff-tree', '--no-commit-id', '--name-only', '-r', target).splitlines()))
          expected_product_paths = sorted([
              'docs/reviews/REM-PR8-HVA-CC-012-3-hvr-remediation.md',
              'runtime/miro/ddda_miro/hvr_remediation_api_compat.py',
              'runtime/miro/tests/test_hvr_remediation_api_compat.py',
          ])
          if product_paths != expected_product_paths:
              raise SystemExit(f'corrective product allowlist mismatch: {product_paths}')
          if git('show', '-s', '--format=%s', transport) != 'fix(ci): authorize REM-012.3 source inventory retry':
              raise SystemExit('transport message mismatch')
          transport_paths = filter(None, git('diff-tree', '--no-commit-id', '--name-only', '-r', transport).splitlines())
          if list(transport_paths) != [workflow]:
              raise SystemExit('transport is not workflow-only')
          Path(os.environ['EVIDENCE_ROOT'], 'source-contract.json').write_text(json.dumps({
              'status': 'PASS',
              'target_source_sha': target,
              'authorized_predecessor_sha': predecessor,
              'transport_sha': transport,
              'product_paths': product_paths,
              'transport_paths': [workflow],
          }, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Verify exact-SHA CI gates
        shell: pwsh
        run: |
          @'
          import json, os, time, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)
          def runs(sha):
              return get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs']
          def latest(items, name):
              matches = [item for item in items if item['name'] == name]
              return max(matches, key=lambda item: item['run_number']) if matches else None
          def wait_for(sha, required, label):
              for _ in range(320):
                  current = runs(sha)
                  state, complete = [], True
                  for name in required:
                      run = latest(current, name)
                      if not run:
                          state.append({'name': name, 'status': 'missing'})
                          complete = False
                          continue
                      state.append({key: run.get(key) for key in ('id', 'name', 'status', 'conclusion', 'html_url')})
                      if run['status'] == 'completed' and run['conclusion'] != 'success':
                          raise SystemExit(f'{label} workflow {name} failed: {run["conclusion"]}')
                      if run['status'] != 'completed' or run['conclusion'] != 'success':
                          complete = False
                  Path(os.environ['EVIDENCE_ROOT'], f'{label}-ci.json').write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
                  if complete:
                      return state
                  time.sleep(15)
              raise SystemExit(f'{label} CI did not reach PASS')

          target = wait_for(os.environ['TARGET_SOURCE_SHA'], ['Validate DDDA', 'DDDA exact-code Miro image probe'], 'target')
          transport = wait_for(os.environ['TRANSPORT_SHA'], ['Validate DDDA', 'DDDA platform CI', 'DDDA exact-code Miro image probe'], 'transport')
          Path(os.environ['EVIDENCE_ROOT'], 'ci-summary.json').write_text(json.dumps({'target': target, 'transport': transport}, indent=2) + '\n', encoding='utf-8')
          '@ | python -

      - name: Verify Miro secret
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) { throw 'MIRO_ACCESS_TOKEN is required.' }

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SOURCE_SHA }}

      - name: Test and build exact-SHA candidate
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH = Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_hvr_remediation_api_compat.py runtime/miro/tests/test_hvr_remediation.py runtime/miro/tests/test_anchor_remediation.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Targeted REM-012.3 tests failed.' }
          git reset --hard $env:TARGET_SOURCE_SHA
          git clean -ffdx
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SOURCE_SHA -or (git status --porcelain)) { throw 'Product source is not clean.' }
          $version = 'rem-012-3.' + $env:GITHUB_RUN_ID + '.' + $env:TARGET_SOURCE_SHA.Substring(0, 12)
          $output = Join-Path $env:RUNNER_TEMP ('ddda-rem-012-3-' + $env:TARGET_SOURCE_SHA.Substring(0, 12) + '.zip')
          $package = (.\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $version -SourceRef $env:TARGET_SOURCE_SHA -OutputPath $output -Json | Out-String).Trim() | ConvertFrom-Json
          if ([string]$package.source_commit -ne $env:TARGET_SOURCE_SHA) { throw 'Candidate provenance mismatch.' }
          [ordered]@{ status='PASS'; source_sha=$env:TARGET_SOURCE_SHA; package_path=[string]$package.path; package_sha256=[string]$package.sha256 } | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE_ROOT 'package.json') -Encoding utf8
          "package_path=$($package.path)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sha256=$($package.sha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run and verify exact-code REM-012.3
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:EVIDENCE_ROOT 'result.json'
          $stderrPath = Join-Path $env:EVIDENCE_ROOT 'stderr.log'
          $candidate = '${{ steps.package.outputs.package_path }}'
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $candidate -ExpectedCommit $env:TARGET_SOURCE_SHA -ExpectedKind candidate
          $packageRoot = Join-Path $env:RUNNER_TEMP 'rem-012-3-package'
          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          Expand-Archive $candidate $packageRoot -Force
          $packageManifest = Get-Content (Join-Path $packageRoot 'ddda-package.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$packageManifest.source_commit -ne $env:TARGET_SOURCE_SHA -or [string]$packageManifest.kind -ne 'candidate') { throw 'Expanded package provenance mismatch.' }
          $runtime = Join-Path $packageRoot 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH = $runtime
          $env:GITHUB_SHA = $env:TARGET_SOURCE_SHA
          $remediationManifest = Join-Path $packageRoot 'scaffolds\miro\rem-012-3-hvr-remediation.yaml'
          python -m ddda_miro.hvr_remediation_api_compat --manifest $remediationManifest --report $reportPath --source-sha $env:TARGET_SOURCE_SHA --apply 2> $stderrPath
          if ($LASTEXITCODE -ne 0) { Get-Content $stderrPath -ErrorAction SilentlyContinue; throw 'REM-012.3 execution failed.' }

          $report = Get-Content $reportPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$report.status -ne 'PASS' -or [string]$report.technical_status -ne 'PASS') { throw 'Technical status is not PASS.' }
          if ([string]$report.remediation_id -ne 'REM-PR8-HVA-CC-012.3' -or [string]$report.source_sha -ne $env:TARGET_SOURCE_SHA) { throw 'Result identity mismatch.' }
          if ([int]$report.images.asset_count -ne 17) { throw 'Managed image count mismatch.' }
          if ([int]$report.images.second_run.created -ne 0 -or [int]$report.images.second_run.updated -ne 0 -or [int]$report.images.second_run.unchanged -ne 17) { throw 'Second image reconcile is not zero mutation.' }
          if (-not [bool]$report.native_clones.zero_mutation_second_run) { throw 'Native clone second reconcile mutated board.' }
          $nativeCount = (@($report.native_clones.first_run | ForEach-Object { @($_.item_ids).Count }) | Measure-Object -Sum).Sum
          if ([int]$nativeCount -ne 128) { throw "Native clone count mismatch: $nativeCount" }
          if ([string]$report.artifact_registry.status -ne 'PASS' -or [string]$report.artifact_registry.project_id -ne 'acceptance-claims-modernization') { throw 'Project registry verification failed.' }
          if ([int]$report.geometry.collision_count -ne 0) { throw 'Anchor overlap remains.' }
          if (-not [bool]$report.protected_frames.unchanged -or [int]$report.protected_frames.count -ne 15) { throw 'Protected frames changed.' }
          if ([string]$report.human_review_status -ne 'PENDING' -or [string]$report.overall_status -ne 'READY_FOR_HUMAN_REVIEW') { throw 'HVR semantics failed.' }

          @(
            "REM-012.3 technical status: $($report.technical_status)"
            "Transport SHA: $env:TRANSPORT_SHA"
            "Product SHA: $env:TARGET_SOURCE_SHA"
            "Candidate SHA-256: ${{ steps.package.outputs.package_sha256 }}"
            "Managed images: 17; second reconcile mutations=0"
            "Native reference items: 128; onboarding references=7 native + pinned align-bmc image; second reconcile mutations=0"
            "Project registry: $($report.artifact_registry.project_id)"
            "Protected frames: 15; unchanged=$($report.protected_frames.unchanged)"
            "Human review: $($report.human_review_status)"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-3-hvr-remediation-${{ env.PR_NUMBER }}-${{ env.TARGET_SOURCE_SHA }}
          path: ${{ env.EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30

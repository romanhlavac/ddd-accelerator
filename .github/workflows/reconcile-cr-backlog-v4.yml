name: Final CR backlog reconciliation v4

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/reconcile-cr-backlog-v4.yml

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0

      - name: Pre-auth compile and contract checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/github-native-backlog-governance"
          python -m py_compile .github/scripts/reconcile-cr-backlog-v4.py
          python - <<'PY'
          import json
          cfg=json.load(open('config/governance/github-bootstrap.json',encoding='utf-8-sig'))
          assert cfg['repository']=='romanhlavac/ddd-accelerator'
          assert cfg['project_owner']=='romanhlavac'
          assert cfg['project_title']=='DDDA Platform Backlog'
          PY
          echo PRE_AUTH_VALIDATION_PASS

      - name: Start GitHub CLI browser authorization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          log="$RUNNER_TEMP/gh-auth.log"
          pidfile="$RUNNER_TEMP/gh-auth.pid"
          challenge="$RUNNER_TEMP/gh-device-auth.txt"
          rm -f "$log" "$pidfile" "$challenge"
          (gh auth login --hostname github.com --git-protocol https --web --scopes project >"$log" 2>&1) &
          pid=$!
          echo "$pid" > "$pidfile"
          code=''
          for i in $(seq 1 60); do
            code="$(grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' "$log" 2>/dev/null | head -n1 || true)"
            [ -n "$code" ] && break
            kill -0 "$pid" 2>/dev/null || { cat "$log" >&2 || true; exit 1; }
            sleep 1
          done
          test -n "$code"
          printf 'Verification URL: https://github.com/login/device\nDevice code: %s\n' "$code" > "$challenge"

      - name: Upload temporary device challenge
        uses: actions/upload-artifact@v4
        with:
          name: cr-backlog-v4-device-auth
          path: ${{ runner.temp }}/gh-device-auth.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for browser authorization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          pid="$(cat "$RUNNER_TEMP/gh-auth.pid")"
          for i in $(seq 1 900); do
            if gh auth status --hostname github.com >/dev/null 2>&1; then
              echo USER_AUTHORIZATION_COMPLETE
              exit 0
            fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/gh-auth.log" >&2 || true; exit 1; }
            sleep 1
          done
          echo 'Timed out waiting for GitHub device authorization.' >&2
          exit 1

      - name: Delete temporary device challenge artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="cr-backlog-v4-device-auth") | .id' | \
          while read -r id; do
            [ -z "$id" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done

      - name: Reconcile and verify all CRs
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          python .github/scripts/reconcile-cr-backlog-v4.py
          python - <<'PY'
          import json
          r=json.load(open('.reports/cr-backlog-audit-v4/audit.json',encoding='utf-8'))
          assert r['remaining_count']==0
          assert r['mapped_cr_count'] >= 40
          PY
          echo CR_BACKLOG_READBACK_PASS

      - name: Upload final audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr-backlog-consistency-audit-v4
          path: .reports/cr-backlog-audit-v4/**
          retention-days: 30
          if-no-files-found: error

      - name: Commit versioned reconciliation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-cr-backlog-v4.yml .github/scripts/reconcile-cr-backlog-v4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/governance/github-bootstrap.json \
                  config/governance/backlog-policy.yaml \
                  docs/roadmap/work-packages/WP-08-platform-lifecycle-and-steering.md \
                  .github/workflows .github/scripts
          git commit -m 'docs(governance): finalize CR backlog reconciliation (#16)'
          git push origin HEAD:feature/github-native-backlog-governance

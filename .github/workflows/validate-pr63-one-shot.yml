name: Validate PR63 One Shot

on:
  push:
    branches:
      - gov/validate-pr-pr63-20260814-91f45386

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr63:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DDDA_AUTHORIZED_SHA: 91f45386bb5ca93e4654769e945f77fa40d1a6cc
      DDDA_STAGING_BRANCH: gov/validate-pr-pr63-20260814-91f45386
      DDDA_PR_NUMBER: '63'
    steps:
      - name: Checkout one-shot staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify staging isolation and current PR63 head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -ne $env:DDDA_STAGING_BRANCH) {
            throw "Unexpected staging branch '$env:GITHUB_REF_NAME'."
          }
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $env:DDDA_AUTHORIZED_SHA) {
            throw "One-shot parent '$parent' does not match authorized PR63 SHA '$env:DDDA_AUTHORIZED_SHA'."
          }
          $changed = @(git diff --name-only HEAD^ HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/validate-pr63-one-shot.yml') {
            throw "Unexpected one-shot staging diff: $($changed -join ', ')"
          }
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:DDDA_PR_NUMBER" | ConvertFrom-Json
          if ($pr.head.sha -ne $env:DDDA_AUTHORIZED_SHA) {
            throw "PR63 HEAD moved to '$($pr.head.sha)' after authorization; expected '$env:DDDA_AUTHORIZED_SHA'."
          }
          git cat-file -e "$env:DDDA_AUTHORIZED_SHA`^{commit}"

      - name: Checkout exact authorized PR63 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DDDA_AUTHORIZED_SHA }}
          persist-credentials: false

      - name: Verify exact source and clean repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:DDDA_AUTHORIZED_SHA) {
            throw "Checkout SHA '$actual' does not match authorized SHA '$env:DDDA_AUTHORIZED_SHA'."
          }
          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace(($changes -join "`n"))) {
            throw "Authorized source checkout is not clean: $($changes -join '; ')"
          }
          "Validated source SHA: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run exact-SHA validate-pr
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\ddda.ps1 validate-pr -Pr ([int]$env:DDDA_PR_NUMBER) -CleanupOnFailure -NonInteractive

      - name: Verify PASS report and stage evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = Join-Path $env:LOCALAPPDATA ("DDDA\validation-reports\pr-{0}-{1}" -f $env:DDDA_PR_NUMBER, $env:DDDA_AUTHORIZED_SHA)
          $reports = @(Get-ChildItem -LiteralPath $reportRoot -Filter result.json -File -Recurse -ErrorAction Stop | Sort-Object LastWriteTimeUtc -Descending)
          if ($reports.Count -eq 0) {
            throw "validate-pr did not create result.json under '$reportRoot'."
          }
          $resultPath = $reports[0].FullName
          $report = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.status -ne 'PASS') {
            throw "validate-pr result status is '$($report.status)', expected PASS."
          }
          if ($report.source.commit -ne $env:DDDA_AUTHORIZED_SHA -or [int]$report.source.pr -ne [int]$env:DDDA_PR_NUMBER) {
            throw 'validate-pr PASS report is not bound to the authorized PR63 exact SHA.'
          }
          $target = Join-Path $env:RUNNER_TEMP 'validate-pr63-evidence'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath $reportRoot -Destination (Join-Path $target 'validation-reports') -Recurse -Force
          $packages = Join-Path $env:LOCALAPPDATA 'DDDA\packages'
          if (Test-Path -LiteralPath $packages -PathType Container) {
            Copy-Item -LiteralPath $packages -Destination (Join-Path $target 'packages') -Recurse -Force
          }
          Copy-Item -LiteralPath $resultPath -Destination (Join-Path $target 'result.json') -Force
          Write-Host "PASS report: $resultPath"
          $report | ConvertTo-Json -Depth 20

      - name: Verify source repository remained unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:DDDA_AUTHORIZED_SHA) {
            throw 'validate-pr changed the source checkout HEAD.'
          }
          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace(($changes -join "`n"))) {
            throw "validate-pr modified the source repository: $($changes -join '; ')"
          }

      - name: Upload exact-SHA validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: validate-pr63-91f45386
          path: ${{ runner.temp }}/validate-pr63-evidence/**
          if-no-files-found: error
          retention-days: 30

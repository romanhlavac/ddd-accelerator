name: DDDA remote execution broker

on:
  issue_comment:
    types:
      - created

concurrency:
  group: ddda-remote-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ddda ')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REQUEST_ACTOR: ${{ github.actor }}
      COMMAND_TEXT: ${{ github.event.comment.body }}
    outputs:
      action: ${{ steps.authorization.outputs.action }}
      expected_sha: ${{ steps.authorization.outputs.expected_sha }}
      canonical_workflow: ${{ steps.authorization.outputs.canonical_workflow }}
      reconciliation_source_ref: ${{ steps.authorization.outputs.reconciliation_source_ref }}
      reconciliation_artifact_prefix: ${{ steps.authorization.outputs.reconciliation_artifact_prefix }}
      remediation_script: ${{ steps.authorization.outputs.remediation_script }}
      miro_team_id: ${{ steps.authorization.outputs.miro_team_id }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repository: ${{ steps.pr.outputs.head_repository }}

    steps:
      - name: Checkout trusted broker from default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve exact PR head
        id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pr = gh api "repos/$env:REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          "head_sha=$($pr.head.sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_ref=$($pr.head.ref)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_repository=$($pr.head.repo.full_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authorize command against governance policy
        id: authorization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = .\scripts\platform\Test-DDDARemoteExecutionRequest.ps1 `
            -PlatformPath $PWD.Path `
            -Repository $env:REPOSITORY `
            -Actor $env:REQUEST_ACTOR `
            -Pr ([int]$env:PR_NUMBER) `
            -HeadSha '${{ steps.pr.outputs.head_sha }}' `
            -HeadRepository '${{ steps.pr.outputs.head_repository }}' `
            -CommandText $env:COMMAND_TEXT `
            -Json | Out-String
          $authorization = $json.Trim() | ConvertFrom-Json
          "action=$($authorization.action)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "expected_sha=$($authorization.expected_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "canonical_workflow=$($authorization.canonical_workflow)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reconciliation_source_ref=$($authorization.reconciliation_source_ref)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reconciliation_artifact_prefix=$($authorization.reconciliation_artifact_prefix)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "remediation_script=$($authorization.remediation_script)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "miro_team_id=$($authorization.miro_team_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  execute:
    needs: authorize
    if: >-
      needs.authorize.result == 'success' &&
      (needs.authorize.outputs.action == 'validate-pr' || needs.authorize.outputs.action == 'remediate')
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
      checks: read
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REQUEST_ACTOR: ${{ github.actor }}
      COMMAND_TEXT: ${{ github.event.comment.body }}

    steps:
      - name: Require successful exact-SHA checks before secret-bearing validation
        if: needs.authorize.outputs.action == 'validate-pr'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = gh api -H 'Accept: application/vnd.github+json' "repos/$env:REPOSITORY/commits/$env:HEAD_SHA/check-runs?per_page=100" | ConvertFrom-Json
          $required = @('Platform validation', 'One-command PR validation')
          foreach ($name in $required) {
            $match = @($checks.check_runs | Where-Object { $_.name -eq $name -and $_.conclusion -eq 'success' })
            if ($match.Count -eq 0) {
              throw "Required successful check '$name' is missing for exact SHA $env:HEAD_SHA."
            }
          }

      - name: Checkout exact PR branch without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.authorize.outputs.head_ref }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ needs.authorize.outputs.head_sha }}') {
            throw "Checkout SHA '$actual' does not match authorized SHA '${{ needs.authorize.outputs.head_sha }}'."
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download exact-SHA canonical candidate
        if: needs.authorize.outputs.action == 'validate-pr'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runsUri = "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/platform-ci.yml/runs?event=pull_request&status=success&head_sha=$env:HEAD_SHA&per_page=100"
          $runs = Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers
          $selected = $null
          foreach ($run in @($runs.workflow_runs | Sort-Object created_at -Descending)) {
            $artifactsUri = "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100"
            $artifacts = Invoke-RestMethod -Method Get -Uri $artifactsUri -Headers $headers
            $name = 'ddda-candidate-' + $env:HEAD_SHA
            $matches = @($artifacts.artifacts | Where-Object { $_.name -eq $name -and -not $_.expired })
            if ($matches.Count -gt 1) {
              throw "Workflow run $($run.id) obsahuje více canonical candidate artifacts pro exact SHA."
            }
            if ($matches.Count -eq 1) {
              $selected = [pscustomobject]@{ Run = $run; Artifact = $matches[0] }
              break
            }
          }
          if ($null -eq $selected) {
            throw "Nenalezen dostupný canonical candidate artifact ze successful platform CI pro exact SHA $env:HEAD_SHA."
          }
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'canonical-candidate'
          $outerZip = Join-Path $env:RUNNER_TEMP 'canonical-candidate-artifact.zip'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          Invoke-WebRequest -Method Get -Uri ([string]$selected.Artifact.archive_download_url) -Headers $headers -OutFile $outerZip
          Expand-Archive -LiteralPath $outerZip -DestinationPath $downloadRoot -Force
          $packages = @(Get-ChildItem -LiteralPath $downloadRoot -Filter '*.zip' -File -Recurse)
          if ($packages.Count -ne 1) {
            throw "Canonical candidate artifact musí obsahovat právě jeden package; nalezeno: $($packages.Count)."
          }
          "CANONICAL_PACKAGE_PATH=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_PACKAGE_ARTIFACT=$([string]$selected.Artifact.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_PACKAGE_ARTIFACT_ID=$([string]$selected.Artifact.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_PACKAGE_RUN_ID=$([string]$selected.Run.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run remote validate-pr and online acceptance
        id: validate
        if: needs.authorize.outputs.action == 'validate-pr'
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)) {
            throw 'MIRO_ACCESS_TOKEN repository secret is not configured.'
          }
          .\ddda.ps1 validate-pr `
            -Pr ([int]$env:PR_NUMBER) `
            -PackagePath $env:CANONICAL_PACKAGE_PATH `
            -PackageArtifactName $env:CANONICAL_PACKAGE_ARTIFACT `
            -PackageWorkflowRunId $env:CANONICAL_PACKAGE_RUN_ID `
            -WithMiro `
            -Full `
            -KeepReviewBoard `
            -MiroTeamId '${{ needs.authorize.outputs.miro_team_id }}' `
            -NonInteractive

      - name: Run guarded remediation without push
        id: remediate
        if: needs.authorize.outputs.action == 'remediate'
        shell: pwsh
        env:
          AUTHORIZED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REMEDIATION_SCRIPT: ${{ needs.authorize.outputs.remediation_script }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'DDDA Remote Remediation'
          git config user.email 'ddda-remote-remediation@example.invalid'
          $before = (git rev-parse HEAD).Trim()
          if ($before -ne $env:AUTHORIZED_HEAD_SHA) {
            throw 'Remediation checkout drifted before execution.'
          }
          $script = Join-Path $PWD.Path $env:REMEDIATION_SCRIPT
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Authorized remediation script does not exist at exact PR head: $env:REMEDIATION_SCRIPT"
          }
          & $script -RepositoryRoot $PWD.Path -NoPush
          if ($LASTEXITCODE -ne 0) {
            throw "Remediation script failed with exit code $LASTEXITCODE."
          }
          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace(($changes -join "`n"))) {
            throw "Remediation left a dirty working tree:`n$($changes -join "`n")"
          }
          $after = (git rev-parse HEAD).Trim()
          if ($after -eq $before) {
            throw 'Remediation did not create a validated commit.'
          }
          $commitCount = [int](git rev-list --count "$before..$after")
          if ($commitCount -ne 1) {
            throw "Remote remediation must create exactly one commit; created $commitCount."
          }
          "before_sha=$before" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "after_sha=$after" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Push validated remediation commit
        if: needs.authorize.outputs.action == 'remediate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BEFORE_SHA: ${{ steps.remediate.outputs.before_sha }}
          VALIDATED_AFTER_SHA: ${{ steps.remediate.outputs.after_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:VALIDATED_AFTER_SHA) {
            throw "Validated remediation SHA drifted before push."
          }
          $targetRef = '${{ needs.authorize.outputs.head_ref }}'
          if ([string]::IsNullOrWhiteSpace($targetRef)) {
            throw 'Resolved PR head ref is empty before remediation push.'
          }
          $refspec = '{0}:{1}' -f $env:VALIDATED_AFTER_SHA, $targetRef
          gh auth setup-git
          git push origin $refspec
          if ($LASTEXITCODE -ne 0) {
            throw "Validated remediation push failed for ref '$targetRef'."
          }

      - name: Stage execution evidence
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ddda-remote-evidence'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($source in @(
            (Join-Path $env:LOCALAPPDATA 'DDDA\validation-reports'),
            (Join-Path $env:LOCALAPPDATA 'DDDA\acceptance-reports'),
            (Join-Path $env:LOCALAPPDATA 'DDDA\remediation-checks')
          )) {
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
            }
          }
          @{
            repository = $env:REPOSITORY
            pr = [int]$env:PR_NUMBER
            actor = $env:REQUEST_ACTOR
            command = $env:COMMAND_TEXT
            authorized_sha = '${{ needs.authorize.outputs.head_sha }}'
            action = '${{ needs.authorize.outputs.action }}'
            run_id = $env:GITHUB_RUN_ID
            canonical_candidate_workflow_run_id = $env:CANONICAL_PACKAGE_RUN_ID
            canonical_candidate_artifact_id = $env:CANONICAL_PACKAGE_ARTIFACT_ID
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $target 'request.json') -Encoding UTF8

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddda-remote-${{ env.PR_NUMBER }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ddda-remote-evidence/**
          if-no-files-found: warn
          retention-days: 14

      - name: Comment execution result
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $body = @"
          DDDA remote execution: **$env:JOB_STATUS**

          - action: `${{ needs.authorize.outputs.action }}`
          - authorized SHA: `${{ needs.authorize.outputs.head_sha }}`
          - workflow run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

          No merge, tag, release or promotion was performed.
          "@
          gh api --method POST "repos/$env:REPOSITORY/issues/$env:PR_NUMBER/comments" -f body="$body" | Out-Null

  reconcile-project:
    needs: authorize
    if: >-
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.action == 'reconcile-project'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: ddda-project-backlog-reconciliation
      cancel-in-progress: false
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REQUEST_ACTOR: ${{ github.actor }}
      COMMAND_TEXT: ${{ github.event.comment.body }}
      AUTHORIZED_PR_SHA: ${{ needs.authorize.outputs.head_sha }}
      EXPECTED_SHA: ${{ needs.authorize.outputs.expected_sha }}
      CANONICAL_WORKFLOW: ${{ needs.authorize.outputs.canonical_workflow }}
      SOURCE_REF: ${{ needs.authorize.outputs.reconciliation_source_ref }}
      AUDIT_ARTIFACT_PREFIX: ${{ needs.authorize.outputs.reconciliation_artifact_prefix }}

    steps:
      - name: Dispatch canonical Project reconciliation and verify evidence
        id: reconcile
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AUTHORIZED_PR_SHA -ne $env:EXPECTED_SHA) {
            throw 'Authorized PR SHA no longer matches explicit expected SHA before dispatch.'
          }
          if ($env:CANONICAL_WORKFLOW -ne '.github/workflows/reconcile-ddda-project-backlog.yml') {
            throw 'Only the canonical DDDA Project reconciliation workflow may be dispatched.'
          }
          if ($env:SOURCE_REF -ne 'main') {
            throw 'Project reconciliation source ref must be canonical main.'
          }
          $workflowEndpoint = 'reconcile-ddda-project-backlog.yml'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $maxAttempts = 3
          $selectedRun = $null
          $selectedSourceSha = $null
          $selectedArtifact = $null
          $auditRemaining = $null
          $presentationRemaining = $null
          $releaseRemaining = $null

          function Get-WorkflowRuns {
            $uri = "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/$workflowEndpoint/runs?event=workflow_dispatch&per_page=100"
            return Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          }

          function Wait-NoActiveReconciliation {
            for ($i = 0; $i -lt 180; $i++) {
              $runs = Get-WorkflowRuns
              $active = @($runs.workflow_runs | Where-Object { $_.status -in @('queued', 'in_progress') })
              if ($active.Count -eq 0) { return }
              Start-Sleep -Seconds 10
            }
            throw 'Timed out waiting for an existing privileged Project reconciliation to finish.'
          }

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Wait-NoActiveReconciliation

            $pr = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:REPOSITORY/pulls/$env:PR_NUMBER" -Headers $headers
            if ([string]$pr.head.sha -ne $env:EXPECTED_SHA) {
              throw "PR head drifted before dispatch. Expected $env:EXPECTED_SHA, live $($pr.head.sha)."
            }

            $branch = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:REPOSITORY/branches/$env:SOURCE_REF" -Headers $headers
            $sourceSha = [string]$branch.commit.sha
            if ($sourceSha -notmatch '^[0-9a-f]{40}$') {
              throw 'Could not resolve a canonical reconciliation source SHA.'
            }

            $before = Get-WorkflowRuns
            $baseline = @{}
            foreach ($run in @($before.workflow_runs)) { $baseline[[string]$run.id] = $true }

            $dispatchUri = "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/$workflowEndpoint/dispatches"
            Invoke-RestMethod -Method Post -Uri $dispatchUri -Headers $headers -ContentType 'application/json' -Body (@{ ref = $env:SOURCE_REF } | ConvertTo-Json -Compress) | Out-Null

            $run = $null
            for ($poll = 0; $poll -lt 90; $poll++) {
              Start-Sleep -Seconds 4
              $after = Get-WorkflowRuns
              $newRuns = @($after.workflow_runs | Where-Object { -not $baseline.ContainsKey([string]$_.id) } | Sort-Object created_at -Descending)
              if ($newRuns.Count -gt 1) {
                throw 'More than one new canonical reconciliation run appeared after one dispatch; evidence identity is ambiguous.'
              }
              if ($newRuns.Count -eq 1) {
                $run = $newRuns[0]
                break
              }
            }
            if ($null -eq $run) {
              throw 'Canonical Project reconciliation dispatch did not produce a discoverable workflow run.'
            }

            if ([string]$run.head_sha -ne $sourceSha) {
              Wait-NoActiveReconciliation
              if ($attempt -eq $maxAttempts) {
                throw "Dispatched reconciliation source SHA '$($run.head_sha)' does not match resolved source '$sourceSha'."
              }
              continue
            }

            $runId = [string]$run.id
            for ($poll = 0; $poll -lt 450; $poll++) {
              $runState = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$runId" -Headers $headers
              if ([string]$runState.status -eq 'completed') {
                $run = $runState
                break
              }
              Start-Sleep -Seconds 8
            }
            if ([string]$run.status -ne 'completed') {
              throw "Canonical reconciliation run $runId did not complete within the bounded wait."
            }
            if ([string]$run.conclusion -ne 'success') {
              throw "Canonical reconciliation run $runId concluded '$($run.conclusion)'; broker cannot issue PASS."
            }

            $currentBranch = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:REPOSITORY/branches/$env:SOURCE_REF" -Headers $headers
            $currentSourceSha = [string]$currentBranch.commit.sha
            if ($currentSourceSha -ne $sourceSha) {
              if ($attempt -eq $maxAttempts) {
                throw "Canonical source moved from $sourceSha to $currentSourceSha before evidence acceptance."
              }
              continue
            }

            $artifactResponse = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$runId/artifacts?per_page=100" -Headers $headers
            $expectedArtifactName = $env:AUDIT_ARTIFACT_PREFIX + $sourceSha
            $matches = @($artifactResponse.artifacts | Where-Object { $_.name -eq $expectedArtifactName -and -not $_.expired })
            if ($matches.Count -ne 1) {
              throw "Canonical reconciliation run $runId must expose exactly one non-expired audit artifact '$expectedArtifactName'; found $($matches.Count)."
            }
            $artifact = $matches[0]
            $outerZip = Join-Path $env:RUNNER_TEMP "reconcile-audit-$runId.zip"
            $extractRoot = Join-Path $env:RUNNER_TEMP "reconcile-audit-$runId"
            Invoke-WebRequest -Method Get -Uri ([string]$artifact.archive_download_url) -Headers $headers -OutFile $outerZip
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            Expand-Archive -LiteralPath $outerZip -DestinationPath $extractRoot -Force

            $auditFiles = @(Get-ChildItem -LiteralPath $extractRoot -Filter 'audit.json' -File -Recurse)
            $presentationFiles = @(Get-ChildItem -LiteralPath $extractRoot -Filter 'presentation.json' -File -Recurse)
            $releaseFiles = @(Get-ChildItem -LiteralPath $extractRoot -Filter 'release-planning.json' -File -Recurse)
            if ($auditFiles.Count -ne 1 -or $presentationFiles.Count -ne 1 -or $releaseFiles.Count -ne 1) {
              throw 'Canonical reconciliation audit artifact has missing or ambiguous read-back evidence files.'
            }
            $audit = Get-Content -LiteralPath $auditFiles[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            $presentation = Get-Content -LiteralPath $presentationFiles[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            $release = Get-Content -LiteralPath $releaseFiles[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            foreach ($evidence in @($audit, $presentation, $release)) {
              if ([string]$evidence.source_sha -ne $sourceSha) {
                throw "Reconciliation evidence source SHA does not match canonical source $sourceSha."
              }
            }
            $auditRemaining = [int]$audit.remaining_count
            $presentationRemaining = [int]$presentation.remaining_count
            $releaseRemaining = [int]$release.remaining_count
            $remaining = $auditRemaining + $presentationRemaining + $releaseRemaining
            if ($remaining -ne 0) {
              throw "Canonical reconciliation evidence contains remaining mismatches: $remaining."
            }

            $selectedRun = $run
            $selectedSourceSha = $sourceSha
            $selectedArtifact = $artifact
            break
          }

          if ($null -eq $selectedRun -or $null -eq $selectedArtifact) {
            throw 'No current canonical reconciliation evidence was accepted after bounded source-drift retries.'
          }

          "source_sha=$selectedSourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "workflow_run_id=$($selectedRun.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "workflow_conclusion=$($selectedRun.conclusion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "audit_artifact_id=$($selectedArtifact.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "audit_artifact_name=$($selectedArtifact.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "remaining_mismatches=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          @"
          Canonical Project reconciliation PASS
          source SHA: $selectedSourceSha
          workflow run: $($selectedRun.id)
          audit artifact: $($selectedArtifact.id) / $($selectedArtifact.name)
          remaining mismatches: 0
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Stage reconciliation broker evidence
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ddda-project-reconcile-broker-evidence'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          @{
            repository = $env:REPOSITORY
            pr = [int]$env:PR_NUMBER
            requested_actor = $env:REQUEST_ACTOR
            command = $env:COMMAND_TEXT
            authorized_pr_head_sha = $env:AUTHORIZED_PR_SHA
            expected_sha = $env:EXPECTED_SHA
            canonical_workflow = $env:CANONICAL_WORKFLOW
            reconciliation_source_sha = '${{ steps.reconcile.outputs.source_sha }}'
            workflow_run_id = '${{ steps.reconcile.outputs.workflow_run_id }}'
            workflow_conclusion = '${{ steps.reconcile.outputs.workflow_conclusion }}'
            audit_artifact_id = '${{ steps.reconcile.outputs.audit_artifact_id }}'
            audit_artifact_name = '${{ steps.reconcile.outputs.audit_artifact_name }}'
            remaining_mismatches = '${{ steps.reconcile.outputs.remaining_mismatches }}'
            human_review_status = 'PENDING'
            merge_authorized = $false
            release_authorized = $false
            tag_authorized = $false
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $target 'request.json') -Encoding UTF8

      - name: Upload reconciliation broker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddda-project-reconcile-broker-${{ env.PR_NUMBER }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ddda-project-reconcile-broker-evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Comment reconciliation result
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $body = @"
          DDDA Project reconciliation broker: **$env:JOB_STATUS**

          - authorized PR SHA: `$env:AUTHORIZED_PR_SHA`
          - expected SHA: `$env:EXPECTED_SHA`
          - canonical workflow: `$env:CANONICAL_WORKFLOW`
          - reconciliation source SHA: `${{ steps.reconcile.outputs.source_sha }}`
          - canonical workflow run: `${{ steps.reconcile.outputs.workflow_run_id }}`
          - audit artifact: `${{ steps.reconcile.outputs.audit_artifact_id }}` / `${{ steps.reconcile.outputs.audit_artifact_name }}`
          - remaining mismatches: `${{ steps.reconcile.outputs.remaining_mismatches }}`
          - broker workflow run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

          No Project credential was exposed to Chat/Work or broker evidence. No Human Review, merge, tag, release or promotion was performed.
          "@
          gh api --method POST "repos/$env:REPOSITORY/issues/$env:PR_NUMBER/comments" -f body="$body" | Out-Null

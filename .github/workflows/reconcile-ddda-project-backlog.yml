name: Reconcile DDDA Project Backlog & Delivery One Shot

on:
  push:
    branches:
      - gov/project-delivery-readback-20260814-373d1d01-run2

permissions:
  contents: read

jobs:
  reconcile:
    environment: ddda-backlog-governance
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DDDA_GITHUB_PROJECT_TOKEN }}
      DDDA_AUTHORIZED_BASE_SHA: 91f45386bb5ca93e4654769e945f77fa40d1a6cc
      DDDA_STAGING_BRANCH: gov/project-delivery-readback-20260814-373d1d01-run2
      DDDA_STAGING_PARENT_SHA: 345b1cdb00b5462d8e82ee2bf72441696bb2bb6d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify one-shot staging isolation and current PR63 head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DDDA_STAGING_BRANCH"
          test "$(git rev-parse HEAD^)" = "$DDDA_STAGING_PARENT_SHA"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/reconcile-ddda-project-backlog.yml"
          actual="$(gh api repos/romanhlavac/ddd-accelerator/pulls/63 --jq .head.sha)"
          test "$actual" = "$DDDA_AUTHORIZED_BASE_SHA"
          git cat-file -e "$DDDA_AUTHORIZED_BASE_SHA^{commit}"

      - name: Detach exact authorized PR63 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$DDDA_AUTHORIZED_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$DDDA_AUTHORIZED_BASE_SHA"
          echo "Authorized source SHA: $DDDA_AUTHORIZED_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate persistent Project credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh auth status --hostname github.com >/dev/null
          count="$(gh project list --owner romanhlavac --limit 100 --format json --jq '[.projects[] | select((.title=="DDDA Platform Backlog & Delivery" or .title=="DDDA Platform Backlog") and (.closed|not))] | length')"
          test "$count" = "1"

      - name: Validate governance contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/platform/Reconcile-DDDAProjectBacklog.py
          python -m json.tool config/governance/github-bootstrap.json >/dev/null
          python - <<'PY'
          import runpy
          ns = runpy.run_path('runtime/platform/tests/test_project_backlog_delivery_governance.py')
          tests = sorted((name, fn) for name, fn in ns.items() if name.startswith('test_') and callable(fn))
          assert tests, 'No governance contract tests discovered'
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'{len(tests)} governance contract tests passed')
          PY

      - name: Reconcile and read back exact PR63 source
        run: python scripts/platform/Reconcile-DDDAProjectBacklog.py

      - name: Assert versioned projections are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            config/governance \
            docs/governance \
            docs/adr/0003-github-native-backlog-governance.md \
            scripts/platform/Reconcile-DDDAProjectBacklog.py \
            runtime/platform/tests/test_project_backlog_delivery_governance.py

      - name: Assert audit result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('.reports/cr-delivery-audit-v6/audit.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['source_sha'] == os.environ['DDDA_AUTHORIZED_BASE_SHA']
          assert data['project']['title'] == 'DDDA Platform Backlog & Delivery'
          assert data['remaining_count'] == 0
          print(json.dumps({
              'source_sha': data['source_sha'],
              'project': data['project']['title'],
              'project_number': data['project']['number'],
              'mapped_cr_count': data['mapped_cr_count'],
              'open_pr_count': data['open_pr_count'],
              'mapped_pr_count': data['mapped_pr_count'],
              'repair_count': data['repair_count'],
              'remaining_count': data['remaining_count'],
          }))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ddda-project-backlog-delivery-audit-v6-pr63-91f45386
          path: .reports/cr-delivery-audit-v6/**
          retention-days: 30
          if-no-files-found: error

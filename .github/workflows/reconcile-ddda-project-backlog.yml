name: DDDA PR63 Payload Blob Validation

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/reconcile-ddda-project-backlog.yml

permissions:
  contents: write

jobs:
  validate-payload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_BLOB_SHA: 5ebb059d35851d00a61a3cf1b8b378bd7bc49d17
    steps:
      - name: Fetch uploaded Git blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${PACKAGE_BLOB_SHA}" --jq '.content' | tr -d '\n' | base64 -d > "$RUNNER_TEMP/payload/package.zip"
          sha256sum "$RUNNER_TEMP/payload/package.zip"
          unzip -t "$RUNNER_TEMP/payload/package.zip"
          unzip -q "$RUNNER_TEMP/payload/package.zip" -d "$RUNNER_TEMP/payload/unpacked"

      - name: Validate manifest and every payload file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'payload' / 'unpacked'
          m = json.loads((root/'manifest.json').read_text())
          assert m['repository'] == 'romanhlavac/ddd-accelerator'
          assert m['target_branch'] == 'chore/wp-split-governance-cleanup'
          assert m['base_sha'] == '78078b28f658a9dbef69f7772ae9dc534f75ec99'
          assert m['impact'] == 'HIGH'
          for f in m['files']:
              p = root/'payload'/f['path']
              assert p.is_file(), f['path']
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == f['sha256'], (f['path'], actual, f['sha256'])
          assert sorted(f['path'] for f in m['files']) == sorted(m['expected_paths'])
          print(f"validated {len(m['files'])} payload files")
          PY

      - name: Materialize validated payload as Git blobs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/payload/unpacked"
          python - <<'PY' > "$RUNNER_TEMP/payload/paths.txt"
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'payload'/'unpacked'
          m=json.loads((root/'manifest.json').read_text())
          for p in m['expected_paths']:
              print(p)
          PY
          : > "$RUNNER_TEMP/payload/blob-map.jsonl"
          while IFS= read -r path; do
            content="$(base64 -w0 "$ROOT/payload/$path")"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$content" -f encoding=base64 --jq '.sha')"
            jq -nc --arg path "$path" --arg sha "$sha" '{path:$path,sha:$sha}' >> "$RUNNER_TEMP/payload/blob-map.jsonl"
          done < "$RUNNER_TEMP/payload/paths.txt"
          jq -s '.' "$RUNNER_TEMP/payload/blob-map.jsonl" > blob-map.json
          cat blob-map.json

      - name: Upload validated blob map
        uses: actions/upload-artifact@v4
        with:
          name: pr63-delivery-validated-blob-map
          path: blob-map.json
          retention-days: 7
          if-no-files-found: error

name: DDDA PR63 Final Blob Materialization Retry

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/reconcile-ddda-project-backlog.yml

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SCRIPT_SHA256: bd181a9c0c2294a0366311abdc709413d1b8ae8194b3d0622a158c3441a66f06
    steps:
      - name: Reconstruct and validate reconciler
        shell: bash
        run: |
          set -euo pipefail
          : > reconciler.b64
          for sha in \
            b3d2a19ed72501507adbe4784501d88f4c95900e \
            0fd135cf05d801a12a7c7233cfd0fd35fbba6236 \
            7eb539dc72e1ceb42f2f619f5485819d31da23a6 \
            49b11e595802bd5d28e49e10e07ceeca8024f1a6 \
            2abe20ffc06206b5733c7851fabba5870d50b2d7 \
            c749e4aa4b13e55b7b76c3901147cb199e47b196 \
            b6bc9439cc1549a2e2ce96f970491c127bdf5355 \
            321896331bba671671d37ab226991a8a9844fc3c
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' | tr -d '\n' | base64 -d >> reconciler.b64
          done
          base64 -d reconciler.b64 > Reconcile-DDDAProjectBacklog.py
          echo "${SCRIPT_SHA256}  Reconcile-DDDAProjectBacklog.py" | sha256sum -c -
          python -m py_compile Reconcile-DDDAProjectBacklog.py
          grep -q 'PROJECT_TITLE = "DDDA Platform Backlog & Delivery"' Reconcile-DDDAProjectBacklog.py
          grep -q 'DELIVERY_VIEW = "Implementace a Delivery"' Reconcile-DDDAProjectBacklog.py
          grep -q 'is:pr is:open' Reconcile-DDDAProjectBacklog.py

      - name: Build and validate final bootstrap config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prep
          gh run download 31791054765 -R "${GITHUB_REPOSITORY}" -n ddda-project-delivery-contract-prep -D prep
          cp prep/prepared/config/governance/github-bootstrap.json github-bootstrap.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('github-bootstrap.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          assert x['project_title'] == 'DDDA Platform Backlog & Delivery'
          x['delivery_projection']['delivery_view']['filter'] = 'is:pr is:open'
          for v in x['views']:
              if v['name'] == 'Implementace a Delivery':
                  v['filter'] = 'is:pr is:open'
          assert x['views'] == [
              {'name':'Plánování a Backlog','layout':'table','filter':'is:issue'},
              {'name':'Implementace a Delivery','layout':'table','filter':'is:pr is:open'},
          ]
          for group in x.get('item_groups', []):
              if group.get('kind') == 'pull':
                  assert 'Item Type' not in (group.get('metadata') or {})
          p.write_text(json.dumps(x, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m json.tool github-bootstrap.json >/dev/null

      - name: Create final Git blobs
        shell: bash
        run: |
          set -euo pipefail
          create_blob() {
            local file="$1" path="$2" request response sha
            request="$(mktemp)"
            response="$(mktemp)"
            python - "$file" "$request" <<'PY'
          import base64, json, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, 'rb') as f:
              payload = {'content': base64.b64encode(f.read()).decode('ascii'), 'encoding': 'base64'}
          with open(dst, 'w', encoding='utf-8') as f:
              json.dump(payload, f)
          PY
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --input "$request" > "$response"
            sha="$(jq -r '.sha' "$response")"
            jq -nc --arg path "$path" --arg sha "$sha" '{path:$path,sha:$sha}'
          }
          {
            create_blob Reconcile-DDDAProjectBacklog.py scripts/platform/Reconcile-DDDAProjectBacklog.py
            create_blob github-bootstrap.json config/governance/github-bootstrap.json
          } | jq -s '.' > final-blob-map.json
          cat final-blob-map.json

      - name: Upload final blob map
        uses: actions/upload-artifact@v4
        with:
          name: pr63-final-blob-map-retry
          path: final-blob-map.json
          retention-days: 7
          if-no-files-found: error

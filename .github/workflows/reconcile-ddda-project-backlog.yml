name: DDDA Project Delivery Operational Docs Prep

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/reconcile-ddda-project-backlog.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78078b28f658a9dbef69f7772ae9dc534f75ec99

      - name: Patch current operational documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              'docs/governance/project-administration-checklist.md',
              'docs/governance/next-steps.md',
              'docs/governance/native-github-setup-runbook.md',
              'docs/governance/README.md',
              'docs/governance/backlog-governance.md',
          ]
          out = Path('prepared')
          for raw in files:
              p = Path(raw)
              text = p.read_text(encoding='utf-8')
              text = text.replace('DDDA Platform Backlog', 'DDDA Platform Backlog & Delivery')
              if raw.endswith('backlog-governance.md'):
                  old = '''Work Package (nebo explicitní Other)\n↔ Change Request Issue\n↔ DDDA Platform Backlog & Delivery Project item\n\nChange Request Issue\n↔ implementation branch / Draft PR'''
                  new = '''Work Package (nebo explicitní Other)\n↔ Change Request Issue\n↔ Project planning item\n\nChange Request Issue\n↔ implementation branch / Draft PR\n↔ Project delivery item'''
                  if old not in text:
                      raise SystemExit('backlog-governance invariant not found')
                  text = text.replace(old, new)
                  text = text.replace(
                      'Implementační PR není automaticky druhá backlogová položka. Samostatná Project membership PR je povinná pouze tehdy, pokud ji explicitně vyžaduje planning policy. Detailní fail-closed pravidla jsou v [WP ↔ Backlog ↔ Implementation consistency](wp-backlog-consistency.md).',
                      'Otevřený implementační PR je povinná Project delivery projection, nikoli druhý Change Request. Jeho Work Package se odvozuje z primary CR a planning `Item Type` se na PR nepoužívá. Detailní fail-closed pravidla jsou v [WP ↔ Backlog ↔ Delivery consistency](wp-backlog-consistency.md).'
                  )
                  text = text.replace(
                      '- pokud planning policy používá PR Project items, metadata PR jsou konzistentní s CR;',
                      '- každý otevřený implementační PR je Project delivery item a jeho Work Package/Status jsou konzistentní s primary CR a delivery projection;'
                  )
              if raw.endswith('README.md'):
                  text = text.replace(
                      'Change Request Issue\n↔ implementation branch / Draft PR',
                      'Change Request Issue\n↔ implementation branch / Draft PR\n↔ Project delivery item'
                  )
              target = out / raw
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          PY
          grep -RIn -E 'DDDA Platform Backlog([^ &]|$)|Implementační PR není automaticky druhá backlogová položka|pokud planning policy používá PR Project items' prepared || true

      - name: Upload prepared docs
        uses: actions/upload-artifact@v4
        with:
          name: ddda-project-delivery-operational-docs-prep
          path: prepared/
          retention-days: 7
          if-no-files-found: error

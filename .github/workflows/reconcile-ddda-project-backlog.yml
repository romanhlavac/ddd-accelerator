name: Reconcile DDDA Project Backlog & Delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    environment: ddda-backlog-governance
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DDDA_GITHUB_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governance test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      - name: Record exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "Source SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate persistent Project credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh auth status --hostname github.com >/dev/null
          count="$(gh project list --owner romanhlavac --limit 100 --format json --jq '[.projects[] | select((.title=="DDDA Platform Backlog & Delivery" or .title=="DDDA Platform Backlog") and (.closed|not))] | length')"
          test "$count" = "1"

      - name: Validate governance contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/platform/Reconcile-DDDAReleasePlanning.py
          python -m py_compile scripts/platform/Reconcile-DDDAProjectBacklog.py
          python -m py_compile scripts/platform/Reconcile-DDDAProjectBacklogCore.py
          python -m py_compile scripts/platform/Reconcile-DDDAProjectBacklogPresentation.py
          python -m json.tool config/governance/github-bootstrap.json >/dev/null
          python -m pytest -q \
            runtime/platform/tests/test_project_backlog_delivery_governance.py \
            runtime/platform/tests/test_project_backlog_presentation_governance.py

      - name: Reconcile and read back
        shell: bash
        run: |
          set -euo pipefail
          python scripts/platform/Reconcile-DDDAReleasePlanning.py --mode reconcile
          python scripts/platform/Reconcile-DDDAProjectBacklogPresentation.py --mode reconcile
          python scripts/platform/Reconcile-DDDAProjectBacklog.py
          python scripts/platform/Reconcile-DDDAProjectBacklogPresentation.py --mode verify
          python scripts/platform/Reconcile-DDDAReleasePlanning.py --mode verify

      - name: Assert versioned projections are synchronized
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            config/governance \
            docs/governance \
            docs/adr/0003-github-native-backlog-governance.md \
            scripts/platform/Reconcile-DDDAReleasePlanning.py \
            scripts/platform/Reconcile-DDDAProjectBacklog.py \
            scripts/platform/Reconcile-DDDAProjectBacklogCore.py \
            scripts/platform/Reconcile-DDDAProjectBacklogPresentation.py \
            runtime/platform/tests/test_project_backlog_delivery_governance.py \
            runtime/platform/tests/test_project_backlog_presentation_governance.py

      - name: Assert audit result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          audit = json.loads(Path('.reports/cr-delivery-audit-v6/audit.json').read_text(encoding='utf-8'))
          presentation = json.loads(Path('.reports/cr-delivery-audit-v6/presentation.json').read_text(encoding='utf-8'))
          release_planning = json.loads(Path('.reports/cr-delivery-audit-v6/release-planning.json').read_text(encoding='utf-8'))
          assert audit['source_sha'] == os.environ['GITHUB_SHA']
          assert presentation['source_sha'] == os.environ['GITHUB_SHA']
          assert release_planning['source_sha'] == os.environ['GITHUB_SHA']
          assert audit['remaining_count'] == 0
          assert presentation['remaining_count'] == 0
          assert release_planning['remaining_count'] == 0
          print(json.dumps({
              'source_sha': audit['source_sha'],
              'project': audit['project']['title'],
              'mapped_cr_count': audit['mapped_cr_count'],
              'open_pr_count': audit['open_pr_count'],
              'mapped_pr_count': audit['mapped_pr_count'],
              'repair_count': audit['repair_count'],
              'presentation_repair_count': presentation['repair_count'],
              'remaining_count': audit['remaining_count'],
              'presentation_remaining_count': presentation['remaining_count'],
          }))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ddda-project-backlog-delivery-audit-v6-${{ github.sha }}
          path: .reports/cr-delivery-audit-v6/**
          retention-days: 30
          if-no-files-found: error

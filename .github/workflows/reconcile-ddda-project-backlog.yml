name: DDDA Project Delivery Contract Prep

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/reconcile-ddda-project-backlog.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78078b28f658a9dbef69f7772ae9dc534f75ec99
          fetch-depth: 1

      - name: Verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "78078b28f658a9dbef69f7772ae9dc534f75ec99"

      - name: Inventory old Project contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prep-evidence
          grep -RIn --exclude-dir=.git --exclude='*.pyc' -E 'DDDA Platform Backlog|planned_prs_as_backlog_forbidden|Implementační PR není automaticky|Project item.*PR|View 1' config docs knowledge scripts runtime .github > prep-evidence/contract-grep.txt || true
          cat prep-evidence/contract-grep.txt

      - name: Prepare targeted config replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path('prepared')
          (out / 'config/governance').mkdir(parents=True, exist_ok=True)

          src = Path('config/governance/backlog-policy.yaml').read_text(encoding='utf-8')
          src = src.replace(
              '  planned_prs_as_backlog_forbidden: true\n',
              '  planned_prs_as_backlog_forbidden: true\n'
              '  active_implementation_prs_project_membership_required: true\n'
              '  pr_project_item_is_delivery_projection_not_backlog_authority: true\n'
          )
          src = src.replace('  name: DDDA Platform Backlog\n', '  name: DDDA Platform Backlog & Delivery\n')
          old_views = '''  views:\n    - Work Packages\n    - WP hierarchy\n    - Delivery board\n    - Roadmap by Work Package\n    - Release scope\n    - Blocked and P0\n    - Human review queue\n    - Ready without owner\n    - Recently completed\n'''
          new_views = '''  views:\n    - Plánování a Backlog\n    - Implementace a Delivery\n  view_contract:\n    planning:\n      name: Plánování a Backlog\n      layout: table\n      filter: is:issue\n    delivery:\n      name: Implementace a Delivery\n      layout: table\n      filter: is:pr\n  delivery_projection:\n    open_implementation_pr_membership_required: true\n    primary_change_request_relation: Implements_or_Closes\n    work_package_source: primary_change_request\n    project_item_type_field: unset\n    draft_status: In progress\n    ready_status: In review\n    blocked_override: Blocked\n'''
          if old_views not in src:
              raise SystemExit('Expected backlog-policy views block not found')
          src = src.replace(old_views, new_views)
          (out / 'config/governance/backlog-policy.yaml').write_text(src, encoding='utf-8')

          cfg = json.loads(Path('config/governance/github-bootstrap.json').read_text(encoding='utf-8-sig'))
          cfg['project_title'] = 'DDDA Platform Backlog & Delivery'
          cfg['project_description'] = (
              'Planning backlog and active delivery visibility for the DDDA platform. '
              'Work Packages and Change Request Issues remain planning authority; active implementation '
              'pull requests are maintained as delivery projections linked to one primary Change Request.'
          )
          cfg['delivery_projection'] = {
              'planning_view': {'name': 'Plánování a Backlog', 'layout': 'table', 'filter': 'is:issue'},
              'delivery_view': {'name': 'Implementace a Delivery', 'layout': 'table', 'filter': 'is:pr'},
              'open_implementation_pr_membership_required': True,
              'primary_change_request_relation': 'Implements_or_Closes',
              'work_package_source': 'primary_change_request',
              'project_item_type_field': None,
          }
          for group in cfg.get('item_groups', []):
              if group.get('kind') == 'pull':
                  (group.get('metadata') or {}).pop('Item Type', None)
          cfg['views'] = [
              {'name': 'Plánování a Backlog', 'layout': 'table', 'filter': 'is:issue'},
              {'name': 'Implementace a Delivery', 'layout': 'table', 'filter': 'is:pr'},
          ]
          (out / 'config/governance/github-bootstrap.json').write_text(
              json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          python -m json.tool prepared/config/governance/github-bootstrap.json >/dev/null
          grep -n -E 'DDDA Platform Backlog|active_implementation|view_contract|delivery_projection' prepared/config/governance/backlog-policy.yaml prepared/config/governance/github-bootstrap.json

      - name: Upload preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ddda-project-delivery-contract-prep
          path: |
            prepared/
            prep-evidence/contract-grep.txt
          retention-days: 7
          if-no-files-found: error

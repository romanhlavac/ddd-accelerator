name: DDDA PR63 Bootstrap Blob Materialization

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/reconcile-ddda-project-backlog.yml

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact-SHA preparation artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prep
          gh run download 31791054765 -R "${GITHUB_REPOSITORY}" -n ddda-project-delivery-contract-prep -D prep
          test -f prep/prepared/config/governance/github-bootstrap.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('prep/prepared/config/governance/github-bootstrap.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['project_title']=='DDDA Platform Backlog & Delivery'
          assert x['delivery_projection']['delivery_view']['name']=='Implementace a Delivery'
          assert x['delivery_projection']['delivery_view']['filter']=='is:pr is:open'
          assert x['views']==[
              {'name':'Plánování a Backlog','layout':'table','filter':'is:issue'},
              {'name':'Implementace a Delivery','layout':'table','filter':'is:pr is:open'},
          ]
          print(p.stat().st_size)
          PY

      - name: Create Git blob from validated artifact file
        shell: bash
        run: |
          set -euo pipefail
          file='prep/prepared/config/governance/github-bootstrap.json'
          content="$(base64 -w0 "$file")"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$content" -f encoding=base64 --jq '.sha')"
          jq -nc --arg path 'config/governance/github-bootstrap.json' --arg sha "$sha" '{path:$path,sha:$sha}' > bootstrap-blob.json
          cat bootstrap-blob.json

      - name: Upload blob map
        uses: actions/upload-artifact@v4
        with:
          name: pr63-bootstrap-blob-map
          path: bootstrap-blob.json
          retention-days: 7
          if-no-files-found: error

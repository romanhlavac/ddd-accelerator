name: Patch PR8 Platform USAGE

on:
  push:
    branches:
      - feat/project-steering-and-documentation

permissions:
  contents: write

jobs:
  patch-usage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-steering-and-documentation
          fetch-depth: 0
      - name: Insert platform lifecycle guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('USAGE.md')
          text = path.read_text(encoding='utf-8-sig')
          marker = '## 2. Kanonický první clone a smoke testy\n'
          if marker not in text:
              raise SystemExit('USAGE insertion marker not found.')
          if '## 2. Vývoj DDDA platformy\n' in text:
              raise SystemExit('USAGE already contains platform lifecycle section.')

          section = r'''## 2. Vývoj DDDA platformy

Vývoj platformy je oddělený od práce v klientském projektu:

```text
platform repository
→ candidate/release package
→ generated validation workspace
→ synthetic example project
```

Klientský workspace se nikdy nepoužívá jako platformní test fixture.

### 2.1 Stabilní entry point

Základní diagnostika:

```powershell
.\ddda.ps1 doctor
```

Pojmenované test suites:

```powershell
.\ddda.ps1 test -Suite lint
.\ddda.ps1 test -Suite schema
.\ddda.ps1 test -Suite unit
.\ddda.ps1 test -Suite component
.\ddda.ps1 test -Suite regression
.\ddda.ps1 test -Suite security
```

### 2.2 Jednopříkazová validace PR

Offline:

```powershell
.\ddda.ps1 validate-pr -Pr 8
```

Včetně Miro:

```powershell
.\ddda.ps1 validate-pr -Pr 8 -WithMiro -Full -CleanupOnFailure
```

`validate-pr` automaticky:

1. ověří čistý aktivní platformní repozitář;
2. načte exact `refs/pull/<PR>/head` SHA;
3. vytvoří izolovaný checkout mimo aktivní repo;
4. vytvoří candidate package svázaný se SHA;
5. ověří package obsah, cesty a nepřítomnost secrets;
6. rozbalí package do čistého adresáře;
7. spustí lint, schema, unit, component, integration, smoke, regression a security;
8. vytvoří minimal example workspace z package;
9. provede manifest-driven ingestion syntetických vstupů;
10. ověří steering G1 → G2;
11. volitelně vytvoří izolovaný Miro board a ověří managed artifacts, mapping, sync state a idempotenci;
12. vytvoří JSON a Markdown validation report;
13. při PASS uklidí pracovní prostředky a zachová package s reportem;
14. při FAIL zachová diagnostiku.

Aktivní větev ani aktivní working tree se nemění.

### 2.3 Candidate a release package

Package je jednotka distribuce a reprodukovatelné validace. Obsahuje `ddda-package.json` se source commit SHA, druhem package a verzí.

Package nesmí obsahovat:

```text
.git/
.ddda/
.tmp/
.reports/
.releases/
dist/
cache
credentials
Miro token
client data
uživatelské absolutní cesty
```

### 2.4 Validation report

Report obsahuje:

- PR, branch a exact head SHA;
- package cestu a SHA-256;
- status a délku každé suite;
- diagnostické logy;
- workspace a Miro board ID, pokud byly použity.

Lokální platformní výstupy jsou mimo Git pod DDDA state rootem, na Windows typicky `%LOCALAPPDATA%\DDDA\`.

### 2.5 Promotion

Nejdřív pouze preflight:

```powershell
.\ddda.ps1 promote-pr -Pr 8 -Version 0.8.0 -DryRun
```

Preflight kontroluje otevřený non-draft PR, target branch, exact SHA, CI PASS, PASS validation report, package hash, review policy a povinné governance dokumenty. Merge ani release neprovede.

Skutečný promotion vyžaduje samostatné explicitní potvrzení:

```powershell
.\ddda.ps1 promote-pr -Pr 8 -Version 0.8.0 -ConfirmMerge
```

Po merge vznikne release package, generated release workspace, ingestion, security/smoke/E2E/acceptance report a teprve po PASS release tag. Běžný test nikdy nemerguje ani netaguje.

Detailní postup: `docs/user-guide/validate-and-promote-pr.md`.

'''
          text = text.replace(marker, section + marker, 1)

          # Renumber original sections 2-17 to 3-18, from bottom to top.
          for number in range(17, 1, -1):
              text = text.replace(f'## {number}. ', f'## {number + 1}. ')
              text = text.replace(f'### {number}.', f'### {number + 1}.')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git config user.name 'DDDA Documentation Bot'
          git config user.email 'ddda-docs@example.invalid'
          git add USAGE.md
          git diff --cached --check
          git commit -m 'docs: add platform lifecycle to USAGE'
          git push origin HEAD:feat/project-steering-and-documentation

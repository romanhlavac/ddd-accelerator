name: Dispatch DDDA backlog reconcile
on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/dispatch-ddda-backlog-reconcile.yml
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'reconcile-ddda-project-backlog.yml',
              ref: 'feature/github-native-backlog-governance'
            })

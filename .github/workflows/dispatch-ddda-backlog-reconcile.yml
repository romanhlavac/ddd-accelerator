name: Finalize DDDA backlog governance split
on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/dispatch-ddda-backlog-reconcile.yml
permissions:
  contents: write
jobs:
  reconcile:
    environment: ddda-backlog-governance
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DDDA_GITHUB_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0
      - name: Validate persistent governance credential
        shell: bash
        run: |
          set -euo pipefail
          gh auth status --hostname github.com >/dev/null
          gh project list --owner romanhlavac --limit 100 --format json --jq '.projects[] | select(.title=="DDDA Platform Backlog") | .number' | grep -Eq '^[0-9]+$'
      - name: Compile governance code
        run: |
          python -m py_compile scripts/platform/Reconcile-DDDAProjectBacklog.v5.py
          python -m py_compile scripts/platform/Restructure-DDDAWorkPackages.py
      - name: Materialize and verify target governance state
        run: |
          python scripts/platform/Restructure-DDDAWorkPackages.py
          python scripts/platform/Reconcile-DDDAProjectBacklog.v5.py
      - name: Commit versioned governance without workflow files
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/platform/Reconcile-DDDAProjectBacklog.v5.py scripts/platform/Reconcile-DDDAProjectBacklog.py
          rm -f scripts/platform/Reconcile-DDDAProjectBacklog.v5.py
          rm -f scripts/platform/Restructure-DDDAWorkPackages.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/governance docs/roadmap scripts/platform
          git status --short
          git commit -m 'docs(governance): split platform work-package boundaries (#16)'
          env -u GH_TOKEN git push origin HEAD:feature/github-native-backlog-governance
      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddda-wp-scope-split-final
          path: |
            .reports/wp-scope-split/**
            .reports/cr-backlog-audit-v5/**
          retention-days: 30
          if-no-files-found: warn

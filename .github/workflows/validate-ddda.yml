name: Validate DDDA

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "docs/**"
      - "feat/**"
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19" "jsonschema>=4.22,<5"
      - name: Validate lint, schemas and security contracts
        run: python runtime/platform/validate_repository.py --root . --suite all

  miro-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19" "pytest>=8,<9"
      - name: Run Miro runtime tests
        env:
          PYTHONPATH: runtime/miro
        run: python -m pytest -q runtime/miro/tests

  steering-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "ruamel.yaml>=0.18,<0.19" "jsonschema>=4.22,<5" "pytest>=8,<9"
      - name: Run steering runtime tests
        env:
          PYTHONPATH: runtime/steering
        run: python -m pytest -q runtime/steering/tests

  powershell7-platform-lifecycle:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Doctor and parser validation
        shell: pwsh
        run: ./ddda.ps1 doctor
      - name: Existing component and regression tests
        shell: pwsh
        run: |
          ./tests/powershell/Test-DDDAMiroAutomation.ps1 -PlatformPath $PWD
          ./tests/powershell/Test-DDDAProjectSteering.ps1 -PlatformPath $PWD
          ./tests/powershell/Test-DDDAFirstRun.ps1 -PlatformPath $PWD
      - name: Security and isolation tests
        shell: pwsh
        run: ./tests/powershell/Test-DDDAPlatformSecurity.ps1 -PlatformPath $PWD
      - name: Build and validate candidate package
        id: package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "ddda-ci-candidate.zip"
          $result = ./scripts/platform/New-DDDAPlatformPackage.ps1 -PlatformPath $PWD -Kind candidate -Version "ci.${{ github.run_id }}.${{ github.run_attempt }}" -OutputPath $package -Json | ConvertFrom-Json
          ./scripts/platform/Test-DDDAPlatformPackage.ps1 -PackagePath $package -ExpectedCommit "${{ github.sha }}" -ExpectedKind candidate
          "package=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$($result.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Package-first smoke and E2E lifecycle
        shell: pwsh
        run: |
          ./tests/powershell/Test-DDDAPlatformLifecycle.ps1 -PackagePath "${{ steps.package.outputs.package }}" -ExpectedCommit "${{ github.sha }}"
      - name: Platform test dispatcher
        shell: pwsh
        run: |
          ./ddda.ps1 test -Suite lint
          ./ddda.ps1 test -Suite schema
          ./ddda.ps1 test -Suite security -PackagePath "${{ steps.package.outputs.package }}"

  windows-powershell-51-compatibility:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate retained Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1" }
          ./scripts/Test-DDDAInstallation.ps1 -PlatformPath $PWD
          ./tests/powershell/Test-DDDAMiroAutomation.ps1 -PlatformPath $PWD
          ./tests/powershell/Test-DDDAProjectSteering.ps1 -PlatformPath $PWD
          ./tests/powershell/Test-DDDAPlatformSecurity.ps1 -PlatformPath $PWD
          $workspace = Join-Path $env:RUNNER_TEMP "ddda-smoke-ps51"
          $output = ./scripts/Initialize-DDDAWorkspace.ps1 -WorkspaceRoot $workspace -WorkspaceId "ci-smoke-ps51" -WorkspaceName "CI smoke workspace" 6>&1 | Out-String
          $expected = "p$([char]0x0159)ipraven"
          if ($output -notmatch [regex]::Escape($expected)) { throw "Czech output was not decoded correctly:`n$output" }

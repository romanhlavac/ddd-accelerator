name: Apply issue 14 development payload

on:
  push:
    branches:
      - feat/project-steering-and-documentation
    paths:
      - '.ddda-dev-payload/issue14/**'
      - '.github/workflows/apply-issue14-payload.yml'

permissions:
  contents: write

concurrency:
  group: apply-issue14-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-steering-and-documentation
          fetch-depth: 0

      - name: Reconstruct and validate payload
        shell: bash
        run: |
          set -euo pipefail
          cat .ddda-dev-payload/issue14/part-* | base64 --decode > /tmp/issue14-payload.tar.xz
          echo '765e9a2b9f097c4f3c106160356a0859eed0386a26c17dc9ba16923b4f851847  /tmp/issue14-payload.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/issue14-payload.tar.xz -C .

      - name: Validate reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=runtime/miro:runtime/steering:runtime/platform pytest -q runtime/miro/tests runtime/steering/tests runtime/platform/tests
          find . -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          python runtime/platform/validate_repository.py --root .

      - name: Commit implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ddda-dev-payload/issue14
          rm -f .github/workflows/apply-issue14-payload.yml
          git config user.name 'DDDA Lifecycle Bot'
          git config user.email 'ddda-lifecycle@example.invalid'
          git config core.autocrlf false
          git add -A
          git diff --cached --check
          git commit -m 'feat(miro): implement DDD Starter steering board (#14)'
          git push origin HEAD:feat/project-steering-and-documentation

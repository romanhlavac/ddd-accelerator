name: Audit CR backlog consistency v3

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/audit-cr-project-backlog-v3.yml

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  audit-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0

      - name: Start GitHub CLI browser authorization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          log="$RUNNER_TEMP/gh-auth.log"
          (gh auth login --hostname github.com --git-protocol https --web --scopes project >"$log" 2>&1) &
          echo $! > "$RUNNER_TEMP/gh-auth.pid"
          code=''
          for i in $(seq 1 60); do
            code="$(grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' "$log" 2>/dev/null | head -n1 || true)"
            [ -n "$code" ] && break
            kill -0 "$(cat "$RUNNER_TEMP/gh-auth.pid")" 2>/dev/null || { cat "$log" >&2 || true; exit 1; }
            sleep 1
          done
          test -n "$code"
          printf 'Verification URL: https://github.com/login/device\nDevice code: %s\n' "$code" > "$RUNNER_TEMP/gh-device-auth.txt"

      - name: Upload temporary device challenge
        uses: actions/upload-artifact@v4
        with:
          name: cr-backlog-audit-v3-device-auth
          path: ${{ runner.temp }}/gh-device-auth.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for browser authorization
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          pid="$(cat "$RUNNER_TEMP/gh-auth.pid")"
          for i in $(seq 1 900); do
            if gh auth status --hostname github.com >/dev/null 2>&1; then
              echo USER_AUTHORIZATION_COMPLETE
              exit 0
            fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/gh-auth.log" >&2 || true; exit 1; }
            sleep 1
          done
          exit 1

      - name: Delete temporary device challenge artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="cr-backlog-audit-v3-device-auth") | .id' | while read -r id; do
            [ -z "$id" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done

      - name: Extract and harden v2 audit script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/audit-cr-project-backlog-v2.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          starts=[]; pos=0
          while True:
              p=y.find(marker,pos)
              if p<0: break
              starts.append(p+len(marker)); pos=p+len(marker)
          assert len(starts)>=2
          s=starts[1]
          e=y.find("\n          PY\n",s)
          assert e>0
          lines=y[s:e].splitlines()
          script='\n'.join((ln[10:] if ln.startswith('          ') else ln) for ln in lines)+'\n'
          old="""    if not item:\n        add_item(issue)\n        repairs.append({'issue':n,'action':'ADD_PROJECT_ITEM'})\n        items=issue_item_map(); item=items[n]\n    v=vals(item)\n"""
          new="""    if not item:\n        new_item_id=add_item(issue)\n        repairs.append({'issue':n,'action':'ADD_PROJECT_ITEM'})\n        item={'id':new_item_id,'fieldValues':{'nodes':[]}}\n    v=vals(item)\n"""
          assert old in script
          script=script.replace(old,new,1)
          Path('/tmp/audit-v3.py').write_text(script,encoding='utf-8')
          PY

      - name: Audit, repair and read back
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          python /tmp/audit-v3.py

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr-backlog-consistency-audit-v3
          path: .reports/cr-backlog-audit-v2/**
          retention-days: 30
          if-no-files-found: warn

      - name: Commit deterministic config repairs and remove one-shot workflows
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-cr-project-backlog.yml .github/workflows/audit-cr-project-backlog-v2.yml .github/workflows/audit-cr-project-backlog-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/governance/github-bootstrap.json .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'docs(governance): reconcile CR backlog consistency (#16)'
            git push origin HEAD:feature/github-native-backlog-governance
          fi

      - name: Require clean final audit
        shell: bash
        run: |
          set -euo pipefail
          source .reports/cr-backlog-audit-v2/audit.env
          echo "CR_COUNT=$CR_COUNT REPAIR_COUNT=$REPAIR_COUNT REMAINING_COUNT=$REMAINING_COUNT CONFIG_CHANGED=$CONFIG_CHANGED"
          test "$REMAINING_COUNT" = '0'

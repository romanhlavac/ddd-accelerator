name: Align CHR53 into WP-08 backlog

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/align-chr53-wp08.yml

permissions:
  contents: write
  issues: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0

      - name: Prepare versioned governance alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          p = root / 'config/governance/github-bootstrap.json'
          data = json.loads(p.read_text(encoding='utf-8-sig'))
          for rel in data['hierarchy']:
              if int(rel['parent']) == 17:
                  children = [int(x) for x in rel['children']]
                  if 53 not in children:
                      children.append(53)
                  rel['children'] = children
                  break
          else:
              data['hierarchy'].append({'parent': 17, 'children': [53]})

          covered = {int(n) for g in data['item_groups'] if g.get('kind') == 'issue' for n in g.get('numbers', [])}
          if 53 not in covered:
              data['item_groups'].append({
                  'kind': 'issue',
                  'numbers': [53],
                  'metadata': {
                      'Status': 'In progress',
                      'Work Package': 'WP-08',
                      'Item Type': 'Change Request',
                      'Target Release': 'TBD',
                      'Blocked': 'Yes',
                      'Human Review': 'Not required',
                      'Outcome summary': 'Persistent DDDA Platform Lab with explicit board taxonomy, reference/adoption lifecycle, managed namespaces and governed cleanup.'
                  }
              })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = root / 'config/governance/backlog-policy.yaml'
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace('children: [9, 10, 11, 12, 13, 14, 15, 45]', 'children: [9, 10, 11, 12, 13, 14, 15, 45, 53]')
          text = text.replace('future_children: [45]', 'future_children: [45, 53]')
          p.write_text(text, encoding='utf-8')

          p = root / 'docs/roadmap/work-packages/WP-08-platform-lifecycle-and-steering.md'
          text = p.read_text(encoding='utf-8-sig')
          if '- persistent DDDA Platform Lab / board taxonomy / reference-adoption lifecycle — #53.' not in text:
              text = text.replace(
                  '- GitHub Pages Artifact Registry dashboard — #45.',
                  '- GitHub Pages Artifact Registry dashboard — #45.\n- persistent DDDA Platform Lab / board taxonomy / reference-adoption lifecycle — #53.'
              )
          if '- #53 — persistent Platform Lab, board taxonomy and reference/adoption lifecycle;' not in text:
              text = text.replace(
                  '- #45 — GitHub Pages Artifact Registry dashboard; `Target Release: TBD` and explicitly outside Milestone `DDDA 0.1.0`.',
                  '- #45 — GitHub Pages Artifact Registry dashboard; `Target Release: TBD` and explicitly outside Milestone `DDDA 0.1.0`.\n- #53 — persistent Platform Lab, board taxonomy and reference/adoption lifecycle; `Target Release: TBD`, partial docs slice in Draft PR #58, explicitly outside Milestone `DDDA 0.1.0`.'
              )
          text = text.replace('- [ ] #45 does not enter release 0.1.0 implicitly.', '- [ ] #45 and #53 do not enter release 0.1.0 implicitly.')
          text = text.replace('- future #45 remains independently planned.', '- future #45/#53 remain independently planned.')
          p.write_text(text, encoding='utf-8')

          data2 = json.loads((root / 'config/governance/github-bootstrap.json').read_text(encoding='utf-8'))
          assert 53 in next(x['children'] for x in data2['hierarchy'] if int(x['parent']) == 17)
          g53 = next(g for g in data2['item_groups'] if g.get('kind') == 'issue' and 53 in [int(x) for x in g.get('numbers', [])])
          assert g53['metadata']['Status'] == 'In progress'
          assert g53['metadata']['Work Package'] == 'WP-08'
          assert g53['metadata']['Item Type'] == 'Change Request'
          assert g53['metadata']['Target Release'] == 'TBD'
          assert g53['metadata']['Blocked'] == 'Yes'
          assert g53['metadata']['Human Review'] == 'Not required'
          policy = (root / 'config/governance/backlog-policy.yaml').read_text(encoding='utf-8')
          assert 'children: [9, 10, 11, 12, 13, 14, 15, 45, 53]' in policy
          assert 'future_children: [45, 53]' in policy
          PY

      - name: Verify native WP-08 hierarchy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: romanhlavac/ddd-accelerator
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/issues/53" --jq '.parent_issue_url')" = "https://api.github.com/repos/$GH_REPO/issues/17"

      - name: Authorize GitHub Project access in browser
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          echo 'USER_ACTION_REQUIRED: authorize GitHub CLI device flow shown below.'
          gh auth login --hostname github.com --git-protocol https --web --scopes project
          gh auth status --hostname github.com >/dev/null
          echo 'USER_AUTHORIZATION_COMPLETE'

      - name: Add CHR53 to DDDA Platform Backlog and set metadata
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          OWNER='romanhlavac'
          REPO='romanhlavac/ddd-accelerator'
          ISSUE_URL='https://github.com/romanhlavac/ddd-accelerator/issues/53'
          PROJECT_TITLE='DDDA Platform Backlog'

          project_json="$(gh project list --owner "$OWNER" --limit 100 --format json)"
          project_number="$(jq -r --arg t "$PROJECT_TITLE" '.projects[] | select(.title==$t and (.closed|not)) | .number' <<<"$project_json" | head -n1)"
          project_id="$(jq -r --arg t "$PROJECT_TITLE" '.projects[] | select(.title==$t and (.closed|not)) | .id' <<<"$project_json" | head -n1)"
          test -n "$project_number" && test "$project_number" != 'null'
          test -n "$project_id" && test "$project_id" != 'null'
          echo "Resolved project: $PROJECT_TITLE (#$project_number)"

          issue_node_id="$(gh api "repos/$REPO/issues/53" --jq '.node_id')"

          snapshot_query='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id number title fields(first:100){nodes{__typename ... on ProjectV2FieldCommon{id name dataType} ... on ProjectV2SingleSelectField{options{id name}}}} items(first:100){nodes{id content{__typename ... on Issue{number url state}}}}}}}'
          snapshot="$(gh api graphql -f query="$snapshot_query" -F login="$OWNER" -F number="$project_number")"
          item_id="$(jq -r '.data.user.projectV2.items.nodes[] | select(.content.number==53) | .id' <<<"$snapshot" | head -n1)"

          if [ -z "$item_id" ] || [ "$item_id" = 'null' ]; then
            add_mutation='mutation($projectId:ID!,$contentId:ID!){addProjectV2ItemById(input:{projectId:$projectId,contentId:$contentId}){item{id}}}'
            item_id="$(gh api graphql -f query="$add_mutation" -f projectId="$project_id" -f contentId="$issue_node_id" --jq '.data.addProjectV2ItemById.item.id')"
          fi
          test -n "$item_id" && test "$item_id" != 'null'

          snapshot="$(gh api graphql -f query="$snapshot_query" -F login="$OWNER" -F number="$project_number")"

          set_select() {
            local field_name="$1" option_name="$2"
            local field_id option_id
            field_id="$(jq -r --arg n "$field_name" '.data.user.projectV2.fields.nodes[] | select(.name==$n) | .id' <<<"$snapshot" | head -n1)"
            option_id="$(jq -r --arg n "$field_name" --arg o "$option_name" '.data.user.projectV2.fields.nodes[] | select(.name==$n) | .options[] | select(.name==$o) | .id' <<<"$snapshot" | head -n1)"
            test -n "$field_id" && test "$field_id" != 'null'
            test -n "$option_id" && test "$option_id" != 'null'
            mutation='mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{singleSelectOptionId:$optionId}}){projectV2Item{id}}}'
            gh api graphql -f query="$mutation" -f projectId="$project_id" -f itemId="$item_id" -f fieldId="$field_id" -f optionId="$option_id" >/dev/null
          }

          set_text() {
            local field_name="$1" value="$2"
            local field_id
            field_id="$(jq -r --arg n "$field_name" '.data.user.projectV2.fields.nodes[] | select(.name==$n) | .id' <<<"$snapshot" | head -n1)"
            test -n "$field_id" && test "$field_id" != 'null'
            mutation='mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$text:String!){updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{text:$text}}){projectV2Item{id}}}'
            gh api graphql -f query="$mutation" -f projectId="$project_id" -f itemId="$item_id" -f fieldId="$field_id" -f text="$value" >/dev/null
          }

          set_select 'Status' 'In progress'
          set_select 'Work Package' 'WP-08'
          set_select 'Item Type' 'Change Request'
          set_select 'Blocked' 'Yes'
          set_select 'Human Review' 'Not required'
          set_text 'Target Release' 'TBD'
          set_text 'Outcome summary' 'Persistent DDDA Platform Lab with explicit board taxonomy, reference/adoption lifecycle, managed namespaces and governed cleanup.'

          echo "PROJECT_NUMBER=$project_number" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "PROJECT_ITEM_ID=$item_id" >> "$GITHUB_ENV"

      - name: Read back Project membership and metadata
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          OWNER='romanhlavac'

          query='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){title items(first:100){nodes{id content{... on Issue{number url}} fieldValues(first:50){nodes{__typename ... on ProjectV2ItemFieldSingleSelectValue{name field{... on ProjectV2FieldCommon{name}}} ... on ProjectV2ItemFieldTextValue{text field{... on ProjectV2FieldCommon{name}}}}}}}}}}'
          result="$(gh api graphql -f query="$query" -F login="$OWNER" -F number="$PROJECT_NUMBER")"
          item="$(jq -c '.data.user.projectV2.items.nodes[] | select(.content.number==53)' <<<"$result")"
          test -n "$item"

          field_value() {
            local field="$1"
            jq -r --arg f "$field" '[.fieldValues.nodes[] | select(.field.name==$f) | (.name // .text)] | first // ""' <<<"$item"
          }

          test "$(field_value 'Status')" = 'In progress'
          test "$(field_value 'Work Package')" = 'WP-08'
          test "$(field_value 'Item Type')" = 'Change Request'
          test "$(field_value 'Blocked')" = 'Yes'
          test "$(field_value 'Human Review')" = 'Not required'
          test "$(field_value 'Target Release')" = 'TBD'
          echo 'PROJECT_READBACK_PASS'
          jq -c '{issue:.content.number,url:.content.url,fields:[.fieldValues.nodes[] | select(.field.name=="Status" or .field.name=="Work Package" or .field.name=="Item Type" or .field.name=="Blocked" or .field.name=="Human Review" or .field.name=="Target Release") | {field:.field.name,value:(.name // .text)}]}' <<<"$item"

      - name: Commit versioned alignment and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/align-chr53-wp08.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/governance docs/roadmap .github/workflows
          git commit -m 'docs(governance): align CHR53 with WP-08 backlog (#16)'
          git push origin HEAD:feature/github-native-backlog-governance

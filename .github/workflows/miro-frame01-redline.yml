name: DDDA REM-012.5 Miro Tips reference-composite verification

# This workflow deliberately has no pull_request or push trigger. A PR update
# must never mutate DDDA_PLATFORM_LAB or DDDA_HVR. Target mutation is a later,
# separately authorized remediation run after exact-SHA CI and human review.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe operation only; this workflow has no Miro write path.
        required: true
        type: choice
        default: verify_reference_composite
        options:
          - verify_reference_composite

permissions:
  contents: read

concurrency:
  group: ddda-miro-tips-reference-contract-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-reference-composite:
    name: Verify frozen Miro Tips source and composite contract
    if: inputs.operation == 'verify_reference_composite'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact source state and no-write workflow guard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:SOURCE_SHA){throw "checkout SHA '$actual' differs from '$env:SOURCE_SHA'"}
          @'
          import hashlib
          from pathlib import Path
          from ruamel.yaml import YAML

          root=Path('.')
          workflow=(root/'.github/workflows/miro-frame01-redline.yml').read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in workflow
          forbidden=(
              'pull'+'_'+'request:',
              'push'+':',
              'MIRO_'+'PLATFORM_LAB_ACCESS_TOKEN',
              'MIRO_'+'HVR_ACCESS_TOKEN',
              '-'+'-apply',
          )
          assert not [value for value in forbidden if value in workflow]

          manifest=YAML(typ='safe').load((root/'scaffolds/miro/rem-012-5-frame-01.yaml').read_text(encoding='utf-8'))
          tips=manifest['miro_tips']
          assert tips['mode']=='reference_composite_image'
          assert tips['visual_equivalence_policy']=='bit_exact_composite_asset'
          assert tips['reference_source_board_id']=='uXjVH2vcvRI='
          assert str(tips['reference_source_frame_id'])=='3458764679531043366'
          assert str(tips['reference_source_image_id'])=='3458764679531043367'
          assert tips['reference_background_sha256']=='04b83ec7d9bc07ae31c7c11c03ec974ff4bde00d7773d7f9e55036e877f6fffd'
          assert tips['source_native_item_count']==17
          assert tips['source_native_item_type_counts']=={'image':1,'sticky_note':13,'text':3}
          assert tips['source_native_connector_count']==8
          assert tips['target_item_count']==1
          assert tips['target_item_type_counts']=={'image':1}
          assert tips['target_connector_count']==0
          assert 'expected_item_count' not in tips
          assert 'expected_connector_count' not in tips

          asset=root/'runtime/miro/ddda_miro/assets/miro-tips-reference-composite.png'
          raw=asset.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==tips['composite_asset_sha256']
          assert raw[:8]==b'\x89PNG\r\n\x1a\n'
          assert int.from_bytes(raw[16:20],'big')==tips['composite_asset_dimensions']['width']
          assert int.from_bytes(raw[20:24],'big')==tips['composite_asset_dimensions']['height']
          '@ | python -

      - name: Run Miro Tips regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH=Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_5_miro_tips_hvr.py runtime/miro/tests/test_rem_012_5_connector_readback.py runtime/platform/tests/test_miro_execution_profiles.py -q
          if($LASTEXITCODE -ne 0){throw 'Miro Tips regression tests failed'}

      - name: Publish no-write verification evidence
        shell: pwsh
        run: |
          [ordered]@{
            source_sha=$env:SOURCE_SHA
            delivery_mode='reference_composite_image'
            platform_lab_write_authorized=$false
            hvr_write_authorized=$false
            technical_status='PASS_IF_ALL_PREVIOUS_STEPS_PASSED'
            human_review_status='PENDING'
            overall_status='PENDING_HUMAN_REVIEW'
          } | ConvertTo-Json | Set-Content -LiteralPath 'miro-tips-reference-composite-verification.json' -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: miro-tips-reference-composite-${{ env.SOURCE_SHA }}
          path: miro-tips-reference-composite-verification.json
          if-no-files-found: error
          retention-days: 30

name: DDDA REM-012.5 frame 01 redline

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-miro-platform-lab-${{ github.repository }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Exact-code REM-012.5 Frame 01 redline replacement
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ed14f57363c359e60633f9f1da9ad69dee8b5bda
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DDDA_MIRO_PRIVATE_DEV_TEAM_ID: ${{ vars.DDDA_MIRO_PRIVATE_DEV_TEAM_ID || '3458764678971681560' }}
      DDDA_MIRO_PLATFORM_LAB_BOARD_ID: ${{ vars.DDDA_MIRO_PLATFORM_LAB_BOARD_ID || 'uXjVH0doLYY=' }}
      DDDA_MIRO_HVR_BOARD_NAME: DDDA_HVR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize evidence
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rem-012-5-frame01-replacement'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "EVIDENCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{
            source_sha=$env:SOURCE_SHA
            platform_lab_board_id=$env:DDDA_MIRO_PLATFORM_LAB_BOARD_ID
            execution_profile='platform_lab'
            hvr_profile='hvr'
            technical_status='PENDING'
            stage='initialized'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'preflight.json') -Encoding UTF8

      - name: Verify exact corrective lineage and scope
        shell: pwsh
        run: |
          @'
          import os, subprocess
          from pathlib import Path

          def g(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          source=os.environ['SOURCE_SHA']
          subprocess.check_call(['git','merge-base','--is-ancestor',os.environ['BASE_SHA'],source])
          observed=sorted(x for x in g('diff-tree','--no-commit-id','--name-only','-r',source).splitlines() if x)
          allowed={
              '.github/workflows/miro-frame01-redline.yml',
              'runtime/miro/ddda_miro/miro_tips_native_onboarding.py',
              'runtime/miro/tests/test_rem_012_5_miro_tips_native_onboarding.py',
          }
          assert observed, 'corrective commit must change at least one allowlisted path'
          unexpected=sorted(set(observed)-allowed)
          assert not unexpected, f'corrective path mismatch: {unexpected}'

          profile=Path('config/platform/miro-execution-profiles.yaml').read_text(encoding='utf-8')
          for marker in (
              'deterministic_transport: rest-api',
              'mcp_required_for_technical_gate: false',
              'MIRO_PLATFORM_LAB_ACCESS_TOKEN',
              'MIRO_GH_CI_ACCESS_TOKEN',
              'MIRO_HVR_ACCESS_TOKEN',
              'board_name: DDDA_PLATFORM_LAB',
              'board_name: DDDA_GH_CI',
              'board_name: DDDA_HVR',
              'activation_phase: platform-deployment-and-initialization',
              'activation_phase: per-project-deployment-and-initialization',
          ):
              assert marker in profile, f'execution-profile marker missing: {marker}'
          for forbidden in ('MIRO_CI_ACCESS_TOKEN','legacy_access_token_secret','fallback_access_token_secrets'):
              assert forbidden not in profile, f'forbidden fallback/profile marker remains: {forbidden}'

          manifest=Path('scaffolds/miro/rem-012-5-frame-01.yaml').read_text(encoding='utf-8')
          for marker in (
              'mode: ddda_owned_native_onboarding',
              'policy: native_ddda_owned_no_screenshot_no_callouts',
              'container_policy: retained_frame_native_rebuild',
              'minimum_body_font_size: 36',
              'minimum_heading_font_size: 64',
              'minimum_sections: 6',
              'NAVIGUJ PO PLÁTNĚ A RÁMCÍCH',
              'Vlastnictví a legenda DDDA',
          ):
              assert marker in manifest, f'native onboarding marker missing: {marker}'
          for forbidden in ('endpoint_position_policy:', 'direct_reference_image_endpoint'):
              assert forbidden not in manifest, f'retired direct-image endpoint marker remains: {forbidden}'

          note=Path('docs/reviews/PR8-HVR-miro-execution-profile-migration.md').read_text(encoding='utf-8')
          for marker in (
              'SUPERSEDED_BY_THREE_PROFILE_BINDING',
              'HVR-3: BLOCKED_BY_HVR-2',
              'second Platform Lab reconcile má zero create/update/delete mutation',
              'MCP availability ani MCP quota není součástí technical PASS',
              'dedikovaným `DDDA_HVR` targetem',
          ):
              assert marker in note, f'HVR migration marker missing: {marker}'
          '@ | python -

      - name: Run targeted REM-012.5 tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH=Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_5_frame_01.py runtime/miro/tests/test_rem_012_5_frame00_position_payload.py runtime/miro/tests/test_rem_012_5_connector_readback.py runtime/miro/tests/test_rem_012_5_miro_tips_control_anchors.py runtime/miro/tests/test_rem_012_5_miro_tips_hvr.py runtime/miro/tests/test_rem_012_5_miro_tips_native_onboarding.py runtime/miro/tests/test_rem_012_5_miro_tips_semantic.py runtime/platform/tests/test_miro_execution_profiles.py -q
          if($LASTEXITCODE -ne 0){throw 'targeted tests failed'}

      - name: Wait for authoritative exact-SHA evidence and candidate
        id: ci
        shell: pwsh
        run: |
          @'
          import json,os,time,urllib.request
          repo,sha,t=os.environ['GITHUB_REPOSITORY'],os.environ['SOURCE_SHA'],os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {t}','Accept':'application/vnd.github+json'}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=h)))
          def latest(xs,n):
              rows=[x for x in xs if x['name']==n]
              return max(rows,key=lambda x:x['run_number']) if rows else None
          for _ in range(360):
              runs=get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs']
              validate=latest(runs,'Validate DDDA')
              probe=latest(runs,'DDDA exact-code Miro image probe')
              platform=latest(runs,'DDDA platform CI')
              for run,name in ((validate,'Validate DDDA'),(probe,'Miro image probe')):
                  if run and run['status']=='completed' and run.get('conclusion')!='success':
                      raise SystemExit(f'{name} failed')
              if platform:
                  jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{platform["id"]}/jobs?per_page=100')['jobs']
                  names=('Platform validation','One-command PR validation','Miro profile bindings','Online Miro acceptance')
                  required=[next((j for j in jobs if j['name']==n),None) for n in names]
                  if any(j and j['status']=='completed' and j.get('conclusion')!='success' for j in required):
                      failed=[j['name'] for j in required if j and j['status']=='completed' and j.get('conclusion')!='success']
                      raise SystemExit('platform validation failed: '+','.join(failed))
                  artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{platform["id"]}/artifacts?per_page=100')['artifacts']
                  candidate=any(a['name']==f'ddda-candidate-{sha}' and not a['expired'] for a in artifacts)
                  ready=all(x and x['status']=='completed' and x.get('conclusion')=='success' for x in (validate,probe,*required))
                  if ready and candidate:
                      with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                          out.write(f'platform_run_id={platform["id"]}\n')
                      break
              time.sleep(15)
          else:
              raise SystemExit('exact-SHA evidence/candidate timeout')
          '@ | python -

      - name: Verify Platform Lab and HVR REST credentials
        shell: pwsh
        env:
          MIRO_PLATFORM_LAB_ACCESS_TOKEN: ${{ secrets.MIRO_PLATFORM_LAB_ACCESS_TOKEN }}
          MIRO_HVR_ACCESS_TOKEN: ${{ secrets.MIRO_HVR_ACCESS_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:MIRO_PLATFORM_LAB_ACCESS_TOKEN)){throw 'MIRO_PLATFORM_LAB_ACCESS_TOKEN is required; fallback is forbidden'}
          if([string]::IsNullOrWhiteSpace($env:MIRO_HVR_ACCESS_TOKEN)){throw 'MIRO_HVR_ACCESS_TOKEN is required; fallback is forbidden'}
          if([string]::IsNullOrWhiteSpace($env:DDDA_MIRO_PLATFORM_LAB_BOARD_ID)){throw 'DDDA_MIRO_PLATFORM_LAB_BOARD_ID is required'}
          $manifest=Get-Content 'scaffolds/miro/rem-012-5-frame-01.yaml' -Raw -Encoding UTF8
          if($manifest -notmatch ('(?m)^board_id:\s*' + [regex]::Escape($env:DDDA_MIRO_PLATFORM_LAB_BOARD_ID) + '\s*$')){
            throw "Configured Platform Lab board '$env:DDDA_MIRO_PLATFORM_LAB_BOARD_ID' does not match the board-specific PR8 frame contract."
          }

      - name: Download exact-SHA candidate package
        uses: actions/download-artifact@v4
        with:
          name: ddda-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.platform_run_id }}

      - name: Reconcile Frame 01 on DDDA_PLATFORM_LAB
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_PLATFORM_LAB_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $candidate=@(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'candidate') -Filter '*.zip' -File -Recurse)
          if($candidate.Count -ne 1){throw 'candidate count mismatch'}
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $candidate[0].FullName -ExpectedCommit $env:SOURCE_SHA -ExpectedKind candidate
          $root=Join-Path $env:RUNNER_TEMP 'rem-012-5-frame01-package'
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          Expand-Archive $candidate[0].FullName $root -Force
          $runtime=Join-Path $root 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH=$runtime
          $manifest=Join-Path $root 'scaffolds\miro\rem-012-5-frame-01.yaml'
          $report=Join-Path $env:EVIDENCE_ROOT 'result.json'
          python -m ddda_miro.connector_readback_wirefix --manifest $manifest --report $report --source-sha $env:SOURCE_SHA --apply
          if($LASTEXITCODE -ne 0){Get-Content $report -ErrorAction SilentlyContinue; throw 'REM-012.5 reconcile failed'}

          $r=Get-Content $report -Raw | ConvertFrom-Json
          if($r.board_id -ne $env:DDDA_MIRO_PLATFORM_LAB_BOARD_ID){throw 'resolved remediation target is not DDDA_PLATFORM_LAB'}
          if($r.technical_status -ne 'PASS' -or $r.human_review_status -ne 'PENDING' -or $r.overall_status -ne 'READY_FOR_HUMAN_REVIEW'){throw 'acceptance state mismatch'}
          if(-not $r.protected_frames.unchanged -or $r.protected_frames.count -ne 16){throw 'protected frames changed'}
          if($r.frame01_recovery.second_run.items.created -ne 0 -or $r.frame01_recovery.second_run.items.updated -ne 0 -or $r.frame01_recovery.second_run.items.deleted -ne 0){throw 'Frame01 second reconcile mutated items'}
          if($r.frame01_recovery.second_run.connectors.created -ne 0 -or $r.frame01_recovery.second_run.connectors.updated -ne 0 -or $r.frame01_recovery.second_run.connectors.deleted -ne 0){throw 'Frame01 second reconcile mutated connectors'}
          if($r.companion_frames.second_run.frames.created -ne 0 -or $r.companion_frames.second_run.frames.updated -ne 0 -or $r.companion_frames.second_run.frames.unchanged -ne 9){throw 'companion frame second reconcile mismatch'}

          $tips1=@($r.companion_frames.first_run.details | Where-Object {$_.title -eq 'Miro Tips'})
          $tips2=@($r.companion_frames.second_run.details | Where-Object {$_.title -eq 'Miro Tips'})
          if($tips1.Count -ne 1 -or $tips2.Count -ne 1){throw 'Miro Tips evidence missing'}
          foreach($tips in @($tips1[0],$tips2[0])){
            if($tips.mode -ne 'ddda_owned_native_onboarding' -or $tips.onboarding_policy -ne 'native_ddda_owned_no_screenshot_no_callouts'){throw 'Miro Tips native onboarding policy mismatch'}
            if([int]$tips.section_count -ne 6){throw 'Miro Tips native onboarding section count mismatch'}
            if([double]$tips.minimum_body_font_size -lt 36 -or [double]$tips.minimum_heading_font_size -lt 64){throw 'Miro Tips readable typography contract mismatch'}
            if([int]$tips.target_image_count -ne 0 -or [int]$tips.target_connector_count -ne 0){throw 'Miro Tips must not retain screenshot or callout topology'}
            foreach($section in @('NAVIGUJ PO PLÁTNĚ A RÁMCÍCH','TVORBA A ÚPRAVA LÍSTKŮ','VÝBĚR, ZPĚT A DUPLIKACE','PROPOJUJ VÝZNAMY','SPOLUPRÁCE A FACILITACE','Vlastnictví a legenda DDDA')){
              if(@($tips.required_sections) -notcontains $section){throw "Miro Tips missing required onboarding section: $section"}
            }
            if($tips.replacement_frame_id -ne '3458764680476608045'){throw 'Miro Tips active container identity mismatch'}
          }
          if([int]$tips2[0].children_rebuilt -ne 0){throw 'Miro Tips second run rebuilt stable children'}
          if($tips2[0].items.created -ne 0 -or $tips2[0].items.updated -ne 0 -or $tips2[0].items.deleted -ne 0){throw 'Miro Tips second run mutated items'}
          if($tips2[0].connectors.created -ne 0 -or $tips2[0].connectors.updated -ne 0 -or $tips2[0].connectors.deleted -ne 0){throw 'Miro Tips second run mutated connectors'}
          if($r.merge_allowed -or $r.promotion_allowed -or $r.release_allowed -or $r.gate_approval_allowed){throw 'governance boundary violated'}

      - name: Materialize dedicated DDDA_HVR board
        shell: pwsh
        env:
          MIRO_HVR_ACCESS_TOKEN: ${{ secrets.MIRO_HVR_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          from collections import Counter
          from pathlib import Path

          API='https://api.miro.com'
          token=os.environ['MIRO_HVR_ACCESS_TOKEN']
          team=os.environ['DDDA_MIRO_PRIVATE_DEV_TEAM_ID']
          source=os.environ['DDDA_MIRO_PLATFORM_LAB_BOARD_ID']
          target_name=os.environ['DDDA_MIRO_HVR_BOARD_NAME']
          evidence_root=Path(os.environ['EVIDENCE_ROOT'])

          def request(method,path,payload=None,allow404=False):
              for attempt in range(5):
                  data=None if payload is None else json.dumps(payload).encode('utf-8')
                  req=urllib.request.Request(API+path,data=data,method=method)
                  req.add_header('Authorization','Bearer '+token)
                  req.add_header('Accept','application/json')
                  if data is not None:
                      req.add_header('Content-Type','application/json')
                  try:
                      with urllib.request.urlopen(req,timeout=60) as response:
                          raw=response.read()
                          return None if not raw else json.loads(raw.decode('utf-8'))
                  except urllib.error.HTTPError as exc:
                      if allow404 and exc.code==404:
                          return None
                      # Retry reads only: a failed write can be ambiguous, while a
                      # GET retry cannot duplicate a board or mutate review state.
                      if method!='GET' or exc.code not in (429,500,502,503,504) or attempt==4:
                          raise
                      time.sleep(2*(attempt+1))

          def list_boards():
              rows=[]
              offset=0
              while True:
                  q=urllib.parse.urlencode({'team_id':team,'limit':'50','offset':str(offset),'sort':'alphabetically'})
                  page=request('GET','/v2/boards?'+q)
                  batch=page.get('data',[])
                  rows.extend(batch)
                  if len(batch)<50:
                      return rows
                  offset+=len(batch)

          def list_items(board_id, item_type=None):
              rows=[]
              cursor=None
              while True:
                  params={'limit':'50'}
                  if cursor:
                      params['cursor']=cursor
                  if item_type:
                      params['type']=item_type
                  path='/v2/boards/'+urllib.parse.quote(board_id,safe='')+'/items?'+urllib.parse.urlencode(params)
                  page=request('GET',path)
                  rows.extend(page.get('data',[]))
                  cursor=page.get('cursor')
                  if not cursor:
                      return rows

          def list_connectors(board_id):
              rows=[]
              cursor=None
              while True:
                  params={'limit':'50'}
                  if cursor:
                      params['cursor']=cursor
                  page=request('GET','/v2/boards/'+urllib.parse.quote(board_id,safe='')+'/connectors?'+urllib.parse.urlencode(params))
                  rows.extend(page.get('data',[]))
                  cursor=page.get('cursor')
                  if not cursor:
                      return rows

          source_meta=request('GET','/v2/boards/'+urllib.parse.quote(source,safe=''))
          if source_meta.get('name')!='DDDA_PLATFORM_LAB':
              raise SystemExit('Refusing HVR materialization: source is not DDDA_PLATFORM_LAB')
          source_items=list_items(source)
          if not source_items:
              raise SystemExit('Refusing HVR materialization: Platform Lab is empty')
          source_frames=list_items(source,'frame')

          old=[b for b in list_boards() if b.get('name')==target_name]
          old_ids=[str(b.get('id') or '') for b in old if b.get('id')]
          if source in old_ids:
              raise SystemExit('Refusing HVR materialization: an HVR logical slot resolves to Platform Lab')

          for old_id in old_ids:
              request('DELETE','/v2/boards/'+urllib.parse.quote(old_id,safe=''),allow404=True)

          remaining=[]
          for _ in range(30):
              remaining=[b for b in list_boards() if b.get('name')==target_name]
              if not remaining:
                  break
              time.sleep(1)
          if remaining:
              raise SystemExit(f'HVR logical-slot cleanup incomplete: {len(remaining)} exact-name boards remain')

          copied=request(
              'PUT',
              '/v2/boards?'+urllib.parse.urlencode({'copy_from':source}),
              {'name':target_name,'description':'DDDA PR8 Human Visual Review target generated from exact-SHA validated Platform Lab.','teamId':team},
          )
          target=str(copied.get('id') or '')
          if not target or target==source:
              raise SystemExit('Miro copy did not return a new HVR board id')

          target_meta=request('GET','/v2/boards/'+urllib.parse.quote(target,safe=''))
          if target_meta.get('name')!=target_name:
              raise SystemExit('Copied HVR board has unexpected name')

          final_slots=[]
          for _ in range(30):
              final_slots=[b for b in list_boards() if b.get('name')==target_name]
              if len(final_slots)==1 and str(final_slots[0].get('id') or '')==target:
                  break
              time.sleep(1)
          if len(final_slots)!=1 or str(final_slots[0].get('id') or '')!=target:
              raise SystemExit(f'HVR logical-slot normalization failed: expected exactly copied board {target}, found {len(final_slots)} slots')

          target_items=[]
          for _ in range(30):
              target_items=list_items(target)
              if len(target_items)==len(source_items):
                  break
              time.sleep(2)
          if len(target_items)!=len(source_items):
              raise SystemExit(f'HVR copy item-count mismatch: source={len(source_items)} target={len(target_items)}')

          target_frames=list_items(target,'frame')
          def title(item):
              data=item.get('data') if isinstance(item.get('data'),dict) else {}
              return str(data.get('title') or '')
          if Counter(title(x) for x in source_frames)!=Counter(title(x) for x in target_frames):
              raise SystemExit('HVR copy frame-title multiset mismatch')

          source_ids={str(x.get('id')):x for x in source_frames}
          required_source_ids={
              'frame01':'3458764680260503129',
              'miro_tips':'3458764680476608045',
          }
          review_frames={}
          for label,item_id in required_source_ids.items():
              item=source_ids.get(item_id)
              if item is None:
                  raise SystemExit(f'Source review frame missing: {label}/{item_id}')
              wanted=title(item)
              matches=[x for x in target_frames if title(x)==wanted]
              if len(matches)!=1:
                  raise SystemExit(f'HVR target frame title is not unique: {wanted!r}')
              copied_id=str(matches[0].get('id'))
              review_frames[label]={
                  'title':wanted,
                  'source_item_id':item_id,
                  'target_item_id':copied_id,
                  'target_url':f'https://miro.com/app/board/{target}/?moveToWidget={copied_id}',
              }

          # A copied board is only eligible for HVR when it retains the
          # DDDA-owned readable onboarding and no screenshot/callout topology.
          tips_frame_id=review_frames['miro_tips']['target_item_id']
          tips_children=[x for x in target_items if str((x.get('parent') or {}).get('id') or '')==tips_frame_id]
          def visible(item):
              data=item.get('data') if isinstance(item.get('data'),dict) else {}
              return str(data.get('content') or '')
          shapes=[x for x in tips_children if x.get('type')=='shape']
          images=[x for x in tips_children if x.get('type')=='image']
          connectors=list_connectors(target)
          tip_ids={str(x.get('id') or '') for x in tips_children}
          callouts=[x for x in connectors if str((x.get('startItem') or {}).get('id') or '') in tip_ids or str((x.get('endItem') or {}).get('id') or '') in tip_ids]
          required_sections=(
              'NAVIGUJ PO PLÁTNĚ A RÁMCÍCH','TVORBA A ÚPRAVA LÍSTKŮ',
              'VÝBĚR, ZPĚT A DUPLIKACE','PROPOJUJ VÝZNAMY',
              'SPOLUPRÁCE A FACILITACE','Vlastnictví a legenda DDDA',
          )
          copied_text=' '.join(visible(x) for x in shapes)
          if len(shapes)!=7 or images or callouts or not all(marker in copied_text for marker in required_sections):
              raise SystemExit('HVR copy Miro Tips native-onboarding topology mismatch')
          hvr_tips_readback={
              'frame_id':tips_frame_id,
              'native_shape_count':len(shapes),
              'screenshot_count':len(images),
              'connector_count':len(callouts),
              'required_section_count':len(required_sections),
              'status':'PASS',
          }

          materialization={
              'schema_version':1,
              'source_sha':os.environ['SOURCE_SHA'],
              'source_profile':'platform_lab',
              'source_board_id':source,
              'source_item_count':len(source_items),
              'target_profile':'hvr',
              'replaced_hvr_board_ids':old_ids,
              'normalized_previous_slot_count':len(old_ids),
              'target_board_id':target,
              'target_board_name':target_name,
              'target_board_url':f'https://miro.com/app/board/{target}/',
              'target_item_count':len(target_items),
              'final_logical_slot_count':len(final_slots),
              'review_frames':review_frames,
              'miro_tips_native_onboarding_copy_readback':hvr_tips_readback,
              'copy_readback_status':'PASS',
              'technical_status':'PASS',
              'human_review_status':'PENDING',
              'overall_status':'READY_FOR_HUMAN_REVIEW',
          }
          (evidence_root/'hvr-materialization.json').write_text(json.dumps(materialization,indent=2),encoding='utf-8')

          result_path=evidence_root/'result.json'
          if result_path.exists():
              result=json.loads(result_path.read_text(encoding='utf-8-sig'))
              result['human_review_target']=materialization
              result['human_review_status']='PENDING'
              result['overall_status']='READY_FOR_HUMAN_REVIEW'

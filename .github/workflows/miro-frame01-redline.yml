name: DDDA REM-012.5 frame 01 redline

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-5-frame-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Exact-code REM-012.5 Frame 01 redline replacement
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      RECOVERY_PARENT_SHA: 7945bed7666ca040cad2a154561088e0685ee1c1
      VISUAL_SHA: ce1cf2a9a8b8ea9bfe8e7dcdd2b05d8302170d8f
      PREVIOUS_SHA: 5edbd87b999a81ee234ad617999d31c518144231
      CORRECTIVE_SHA: d1a75aa49f60e72d6377274d8e52ee7fb19d704b
      IMPLEMENTATION_SHA: aca563951d6480dfc24fddafd11a3f1fdb6c2938
      BASE_SHA: ed14f57363c359e60633f9f1da9ad69dee8b5bda
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ env.SOURCE_SHA }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Initialize evidence
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rem-012-5-frame01-replacement'; New-Item -ItemType Directory -Path $root -Force | Out-Null
          "EVIDENCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify exact lineage and path allowlist
        shell: pwsh
        run: |
          @'
          import os, subprocess
          from pathlib import Path
          def g(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def paths(c): return sorted(x for x in g('diff-tree','--no-commit-id','--name-only','-r',c).splitlines() if x)
          s=os.environ['SOURCE_SHA']; r=os.environ['RECOVERY_PARENT_SHA']; v=os.environ['VISUAL_SHA']; p=os.environ['PREVIOUS_SHA']; c=os.environ['CORRECTIVE_SHA']; i=os.environ['IMPLEMENTATION_SHA']; b=os.environ['BASE_SHA']
          chain=[(s,r,'fix(miro): recover Frame 00 resize ordering'),(r,v,'dummy'),(v,p,'fix(miro): restore Frame 01 visual companions'),(p,c,'fix(ci): validate REM-012.5 corrective lineage'),(c,i,'fix(ci): correct REM-012.5 evidence path expression'),(i,b,'fix(miro): replace Frame 01 container from redline')]
          for cur,parent,subject in chain:
              assert g('rev-parse',cur+'^')==parent, f'lineage mismatch at {cur}'
              assert g('show','-s','--format=%s',cur)==subject, f'subject mismatch at {cur}'
          assert paths(s)==sorted(['.github/workflows/miro-frame01-redline.yml','dummy','runtime/miro/ddda_miro/frame00_resize_ordering_wirefix.py','runtime/miro/tests/test_rem_012_5_frame00_position_payload.py'])
          assert paths(r)==['dummy']
          assert paths(v)==sorted(['.github/workflows/miro-frame01-redline.yml','runtime/miro/ddda_miro/review_board_recovery_wirefix.py','runtime/miro/tests/test_rem_012_5_frame00_position_payload.py','scaffolds/miro/rem-012-5-frame-01.yaml'])
          assert paths(p)==['.github/workflows/miro-frame01-redline.yml'] and paths(c)==['.github/workflows/miro-frame01-redline.yml']
          assert paths(i)==sorted(['.github/workflows/miro-frame01-redline.yml','runtime/miro/ddda_miro/review_board_recovery_wirefix.py','runtime/miro/tests/test_rem_012_5_frame00_position_payload.py','scaffolds/miro/rem-012-5-frame-01.yaml'])
          assert not Path('dummy').exists()
          m=Path('scaffolds/miro/rem-012-5-frame-01.yaml').read_text(encoding='utf-8')
          for x in (f'authorized_base_sha: {b}','source_companion_frames:','methodology_min_font_size: 80','connector_caption_min_font_size: 48','frame00_container_policy: restore_accepted_geometry_preserve_top_left_pending_human_equivalence_check'): assert x in m
          '@ | python -

      - name: Wait for authoritative exact-SHA evidence and candidate
        id: ci
        shell: pwsh
        run: |
          @'
          import json,os,time,urllib.request
          repo,sha,t=os.environ['GITHUB_REPOSITORY'],os.environ['SOURCE_SHA'],os.environ['GH_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/vnd.github+json'}
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=h)))
          def latest(xs,n):
              z=[x for x in xs if x['name']==n]; return max(z,key=lambda x:x['run_number']) if z else None
          for _ in range(240):
              runs=get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs']
              v,q,p=latest(runs,'Validate DDDA'),latest(runs,'DDDA exact-code Miro image probe'),latest(runs,'DDDA platform CI')
              for x,n in ((v,'Validate DDDA'),(q,'Miro image probe')):
                  if x and x['status']=='completed' and x.get('conclusion')!='success': raise SystemExit(f'{n} failed')
              if p:
                  jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{p["id"]}/jobs?per_page=100')['jobs']; names=('Platform validation','One-command PR validation')
                  js=[next((j for j in jobs if j['name']==n),None) for n in names]
                  if any(j and j['status']=='completed' and j.get('conclusion')!='success' for j in js): raise SystemExit('platform validation failed')
                  arts=get(f'https://api.github.com/repos/{repo}/actions/runs/{p["id"]}/artifacts?per_page=100')['artifacts']
                  ready=all(x and x['status']=='completed' and x.get('conclusion')=='success' for x in (v,q,*js)) and any(a['name']==f'ddda-candidate-{sha}' and not a['expired'] for a in arts)
                  if ready:
                      with open(os.environ['GITHUB_OUTPUT'],'a') as o:o.write(f'platform_run_id={p["id"]}\n')
                      break
              time.sleep(15)
          else: raise SystemExit('exact-SHA evidence/candidate timeout')
          '@ | python -

      - name: Run targeted REM-012.5 tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH=Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_5_frame_01.py runtime/miro/tests/test_rem_012_5_frame00_position_payload.py -q
          if($LASTEXITCODE -ne 0){throw 'targeted tests failed'}

      - name: Verify Miro secret
        shell: pwsh
        env: {MIRO_ACCESS_TOKEN: '${{ secrets.MIRO_ACCESS_TOKEN }}'}
        run: if([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)){throw 'MIRO_ACCESS_TOKEN is required'}

      - name: Download exact-SHA candidate package
        uses: actions/download-artifact@v4
        with:
          name: ddda-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.platform_run_id }}

      - name: Replace Frame 01 from exact-SHA candidate
        shell: pwsh
        env: {MIRO_ACCESS_TOKEN: '${{ secrets.MIRO_ACCESS_TOKEN }}'}
        run: |
          $ErrorActionPreference='Stop'; $candidate=@(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'candidate') -Filter '*.zip' -File -Recurse); if($candidate.Count -ne 1){throw 'candidate count mismatch'}
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $candidate[0].FullName -ExpectedCommit $env:SOURCE_SHA -ExpectedKind candidate
          $root=Join-Path $env:RUNNER_TEMP 'rem-012-5-frame01-package'; if(Test-Path $root){Remove-Item $root -Recurse -Force}; Expand-Archive $candidate[0].FullName $root -Force
          $runtime=Join-Path $root 'runtime\miro'; python -m pip install --disable-pip-version-check --no-input $runtime; $env:PYTHONPATH=$runtime
          $manifest=Join-Path $root 'scaffolds\miro\rem-012-5-frame-01.yaml'; $report=Join-Path $env:EVIDENCE_ROOT 'result.json'
          python -m ddda_miro.frame00_resize_ordering_wirefix --manifest $manifest --report $report --source-sha $env:SOURCE_SHA --apply
          if($LASTEXITCODE -ne 0){Get-Content $report -ErrorAction SilentlyContinue; throw 'REM-012.5 replacement failed'}
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if($r.technical_status -ne 'PASS' -or $r.human_review_status -ne 'PENDING' -or $r.overall_status -ne 'READY_FOR_HUMAN_REVIEW'){throw 'acceptance state mismatch'}
          if(-not $r.protected_frames.unchanged -or $r.protected_frames.count -ne 16){throw 'protected frames changed'}
          if($r.frame00_visual_equivalence_spot_check -ne 'PENDING'){throw 'Frame00 HVR must remain pending'}
          if([math]::Abs([double]$r.frame00_container.geometry.width-7000)-gt .5 -or [math]::Abs([double]$r.frame00_container.geometry.height-4914.42)-gt .5){throw 'Frame00 geometry mismatch'}
          if($r.frame01_recovery.second_run.items.created -ne 0 -or $r.frame01_recovery.second_run.items.updated -ne 0 -or $r.frame01_recovery.second_run.items.deleted -ne 0){throw 'Frame01 second reconcile mutated items'}
          if($r.frame01_recovery.second_run.connectors.created -ne 0 -or $r.frame01_recovery.second_run.connectors.updated -ne 0 -or $r.frame01_recovery.second_run.connectors.deleted -ne 0){throw 'Frame01 second reconcile mutated connectors'}
          if($r.companion_frames.second_run.frames.created -ne 0 -or $r.companion_frames.second_run.frames.updated -ne 0 -or $r.companion_frames.second_run.frames.unchanged -ne 9){throw 'companion second reconcile mismatch'}
          if([int]$r.readability_contract.methodology_min_font_size -lt 80 -or [int]$r.readability_contract.connector_caption_min_font_size -lt 48){throw 'readability contract mismatch'}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-5-frame01-redline-pr-${{ env.PR_NUMBER }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30

name: DDDA REM-012.5 frame 01 redline

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

concurrency:
  group: ddda-rem-012-5-frame-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Exact-code REM-012.5 Frame 01 redline replacement
    if: >-
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIOUS_SHA: fe19caa861ae3476d9940c2c4565b8e1d42b03b0
      BASE_SHA: ed14f57363c359e60633f9f1da9ad69dee8b5bda
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize evidence
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'rem-012-5-frame01-replacement'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "EVIDENCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify exact corrective lineage and scope
        shell: pwsh
        run: |
          @'
          import os, subprocess
          from pathlib import Path

          def g(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          source=os.environ['SOURCE_SHA']
          assert g('rev-parse', source + '^') == os.environ['PREVIOUS_SHA'], 'corrective parent SHA mismatch'
          assert g('show', '-s', '--format=%s', source) == 'fix(miro): preserve HVR-2 arrowheads only'
          subprocess.check_call(['git','merge-base','--is-ancestor',os.environ['BASE_SHA'],source])
          observed=sorted(x for x in g('diff-tree','--no-commit-id','--name-only','-r',source).splitlines() if x)
          expected=sorted([
              '.github/workflows/miro-frame01-redline.yml',
              'docs/reviews/REM-PR8-HVR2-miro-tips-readback-normalization.md',
              'runtime/miro/ddda_miro/connector_readback_wirefix.py',
              'runtime/miro/ddda_miro/miro_tips_endpoint_wirefix.py',
              'runtime/miro/tests/test_rem_012_5_connector_readback.py',
              'scaffolds/miro/rem-012-5-frame-01.yaml',
          ])
          assert observed == expected, f'corrective path mismatch: {observed}'

          manifest=Path('scaffolds/miro/rem-012-5-frame-01.yaml').read_text(encoding='utf-8')
          for marker in (
              'vertical_offset_y: 600',
              'endpoint_position_policy: preserve_source_arrowhead_position_for_black_captionless_callouts_only',
              'layer_policy: image_below_native_callouts',
              'press tab after typing a sticky',
          ):
              assert marker in manifest, f'manifest marker missing: {marker}'

          note=Path('docs/reviews/REM-PR8-HVR2-miro-tips-readback-normalization.md').read_text(encoding='utf-8')
          for marker in (
              'arrowhead landing point',
              'screenshot-side `endItem`',
              '3458764680476608045',
              '+600 Miro units',
              'HVR-3 remains blocked',
          ):
              assert marker in note, f'review marker missing: {marker}'
          '@ | python -

      - name: Run targeted REM-012.5 tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest 'ruamel.yaml>=0.18,<0.19' requests pyyaml
          $env:PYTHONPATH=Join-Path $PWD.Path 'runtime\miro'
          python -m pytest runtime/miro/tests/test_rem_012_5_frame_01.py runtime/miro/tests/test_rem_012_5_frame00_position_payload.py runtime/miro/tests/test_rem_012_5_connector_readback.py runtime/miro/tests/test_rem_012_5_miro_tips_hvr.py runtime/miro/tests/test_rem_012_5_miro_tips_semantic.py -q
          if($LASTEXITCODE -ne 0){throw 'targeted tests failed'}

      - name: Wait for authoritative exact-SHA evidence and candidate
        id: ci
        shell: pwsh
        run: |
          @'
          import json,os,time,urllib.request
          repo,sha,t=os.environ['GITHUB_REPOSITORY'],os.environ['SOURCE_SHA'],os.environ['GH_TOKEN']
          h={'Authorization':f'Bearer {t}','Accept':'application/vnd.github+json'}
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers=h)))
          def latest(xs,n):
              rows=[x for x in xs if x['name']==n]
              return max(rows,key=lambda x:x['run_number']) if rows else None
          for _ in range(240):
              runs=get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=pull_request&per_page=100')['workflow_runs']
              validate=latest(runs,'Validate DDDA')
              probe=latest(runs,'DDDA exact-code Miro image probe')
              platform=latest(runs,'DDDA platform CI')
              for run,name in ((validate,'Validate DDDA'),(probe,'Miro image probe')):
                  if run and run['status']=='completed' and run.get('conclusion')!='success':
                      raise SystemExit(f'{name} failed')
              if platform:
                  jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{platform["id"]}/jobs?per_page=100')['jobs']
                  required=[next((j for j in jobs if j['name']==n),None) for n in ('Platform validation','One-command PR validation')]
                  if any(j and j['status']=='completed' and j.get('conclusion')!='success' for j in required):
                      raise SystemExit('platform validation failed')
                  artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{platform["id"]}/artifacts?per_page=100')['artifacts']
                  candidate=any(a['name']==f'ddda-candidate-{sha}' and not a['expired'] for a in artifacts)
                  ready=all(x and x['status']=='completed' and x.get('conclusion')=='success' for x in (validate,probe,*required))
                  if ready and candidate:
                      with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                          out.write(f'platform_run_id={platform["id"]}\n')
                      break
              time.sleep(15)
          else:
              raise SystemExit('exact-SHA evidence/candidate timeout')
          '@ | python -

      - name: Verify Miro secret
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: if([string]::IsNullOrWhiteSpace($env:MIRO_ACCESS_TOKEN)){throw 'MIRO_ACCESS_TOKEN is required'}

      - name: Download exact-SHA candidate package
        uses: actions/download-artifact@v4
        with:
          name: ddda-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.platform_run_id }}

      - name: Reconcile Frame 01 from exact-SHA candidate
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $candidate=@(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'candidate') -Filter '*.zip' -File -Recurse)
          if($candidate.Count -ne 1){throw 'candidate count mismatch'}
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $candidate[0].FullName -ExpectedCommit $env:SOURCE_SHA -ExpectedKind candidate
          $root=Join-Path $env:RUNNER_TEMP 'rem-012-5-frame01-package'
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          Expand-Archive $candidate[0].FullName $root -Force
          $runtime=Join-Path $root 'runtime\miro'
          python -m pip install --disable-pip-version-check --no-input $runtime
          $env:PYTHONPATH=$runtime
          $manifest=Join-Path $root 'scaffolds\miro\rem-012-5-frame-01.yaml'
          $report=Join-Path $env:EVIDENCE_ROOT 'result.json'
          python -m ddda_miro.connector_readback_wirefix --manifest $manifest --report $report --source-sha $env:SOURCE_SHA --apply
          if($LASTEXITCODE -ne 0){Get-Content $report -ErrorAction SilentlyContinue; throw 'REM-012.5 reconcile failed'}

          $r=Get-Content $report -Raw | ConvertFrom-Json
          if($r.technical_status -ne 'PASS' -or $r.human_review_status -ne 'PENDING' -or $r.overall_status -ne 'READY_FOR_HUMAN_REVIEW'){throw 'acceptance state mismatch'}
          if(-not $r.protected_frames.unchanged -or $r.protected_frames.count -ne 16){throw 'protected frames changed'}
          if($r.frame01_recovery.second_run.items.created -ne 0 -or $r.frame01_recovery.second_run.items.updated -ne 0 -or $r.frame01_recovery.second_run.items.deleted -ne 0){throw 'Frame01 second reconcile mutated items'}
          if($r.frame01_recovery.second_run.connectors.created -ne 0 -or $r.frame01_recovery.second_run.connectors.updated -ne 0 -or $r.frame01_recovery.second_run.connectors.deleted -ne 0){throw 'Frame01 second reconcile mutated connectors'}
          if($r.companion_frames.second_run.frames.created -ne 0 -or $r.companion_frames.second_run.frames.updated -ne 0 -or $r.companion_frames.second_run.frames.unchanged -ne 9){throw 'companion frame second reconcile mismatch'}

          $tips1=@($r.companion_frames.first_run.details | Where-Object {$_.title -eq 'Miro Tips'})
          $tips2=@($r.companion_frames.second_run.details | Where-Object {$_.title -eq 'Miro Tips'})
          if($tips1.Count -ne 1 -or $tips2.Count -ne 1){throw 'Miro Tips evidence missing'}
          foreach($tips in @($tips1[0],$tips2[0])){
            if($tips.mode -ne 'reference_ui_tutorial' -or $tips.layer_policy -ne 'image_below_native_callouts'){throw 'Miro Tips mode/layer mismatch'}
            if([math]::Abs([double]$tips.vertical_offset_y-600)-gt .01){throw 'Miro Tips vertical offset mismatch'}
            if([int]$tips.target_image_count -lt 1 -or [int]$tips.target_connector_count -lt 8){throw 'Miro Tips content incomplete'}
            if([int]$tips.target_image_anchor_connector_count -lt 8){throw 'Miro Tips image anchor count mismatch'}
            if([math]::Abs([double]$tips.target_geometry.width-1919.43)-gt .5 -or [math]::Abs([double]$tips.target_geometry.height-1079.68)-gt .5){throw 'Miro Tips geometry mismatch'}
            if([math]::Abs([double]$tips.target_position.x-(-19834.447))-gt 1 -or [math]::Abs([double]$tips.target_position.y-(-11727.533))-gt 1){throw 'Miro Tips placement mismatch'}
            if($tips.replacement_frame_id -ne '3458764680476608045'){throw 'Miro Tips active replacement identity mismatch'}
          }
          if([int]$tips1[0].frame_replaced -ne 0 -or [int]$tips1[0].forced_layer_rebuild -ne 0){throw 'Miro Tips stable frame was unexpectedly replaced'}
          if([int]$tips2[0].frame_replaced -ne 0 -or [int]$tips2[0].forced_layer_rebuild -ne 0 -or [int]$tips2[0].background_images_primed -ne 0){throw 'Miro Tips second run changed stable identity/layers'}
          if($tips2[0].items.created -ne 0 -or $tips2[0].items.updated -ne 0 -or $tips2[0].items.deleted -ne 0){throw 'Miro Tips second run mutated items'}
          if($tips2[0].connectors.created -ne 0 -or $tips2[0].connectors.updated -ne 0 -or $tips2[0].connectors.deleted -ne 0){throw 'Miro Tips second run mutated connectors'}
          if($r.merge_allowed -or $r.promotion_allowed -or $r.release_allowed -or $r.gate_approval_allowed){throw 'governance boundary violated'}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-012-5-frame01-redline-pr-${{ env.PR_NUMBER }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/**
          if-no-files-found: error
          retention-days: 30

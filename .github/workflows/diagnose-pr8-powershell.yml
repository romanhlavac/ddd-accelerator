name: Diagnose PR8 PowerShell

on:
  pull_request:

permissions:
  contents: read

jobs:
  compact-first-run:
    runs-on: windows-latest
    steps:
      - name: Run first-run and print only failure tail
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/zipball/$env:SOURCE_SHA" -OutFile source.zip
          Expand-Archive source.zip -DestinationPath source
          $root = (Get-ChildItem source -Directory | Select-Object -First 1).FullName
          git -C $root init -q
          git -C $root config core.autocrlf false
          git -C $root config user.name "DDDA Diagnostic"
          git -C $root config user.email "ddda-diagnostic@example.invalid"
          git -C $root add -A 2>$null
          git -C $root commit -qm baseline
          $output = @()
          try { $output = @(& (Join-Path $root "tests/powershell/Test-DDDAFirstRun.ps1") -PlatformPath $root 6>&1 5>&1 4>&1 3>&1 2>&1); $code = $LASTEXITCODE }
          catch { $output += ($_ | Out-String); $code = 1 }
          if ($code -ne 0) { $output | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }; exit $code }
          Write-Host "Compact first-run diagnostic: PASS"

  compact-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Run Windows PowerShell 5.1 suite and print only failure tail
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/zipball/$env:SOURCE_SHA" -OutFile source.zip
          Expand-Archive source.zip -DestinationPath source
          $root = (Get-ChildItem source -Directory | Select-Object -First 1).FullName
          git -C $root init -q
          git -C $root config core.autocrlf false
          git -C $root config user.name "DDDA Diagnostic"
          git -C $root config user.email "ddda-diagnostic@example.invalid"
          git -C $root add -A 2>$null
          git -C $root commit -qm baseline
          $commands = @(
            @{ name = "installation"; path = "scripts/Test-DDDAInstallation.ps1" },
            @{ name = "miro-automation"; path = "tests/powershell/Test-DDDAMiroAutomation.ps1" },
            @{ name = "project-steering"; path = "tests/powershell/Test-DDDAProjectSteering.ps1" }
          )
          foreach ($command in $commands) {
            $output = @()
            try { $output = @(& (Join-Path $root $command.path) -PlatformPath $root 6>&1 5>&1 4>&1 3>&1 2>&1); $code = $LASTEXITCODE }
            catch { $output += ($_ | Out-String); $code = 1 }
            if ($code -ne 0) { Write-Host "FAILED: $($command.name)"; $output | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }; exit $code }
          }
          Write-Host "Compact Windows PowerShell 5.1 diagnostic: PASS"

name: DDDA platform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddda-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: Platform validation
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact source state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
              throw "Checkout SHA '$actual' neodpovídá SOURCE_SHA '$env:SOURCE_SHA'."
          }
          git status --short
          Write-Host "Source SHA: $actual"
          pwsh --version
          python --version

      - name: Platform doctor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\ddda.ps1 doctor

      - name: Source-level validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\ddda.ps1 test -Suite lint -NonInteractive
          .\ddda.ps1 test -Suite schema -NonInteractive
          .\ddda.ps1 test -Suite unit -NonInteractive
          .\ddda.ps1 test -Suite component -NonInteractive
          .\ddda.ps1 test -Suite regression -NonInteractive
          .\ddda.ps1 test -Suite security -NonInteractive

      - name: Build candidate package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'ci.' + $env:GITHUB_RUN_ID + '.' + $env:SOURCE_SHA.Substring(0, 12)
          $output = Join-Path $env:RUNNER_TEMP ('ddda-candidate-' + $env:SOURCE_SHA.Substring(0, 12) + '.zip')
          $json = .\scripts\platform\New-DDDAPlatformPackage.ps1 -PlatformPath $PWD.Path -Kind candidate -Version $version -SourceRef $env:SOURCE_SHA -OutputPath $output -Json | Out-String
          $package = $json.Trim() | ConvertFrom-Json
          if ($package.source_commit -ne $env:SOURCE_SHA) {
              throw 'Candidate package source_commit does not match exact source SHA.'
          }
          if (-not (Test-Path -LiteralPath $package.path -PathType Leaf)) {
              throw 'Candidate package was not created.'
          }
          "package_path=$($package.path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sha256=$($package.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package-first validation
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'platform-package-first.log'
          $previousPreference = $ErrorActionPreference
          $code = 1
          try {
            $ErrorActionPreference = 'Continue'
            & {
              $packagePath = '${{ steps.package.outputs.package_path }}'
              .\scripts\platform\Test-DDDAPlatformPackage.ps1 -PackagePath $packagePath -ExpectedCommit $env:SOURCE_SHA -ExpectedKind candidate
              .\ddda.ps1 test -Suite integration -PackagePath $packagePath -NonInteractive
              .\ddda.ps1 test -Suite smoke -PackagePath $packagePath -NonInteractive
              .\ddda.ps1 test -Suite security -PackagePath $packagePath -NonInteractive
              .\ddda.ps1 test -Suite e2e -PackagePath $packagePath -NonInteractive
              .\ddda.ps1 test -Suite acceptance -PackagePath $packagePath -CleanupOnFailure -NonInteractive
            } *> $log
            $code = $LASTEXITCODE
            if ($null -eq $code) { $code = 0 }
          }
          catch {
            ($_ | Out-String) | Add-Content -LiteralPath $log -Encoding UTF8
            $code = 1
          }
          finally {
            $ErrorActionPreference = $previousPreference
          }
          Get-Content -LiteralPath $log -Tail 240
          exit $code

      - name: Upload package-first diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-package-first-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-package-first.log
          if-no-files-found: error

      - name: Verify repository remains clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace(($changes -join "`n"))) {
              throw "CI validation modified the platform repository:`n$($changes -join "`n")"
          }

      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: ddda-candidate-${{ env.SOURCE_SHA }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 7

  validate-pr-command:
    name: One-command PR validation
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run exact validate-pr command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
              throw "Checkout SHA '$actual' neodpovídá PR head '$env:SOURCE_SHA'."
          }
          .\ddda.ps1 validate-pr -Pr ([int]$env:PR_NUMBER) -CleanupOnFailure -NonInteractive

      - name: Verify PASS report for exact SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = Join-Path $env:LOCALAPPDATA ("DDDA\validation-reports\pr-{0}-{1}" -f $env:PR_NUMBER, $env:SOURCE_SHA)
          $reports = @(Get-ChildItem -LiteralPath $reportRoot -Filter result.json -File -Recurse -ErrorAction Stop | Sort-Object LastWriteTimeUtc -Descending)
          if ($reports.Count -eq 0) {
              throw "validate-pr nevytvořil report pod $reportRoot."
          }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.source.commit -ne $env:SOURCE_SHA -or [int]$report.source.pr -ne [int]$env:PR_NUMBER) {
              throw "Validation report není PASS pro exact PR head. Report: $($reports[0].FullName)"
          }
          Write-Host "Validated report: $($reports[0].FullName)"

      - name: Stage validate-pr reports
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:LOCALAPPDATA ("DDDA\validation-reports\pr-{0}-{1}" -f $env:PR_NUMBER, $env:SOURCE_SHA)
          $target = Join-Path $env:RUNNER_TEMP 'validate-pr-reports'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          if (Test-Path -LiteralPath $source -PathType Container) {
              Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          }
          else {
              Set-Content -LiteralPath (Join-Path $target 'missing-report.txt') -Encoding UTF8 -Value "Validation report root was not created: $source"
          }

      - name: Upload validate-pr reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-pr-${{ env.PR_NUMBER }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/validate-pr-reports/**
          if-no-files-found: error
          retention-days: 14

  miro-profile-bindings:
    name: Miro profile bindings
    needs:
      - validate-platform
      - validate-pr-command
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      DDDA_MIRO_PRIVATE_DEV_TEAM_ID: ${{ vars.DDDA_MIRO_PRIVATE_DEV_TEAM_ID || '3458764678971681560' }}
      DDDA_MIRO_PLATFORM_LAB_BOARD_ID: ${{ vars.DDDA_MIRO_PLATFORM_LAB_BOARD_ID || 'uXjVH0doLYY=' }}
      DDDA_MIRO_GH_CI_BOARD_ID: ${{ vars.DDDA_MIRO_GH_CI_BOARD_ID || 'uXjVHy7iQD4=' }}
      DDDA_MIRO_HVR_BOARD_NAME: DDDA_HVR

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify three Miro identities and board bindings
        shell: pwsh
        env:
          MIRO_PLATFORM_LAB_ACCESS_TOKEN: ${{ secrets.MIRO_PLATFORM_LAB_ACCESS_TOKEN }}
          MIRO_GH_CI_ACCESS_TOKEN: ${{ secrets.MIRO_GH_CI_ACCESS_TOKEN }}
          MIRO_HVR_ACCESS_TOKEN: ${{ secrets.MIRO_HVR_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'miro-three-profile-bindings.json'
          "EVIDENCE_PATH=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          API='https://api.miro.com'

          def request(method, path, token, payload=None):
              data=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(API+path, data=data, method=method)
              req.add_header('Authorization', 'Bearer '+token)
              req.add_header('Accept', 'application/json')
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw=response.read()
                  return None if not raw else json.loads(raw.decode('utf-8'))

          def token_context(label, env_name):
              token=os.environ.get(env_name, '').strip()
              if not token:
                  raise SystemExit(f'{label}: required secret {env_name} is missing')
              ctx=request('GET','/v1/oauth-token',token)
              team=ctx.get('team') if isinstance(ctx.get('team'),dict) else {}
              user=ctx.get('user') if isinstance(ctx.get('user'),dict) else {}
              team_id=str(ctx.get('team_id') or team.get('id') or '')
              if team_id != os.environ['DDDA_MIRO_PRIVATE_DEV_TEAM_ID']:
                  raise SystemExit(f'{label}: token team mismatch')
              scope=ctx.get('scope') or ctx.get('scopes') or []
              if isinstance(scope,str):
                  scopes={x for x in scope.replace(',', ' ').split() if x}
              else:
                  scopes={str(x) for x in scope}
              missing={'boards:read','boards:write'}-scopes
              if missing:
                  raise SystemExit(f'{label}: missing required Miro scopes: {sorted(missing)}')
              return token, {
                  'team_id': team_id,
                  'user_id': str(ctx.get('user_id') or user.get('id') or ''),
                  'scopes': sorted(scopes),
              }

          expected_team=os.environ['DDDA_MIRO_PRIVATE_DEV_TEAM_ID']
          ptoken,pctx=token_context('platform_lab','MIRO_PLATFORM_LAB_ACCESS_TOKEN')
          ctoken,cctx=token_context('github_ci','MIRO_GH_CI_ACCESS_TOKEN')
          htoken,hctx=token_context('hvr','MIRO_HVR_ACCESS_TOKEN')

          platform_id=os.environ['DDDA_MIRO_PLATFORM_LAB_BOARD_ID']
          platform=request('GET','/v2/boards/'+urllib.parse.quote(platform_id,safe=''),ptoken)
          if platform.get('name') != 'DDDA_PLATFORM_LAB':
              platform=request('PATCH','/v2/boards/'+urllib.parse.quote(platform_id,safe=''),ptoken,{'name':'DDDA_PLATFORM_LAB'})
          if platform.get('name') != 'DDDA_PLATFORM_LAB':
              raise SystemExit('platform_lab: board rename/binding failed')

          ci_id=os.environ['DDDA_MIRO_GH_CI_BOARD_ID']
          ci=request('GET','/v2/boards/'+urllib.parse.quote(ci_id,safe=''),ctoken)
          if ci.get('name') != 'DDDA_GH_CI':
              raise SystemExit('github_ci: configured board is not DDDA_GH_CI')

          params=urllib.parse.urlencode({'team_id':expected_team,'limit':'50','sort':'alphabetically'})
          boards=request('GET','/v2/boards?'+params,htoken).get('data',[])
          hvr=[b for b in boards if b.get('name')==os.environ['DDDA_MIRO_HVR_BOARD_NAME']]
          if len(hvr)!=1:
              raise SystemExit(f'hvr: expected exactly one DDDA_HVR board, found {len(hvr)}')

          evidence={
              'schema_version':1,
              'source_sha':os.environ['SOURCE_SHA'],
              'team_id':expected_team,
              'profiles':{
                  'platform_lab':{**pctx,'board_id':platform_id,'board_name':'DDDA_PLATFORM_LAB'},
                  'github_ci':{**cctx,'board_id':ci_id,'board_name':'DDDA_GH_CI'},
                  'hvr':{**hctx,'board_id':str(hvr[0].get('id')),'board_name':'DDDA_HVR'},
              },
              'technical_status':'PASS',
          }
          Path(os.environ['EVIDENCE_PATH']).write_text(json.dumps(evidence,indent=2),encoding='utf-8')
          print('Three-profile Miro binding preflight: PASS')
          '@ | python -

      - name: Upload Miro profile binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miro-profile-bindings-${{ env.SOURCE_SHA }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 14

  online-miro-acceptance:
    name: Online Miro acceptance
    needs:
      - validate-platform
      - validate-pr-command
      - miro-profile-bindings
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 8 &&
      github.actor == 'romanhlavac' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MIRO_TEAM_ID: ${{ vars.DDDA_MIRO_PRIVATE_DEV_TEAM_ID || '3458764678971681560' }}
      DDDA_MIRO_GH_CI_BOARD_ID: ${{ vars.DDDA_MIRO_GH_CI_BOARD_ID || 'uXjVHy7iQD4=' }}
      ACCEPTANCE_CLAIMS_MODERNIZATION_MIRO_BOARD_ID: ${{ vars.DDDA_MIRO_GH_CI_BOARD_ID || 'uXjVHy7iQD4=' }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require GH CI REST credential
        shell: pwsh
        env:
          MIRO_GH_CI_ACCESS_TOKEN: ${{ secrets.MIRO_GH_CI_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRO_GH_CI_ACCESS_TOKEN)) {
            throw 'MIRO_GH_CI_ACCESS_TOKEN is required; cross-profile and legacy fallbacks are forbidden.'
          }

      - name: Reset dedicated DDDA_GH_CI board
        shell: pwsh
        env:
          MIRO_GH_CI_ACCESS_TOKEN: ${{ secrets.MIRO_GH_CI_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os, urllib.error, urllib.parse, urllib.request

          token=os.environ['MIRO_GH_CI_ACCESS_TOKEN']
          board=os.environ['DDDA_MIRO_GH_CI_BOARD_ID']
          base='https://api.miro.com'

          def request(method,path):
              req=urllib.request.Request(base+path,method=method)
              req.add_header('Authorization','Bearer '+token)
              req.add_header('Accept','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      raw=response.read()
                      return None if not raw else json.loads(raw.decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  if method=='DELETE' and exc.code==404:
                      return None
                  raise

          meta=request('GET','/v2/boards/'+urllib.parse.quote(board,safe=''))
          if meta.get('name')!='DDDA_GH_CI':
              raise SystemExit('Refusing reset: configured board is not DDDA_GH_CI')

          items=[]
          cursor=None
          while True:
              params={'limit':'50'}
              if cursor:
                  params['cursor']=cursor
              page=request('GET','/v2/boards/'+urllib.parse.quote(board,safe='')+'/items?'+urllib.parse.urlencode(params))
              items.extend(page.get('data',[]))
              cursor=page.get('cursor')
              if not cursor:
                  break

          # Non-frame items first; removing either connector endpoint removes its connector automatically.
          for item in sorted(items,key=lambda x: x.get('type')=='frame'):
              item_id=str(item.get('id') or '')
              if item_id:
                  request('DELETE','/v2/boards/'+urllib.parse.quote(board,safe='')+'/items/'+urllib.parse.quote(item_id,safe=''))

          remaining=request('GET','/v2/boards/'+urllib.parse.quote(board,safe='')+'/items?limit=50').get('data',[])
          if remaining:
              raise SystemExit(f'DDDA_GH_CI reset incomplete: {len(remaining)} items remain')
          print(f'DDDA_GH_CI reset: PASS ({len(items)} items removed)')
          '@ | python -

      - name: Download exact-SHA candidate package
        uses: actions/download-artifact@v4
        with:
          name: ddda-candidate-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate

      - name: Run exact-SHA online Miro acceptance on DDDA_GH_CI
        shell: pwsh
        env:
          MIRO_ACCESS_TOKEN: ${{ secrets.MIRO_GH_CI_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Checkout SHA '$actual' neodpovídá PR head '$env:SOURCE_SHA'."
          }
          $candidate = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'candidate') -Filter '*.zip' -File)
          if ($candidate.Count -ne 1) {
            throw "Expected exactly one candidate package, found $($candidate.Count)."
          }
          .\scripts\platform\Test-DDDAPlatformPackage.ps1 `
            -PackagePath $candidate[0].FullName `
            -ExpectedCommit $env:SOURCE_SHA `
            -ExpectedKind candidate

          $packageRoot = Join-Path $env:RUNNER_TEMP 'online-miro-package'
          if (Test-Path -LiteralPath $packageRoot) {
            Remove-Item -LiteralPath $packageRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $candidate[0].FullName -DestinationPath $packageRoot -Force

          $manifestPath = Join-Path $packageRoot 'ddda-package.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Expanded candidate package is missing ddda-package.json: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$manifest.source_commit -ne $env:SOURCE_SHA -or [string]$manifest.kind -ne 'candidate') {
            throw "Expanded candidate package provenance does not match exact SHA '$env:SOURCE_SHA'."
          }

          git -C $packageRoot init --initial-branch=acceptance
          git -C $packageRoot config user.name 'DDDA Online Acceptance'
          git -C $packageRoot config user.email 'ddda-online-acceptance@example.invalid'
          git -C $packageRoot add --all
          git -C $packageRoot commit -m "test: initialize candidate package $env:SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the temporary candidate-package Git baseline.'
          }
          $packageGitRoot = (git -C $packageRoot rev-parse --show-toplevel).Trim()
          if ([IO.Path]::GetFullPath($packageGitRoot).TrimEnd('\', '/') -ne [IO.Path]::GetFullPath($packageRoot).TrimEnd('\', '/')) {
            throw "Temporary package Git root '$packageGitRoot' does not match package root '$packageRoot'."
          }

          & (Join-Path $packageRoot 'scripts\platform\Invoke-DDDAMiroAcceptanceEvidence.ps1') `
            -PlatformPath $packageRoot `
            -Suite project-steering `
            -KeepReviewBoard `
            -MiroTeamId $env:MIRO_TEAM_ID `
            -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            throw 'Dedicated DDDA_GH_CI acceptance failed.'
          }

          $reports = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'DDDA\acceptance-reports') -Filter result.json -File -Recurse | Sort-Object LastWriteTimeUtc -Descending)
          if ($reports.Count -eq 0) { throw 'Online acceptance result.json not found.' }
          $r = Get-Content $reports[0].FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$r.miro_board_id -ne $env:DDDA_MIRO_GH_CI_BOARD_ID) {
            throw "Online acceptance used unexpected board '$($r.miro_board_id)'."
          }
          if ([string]$r.status -ne 'PASS' -or [string]$r.overall_status -ne 'PENDING_HUMAN_REVIEW') {
            throw 'Online acceptance evidence state mismatch.'
          }

      - name: Stage online acceptance evidence
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'online-miro-acceptance'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($source in @(
            (Join-Path $env:LOCALAPPDATA "DDDA\validation-reports"),
            (Join-Path $env:LOCALAPPDATA "DDDA\acceptance-reports")
          )) {
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
            }
          }

      - name: Upload online acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-miro-acceptance-${{ env.PR_NUMBER }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/online-miro-acceptance/**
          if-no-files-found: warn
          retention-days: 14

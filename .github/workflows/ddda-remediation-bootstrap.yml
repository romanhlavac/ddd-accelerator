name: DDDA remediation bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ddda-remediation-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number == 8 &&
      github.actor == 'romanhlavac' &&
      startsWith(github.event.comment.body, '/ddda remediate ')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Resolve and authorize request
        id: request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '^/ddda remediate (?<script>scripts/remediation/[A-Za-z0-9._-]+\.ps1) --expected-sha (?<sha>[0-9a-f]{40})$'
          if ($env:COMMENT_BODY -notmatch $pattern) {
            throw 'Command does not match the governed remediation contract.'
          }
          $script = [string]$Matches['script']
          $expectedSha = [string]$Matches['sha']
          if ($script -ne 'scripts/remediation/Invoke-DDDAPR8Rem004MiroResilience.ps1') {
            throw "Remediation script is not allowlisted: $script"
          }

          $pr = gh api "repos/$env:REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ([string]$pr.state -ne 'open' -or -not [bool]$pr.draft) {
            throw 'PR must be open and draft.'
          }
          if ([string]$pr.head.repo.full_name -ne $env:REPOSITORY) {
            throw 'Only same-repository PRs are allowed.'
          }
          if ([string]$pr.head.sha -ne $expectedSha) {
            throw "Expected SHA $expectedSha does not match current PR head $($pr.head.sha)."
          }
          if ([string]$pr.head.ref -ne 'feat/project-steering-and-documentation') {
            throw "Unexpected PR branch: $($pr.head.ref)"
          }

          "script=$script" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "expected_sha=$expectedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_ref=$($pr.head.ref)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.request.outputs.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact SHA and configure Git
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Checkout SHA $actual does not match expected SHA $env:EXPECTED_SHA."
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain | Out-String))) {
            throw 'Checkout is not clean.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Execute allowlisted remediation
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          SCRIPT_PATH: ${{ steps.request.outputs.script }}
          HEAD_REF: ${{ steps.request.outputs.head_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD $env:SCRIPT_PATH) `
            -RepositoryRoot $PWD.Path `
            -ExpectedSha $env:EXPECTED_SHA `
            -Branch $env:HEAD_REF

      - name: Publish completion comment
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          $newSha = try { (git rev-parse HEAD).Trim() } catch { $null }
          $body = @"
          GOV-REMOTE-EXEC-BOOTSTRAP-001 / REM-PR8-HVA-CC-004: **$env:JOB_STATUS**

          - requested SHA: `$env:EXPECTED_SHA`
          - resulting SHA: `$newSha`
          - workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          No merge, tag, release, promotion or force-push was performed.
          "@
          gh pr comment $env:PR_NUMBER --repo $env:REPOSITORY --body $body

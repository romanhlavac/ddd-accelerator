name: Complete WP-10 WP-11 backlog alignment

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/complete-wp10-wp11-backlog.yml

permissions:
  contents: write
  issues: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0

      - name: Update versioned backlog contracts
        shell: bash
        run: python scripts/private/Complete-WP10WP11Backlog.py

      - name: Commit versioned changes and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/complete-wp10-wp11-backlog.yml
          rm scripts/private/Complete-WP10WP11Backlog.py
          python -m json.tool config/governance/github-bootstrap.json >/dev/null
          grep -F 'children: [34, 35, 36, 37, 38, 39, 40, 47, 41, 46]' config/governance/backlog-policy.yaml
          grep -F '#47 — evidence-to-workshop integration orchestration' docs/roadmap/backlog-index.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/governance docs/roadmap .github/workflows scripts/private
          git commit -m 'docs(governance): align WP-10 and WP-11 backlog contracts (#16)'
          git push origin HEAD:feature/github-native-backlog-governance

      - name: Apply native hierarchy and dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: romanhlavac/ddd-accelerator
        shell: bash
        run: |
          set -euo pipefail

          issue_id() {
            gh api "repos/$GH_REPO/issues/$1" --jq '.id'
          }

          add_subissue() {
            local parent="$1"
            local child="$2"
            if gh api "repos/$GH_REPO/issues/$parent/sub_issues?per_page=100" --jq '.[].number' | grep -qx "$child"; then
              return
            fi
            gh api --method POST "repos/$GH_REPO/issues/$parent/sub_issues" -F sub_issue_id="$(issue_id "$child")" >/dev/null
          }

          add_dependency() {
            local blocked="$1"
            local blocker="$2"
            if gh api "repos/$GH_REPO/issues/$blocked/dependencies/blocked_by?per_page=100" --jq '.[].number' | grep -qx "$blocker"; then
              return
            fi
            gh api --method POST "repos/$GH_REPO/issues/$blocked/dependencies/blocked_by" -F issue_id="$(issue_id "$blocker")" >/dev/null
          }

          add_subissue 20 46
          add_subissue 20 47

          for blocker in 27 31 32 34 35 36 37 38 39 40; do
            add_dependency 47 "$blocker"
          done
          add_dependency 41 47
          add_dependency 46 47
          add_dependency 46 41

          test "$(gh api "repos/$GH_REPO/issues/46" --jq '.parent_issue_url')" = "https://api.github.com/repos/$GH_REPO/issues/20"
          test "$(gh api "repos/$GH_REPO/issues/47" --jq '.parent_issue_url')" = "https://api.github.com/repos/$GH_REPO/issues/20"

name: PR8 bounded promotion dry-run bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: pr8-promotion-dry-run-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  promotion-dry-run-bootstrap:
    name: PR8 promotion dry-run bootstrap
    if: >-
      github.event.pull_request.number == 8 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/project-steering-and-documentation'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      TARGET_PR: '8'
      TARGET_VERSION: '0.1.0'
      STAGING_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BOOTSTRAP_PATH: .github/workflows/pr8-promotion-dry-run-bootstrap.yml

    steps:
      - name: Checkout immutable staging source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.STAGING_HEAD_SHA }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve current PR8 head and execution phase
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:TARGET_PR" | ConvertFrom-Json
          if ([string]$pr.state -ne 'open') { throw 'PR #8 must remain open.' }
          if ([bool]$pr.merged) { throw 'PR #8 must remain unmerged.' }
          if ([bool]$pr.draft) { throw 'PR #8 must be ready for review before promotion dry-run.' }
          if ([string]$pr.head.ref -ne 'feat/project-steering-and-documentation') { throw 'PR #8 head branch changed.' }
          if ([string]$pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) { throw 'PR #8 is no longer same-repository.' }
          $targetSha = [string]$pr.head.sha
          if ($targetSha -notmatch '^[0-9a-f]{40}$') { throw 'GitHub returned an invalid PR #8 head SHA.' }
          $execute = $targetSha -ne $env:STAGING_HEAD_SHA
          "target_sha=$targetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "execute=$($execute.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "phase=$(if ($execute) { 'EXECUTE_FINAL_SHA' } else { 'ARMED_WAITING_FOR_SELF_REMOVAL' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Staging SHA: $env:STAGING_HEAD_SHA"
          Write-Host "Current PR8 SHA: $targetSha"
          Write-Host "Execute dry-run: $execute"

      - name: Require one-commit self-removal and no other target delta
        if: steps.target.outputs.execute == 'true'
        shell: pwsh
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin $env:TARGET_SHA
          git cat-file -e "$env:TARGET_SHA^{commit}"
          git merge-base --is-ancestor $env:STAGING_HEAD_SHA $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Final target SHA is not a descendant of the staging SHA.' }
          $commitCount = [int](git rev-list --count "$env:STAGING_HEAD_SHA..$env:TARGET_SHA")
          if ($commitCount -ne 1) { throw "Expected exactly one self-removal commit after staging; found $commitCount." }
          $delta = @(git diff --name-status $env:STAGING_HEAD_SHA $env:TARGET_SHA -- | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($delta.Count -ne 1 -or $delta[0] -notmatch ('^D\s+' + [regex]::Escape($env:BOOTSTRAP_PATH) + '$')) {
            throw "Final target delta must only delete $env:BOOTSTRAP_PATH. Observed:`n$($delta -join "`n")"
          }
          Write-Host 'Self-removal guard: PASS'

      - name: Validate final exact PR8 candidate
        if: steps.target.outputs.execute == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\ddda.ps1 validate-pr -Pr 8 -CleanupOnFailure -NonInteractive

      - name: Run bounded promotion dry-run for 0.1.0
        if: steps.target.outputs.execute == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'pr8-promotion-dry-run.log'
          .\ddda.ps1 promote-pr -Pr 8 -Version 0.1.0 -DryRun -KeepArtifacts -NonInteractive 2>&1 | Tee-Object -FilePath $log

      - name: Assert dry-run preserved repository state
        if: steps.target.outputs.execute == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:TARGET_PR" | ConvertFrom-Json
          if ([bool]$pr.merged -or [string]$pr.state -ne 'open') { throw 'Promotion dry-run changed PR merge/state.' }
          if ([string]$pr.head.sha -ne $env:TARGET_SHA) { throw 'Promotion dry-run changed PR head SHA.' }
          $tagExists = $true
          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v0.1.0" *> $null
            $code = $LASTEXITCODE
            if ($code -ne 0) { $tagExists = $false }
          }
          finally {
            $ErrorActionPreference = $previous
          }
          if ($tagExists) { throw 'Tag v0.1.0 exists after dry-run; dry-run contract violated.' }
          Write-Host 'No merge, release, promotion side effect or tag was observed.'

      - name: Stage bootstrap evidence
        if: always()
        shell: pwsh
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          EXECUTE: ${{ steps.target.outputs.execute }}
          PHASE: ${{ steps.target.outputs.phase }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'pr8-promotion-dry-run-bootstrap-evidence'
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $validationReport = $null
          if ($env:EXECUTE -eq 'true' -and $env:TARGET_SHA -match '^[0-9a-f]{40}$') {
            $validationRoot = Join-Path $env:LOCALAPPDATA ("DDDA\validation-reports\pr-8-{0}" -f $env:TARGET_SHA)
            if (Test-Path -LiteralPath $validationRoot -PathType Container) {
              $reports = @(Get-ChildItem -LiteralPath $validationRoot -Filter result.json -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending)
              if ($reports.Count -gt 0) {
                $validationReport = $reports[0].FullName
                Copy-Item -LiteralPath $validationReport -Destination (Join-Path $evidenceRoot 'validate-pr-result.json') -Force
              }
            }
            $promotionLog = Join-Path $env:RUNNER_TEMP 'pr8-promotion-dry-run.log'
            if (Test-Path -LiteralPath $promotionLog -PathType Leaf) {
              Copy-Item -LiteralPath $promotionLog -Destination $evidenceRoot -Force
            }
          }
          [ordered]@{
            schema_version = 1
            purpose = 'PR8 bounded promotion dry-run bootstrap'
            repository = $env:GITHUB_REPOSITORY
            target_pr = 8
            target_version = '0.1.0'
            staging_sha = $env:STAGING_HEAD_SHA
            target_sha = $env:TARGET_SHA
            phase = $env:PHASE
            executed = ($env:EXECUTE -eq 'true')
            validation_report = $validationReport
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            forbidden_operations = @('merge','promotion','release','tag','force-push')
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $evidenceRoot 'bootstrap-evidence.json') -Encoding UTF8

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8-promotion-dry-run-bootstrap-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr8-promotion-dry-run-bootstrap-evidence/**
          if-no-files-found: error
          retention-days: 30

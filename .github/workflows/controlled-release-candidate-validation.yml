name: Controlled release-candidate validation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact candidate operation; never publishes a release.
        required: true
        default: technical_validation
        type: choice
        options:
          - technical_validation
          - publish_hrdr_scaffold
          - release_scope_dry_run
      candidate_pr:
        description: Open Draft controlled release-candidate PR number.
        required: true
        default: "103"
        type: string
      source_sha:
        description: Exact 40-character controlled candidate SHA.
        required: true
        type: string
      version:
        description: Release version without v prefix.
        required: true
        default: "0.1.1"
        type: string
      reviewer:
        description: GitHub login, required only to publish a pending HRDR scaffold.
        required: false
        type: string
      decision_owner:
        description: GitHub login, required only to publish a pending HRDR scaffold.
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: controlled-release-candidate-${{ inputs.candidate_pr }}-${{ inputs.source_sha }}-${{ inputs.operation }}
  cancel-in-progress: false

env:
  REPOSITORY: ${{ github.repository }}
  CANDIDATE_PR: ${{ inputs.candidate_pr }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  VERSION: ${{ inputs.version }}
  OPERATION: ${{ inputs.operation }}

jobs:
  select:
    name: Select exact controlled candidate
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.selection.outputs.source_sha }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Read live candidate identity
        id: selection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "repos/$env:REPOSITORY/pulls/$env:CANDIDATE_PR" > candidate-pr.json
          python .\scripts\platform\Test-DDDAControlledReleaseCandidate.py `
            --repository $env:REPOSITORY `
            --pr ([int]$env:CANDIDATE_PR) `
            --source-sha $env:SOURCE_SHA `
            --version $env:VERSION `
            --operation $env:OPERATION `
            --pr-json candidate-pr.json `
            --output selection.json
          "source_sha=$env:SOURCE_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: controlled-candidate-selection-${{ env.CANDIDATE_PR }}-${{ env.SOURCE_SHA }}
          path: |
            candidate-pr.json
            selection.json
          if-no-files-found: error
          retention-days: 14

  technical-validation:
    name: Exact controlled candidate validation
    needs: select
    if: inputs.operation == 'technical_validation'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.source_sha }}
          path: candidate

      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git -C candidate rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Candidate checkout SHA '$actual' does not match requested SHA '$env:SOURCE_SHA'."
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run source-level validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\candidate\ddda.ps1 doctor
          .\candidate\ddda.ps1 test -Suite lint -NonInteractive
          .\candidate\ddda.ps1 test -Suite schema -NonInteractive
          .\candidate\ddda.ps1 test -Suite unit -NonInteractive
          .\candidate\ddda.ps1 test -Suite component -PrePromotionCandidate -NonInteractive
          .\candidate\ddda.ps1 test -Suite regression -NonInteractive
          .\candidate\ddda.ps1 test -Suite security -NonInteractive

      - name: Run exact validate-pr through the canonical package path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\candidate\ddda.ps1 validate-pr `
            -Pr ([int]$env:CANDIDATE_PR) `
            -CleanupOnFailure `
            -PrePromotionCandidate `
            -NonInteractive

      - name: Stage exact validation evidence
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:LOCALAPPDATA 'DDDA'
          $stageRoot = Join-Path $env:RUNNER_TEMP 'controlled-candidate-evidence'
          $reportRoot = Join-Path $sourceRoot "validation-reports/pr-$env:CANDIDATE_PR-$env:SOURCE_SHA"
          $packageRoot = Join-Path $sourceRoot 'packages'

          if (-not (Test-Path -LiteralPath $reportRoot -PathType Container)) {
            throw "Exact validation report root was not produced: $reportRoot"
          }
          $reports = @(Get-ChildItem -LiteralPath $reportRoot -Filter 'result.json' -File -Recurse)
          if ($reports.Count -ne 1) {
            throw "Expected exactly one exact validation report for PR $env:CANDIDATE_PR / $env:SOURCE_SHA, found $($reports.Count)."
          }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding utf8 | ConvertFrom-Json
          if (
            [string]$report.status -ne 'PASS' -or
            [string]$report.source.repository -ne $env:REPOSITORY -or
            [int]$report.source.pr -ne [int]$env:CANDIDATE_PR -or
            [string]$report.source.commit -ne $env:SOURCE_SHA
          ) {
            throw 'Exact validation report identity is invalid.'
          }
          $reportedPackagePath = [string]$report.package.path
          $expectedPackageHash = [string]$report.package.sha256
          $packageName = [System.IO.Path]::GetFileName($reportedPackagePath)
          if (
            [string]::IsNullOrWhiteSpace($packageName) -or
            $packageName -notmatch ('^ddda-candidate-pr-' + [regex]::Escape($env:CANDIDATE_PR) + '-[0-9a-f]{12}-.*\\.zip

      - name: Upload validation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-candidate-validation-${{ env.CANDIDATE_PR }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/controlled-candidate-evidence/**
          if-no-files-found: error
          retention-days: 14

  publish-hrdr-scaffold:
    name: Publish pending HRDR scaffold
    needs: select
    if: inputs.operation == 'publish_hrdr_scaffold'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWER: ${{ inputs.reviewer }}
      DECISION_OWNER: ${{ inputs.decision_owner }}
    steps:
      - name: Require explicit owner inputs
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REVIEWER) -or [string]::IsNullOrWhiteSpace($env:DECISION_OWNER)) {
            throw 'reviewer and decision_owner are required for a pending HRDR scaffold.'
          }

      - name: Checkout exact controlled candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: control-plane

      - name: Checkout exact controlled candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.source_sha }}
          path: candidate

      - name: Read live candidate identity
        shell: pwsh
        run: |
          gh api "repos/$env:REPOSITORY/pulls/$env:CANDIDATE_PR" > candidate-pr.json

      - name: Restore exact technical evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = "controlled-candidate-validation-$env:CANDIDATE_PR-$env:SOURCE_SHA"
          $all = gh api --paginate "repos/$env:REPOSITORY/actions/artifacts?per_page=100" | ConvertFrom-Json
          $matches = @($all.artifacts | Where-Object { $_.name -eq $artifactName -and -not $_.expired })
          if ($matches.Count -ne 1) { throw "Expected exactly one unexpired exact validation artifact '$artifactName', found $($matches.Count)." }
          gh api -H "Accept: application/vnd.github+json" "repos/$env:REPOSITORY/actions/artifacts/$($matches[0].id)/zip" > validation-evidence.zip
          Expand-Archive -LiteralPath validation-evidence.zip -DestinationPath validation-evidence -Force
          $reports = @(Get-ChildItem validation-evidence -Filter result.json -File -Recurse)
          $packages = @(Get-ChildItem validation-evidence -Filter "ddda-candidate-pr-$env:CANDIDATE_PR-$env:SOURCE_SHA-*.zip" -File -Recurse)
          if ($reports.Count -ne 1 -or $packages.Count -ne 1) { throw "Exact validation artifact must contain exactly one report and one canonical candidate package." }
          "validation_report=$($reports[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "candidate_package=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify restored exact evidence
        shell: pwsh
        run: |
          python .\control-plane\scripts\platform\Test-DDDAControlledReleaseCandidate.py `
            --repository $env:REPOSITORY `
            --pr ([int]$env:CANDIDATE_PR) `
            --source-sha $env:SOURCE_SHA `
            --version $env:VERSION `
            --operation $env:OPERATION `
            --pr-json candidate-pr.json `
            --validation-report $env:validation_report `
            --candidate-package $env:candidate_package `
            --output restored-evidence.json

      - name: Publish pending scaffold only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\control-plane\ddda.ps1 review-pr `
            -Pr ([int]$env:CANDIDATE_PR) `
            -Version $env:VERSION `
            -Reviewer $env:REVIEWER `
            -DecisionOwner $env:DECISION_OWNER `
            -ValidationReportPath $env:validation_report `
            -CandidatePackagePath $env:candidate_package `
            -PublishScaffold

  release-scope-dry-run:
    name: Physical Release Scope Gate dry-run
    needs: select
    if: inputs.operation == 'release_scope_dry_run'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DDDA_GITHUB_PROJECT_TOKEN: ${{ secrets.DDDA_GITHUB_PROJECT_TOKEN }}
    steps:
      - name: Require Project read credential
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DDDA_GITHUB_PROJECT_TOKEN)) {
            throw 'DDDA_GITHUB_PROJECT_TOKEN is required for the authoritative read-only Release Scope Gate.'
          }

      - name: Checkout exact controlled candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: control-plane

      - name: Checkout exact controlled candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select.outputs.source_sha }}
          path: candidate

      - name: Read live candidate identity
        shell: pwsh
        run: |
          gh api "repos/$env:REPOSITORY/pulls/$env:CANDIDATE_PR" > candidate-pr.json

      - name: Restore exact technical evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = "controlled-candidate-validation-$env:CANDIDATE_PR-$env:SOURCE_SHA"
          $all = gh api --paginate "repos/$env:REPOSITORY/actions/artifacts?per_page=100" | ConvertFrom-Json
          $matches = @($all.artifacts | Where-Object { $_.name -eq $artifactName -and -not $_.expired })
          if ($matches.Count -ne 1) { throw "Expected exactly one unexpired exact validation artifact '$artifactName', found $($matches.Count)." }
          gh api -H "Accept: application/vnd.github+json" "repos/$env:REPOSITORY/actions/artifacts/$($matches[0].id)/zip" > validation-evidence.zip
          Expand-Archive -LiteralPath validation-evidence.zip -DestinationPath validation-evidence -Force
          $reports = @(Get-ChildItem validation-evidence -Filter result.json -File -Recurse)
          $packages = @(Get-ChildItem validation-evidence -Filter "ddda-candidate-pr-$env:CANDIDATE_PR-$env:SOURCE_SHA-*.zip" -File -Recurse)
          if ($reports.Count -ne 1 -or $packages.Count -ne 1) { throw "Exact validation artifact must contain exactly one report and one canonical candidate package." }
          "validation_report=$($reports[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "candidate_package=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Read exact Human Release Decision Record
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh api --paginate "repos/$env:REPOSITORY/issues/$env:CANDIDATE_PR/comments?per_page=100" > hrdr-comments.json
          python .\control-plane\scripts\platform\Read-DDDAHrdr.py --comments-json hrdr-comments.json --output hrdr.json

      - name: Run Physical Release Scope Gate only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .\control-plane\scripts\platform\Test-DDDAControlledReleaseCandidate.py `
            --repository $env:REPOSITORY `
            --pr ([int]$env:CANDIDATE_PR) `
            --source-sha $env:SOURCE_SHA `
            --version $env:VERSION `
            --operation $env:OPERATION `
            --pr-json candidate-pr.json `
            --validation-report $env:validation_report `
            --candidate-package $env:candidate_package `
            --output restored-evidence.json
          $evidence = Get-Content restored-evidence.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ($evidence.status -ne 'PASS') { throw 'Restored exact candidate evidence did not pass.' }
          python .\control-plane\scripts\platform\Test-DDDAReleaseScope.py `
            --repository $env:REPOSITORY `
            --pr ([int]$env:CANDIDATE_PR) `
            --source-sha $env:SOURCE_SHA `
            --candidate-sha256 $evidence.validation_evidence.candidate_package_sha256 `
            --version $env:VERSION `
            --hrdr hrdr.json `
            --output physical-release-scope.json

      - name: Upload scope-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-candidate-scope-gate-${{ env.CANDIDATE_PR }}-${{ env.SOURCE_SHA }}
          path: |
            restored-evidence.json
            hrdr.json
            physical-release-scope.json
          if-no-files-found: warn
          retention-days: 14
) -or
            $expectedPackageHash -notmatch '^[0-9a-f]{64}

      - name: Upload validation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-candidate-validation-${{ env.CANDIDATE_PR }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/controlled-candidate-evidence/**
          if-no-files-found: error
          retention-days: 14


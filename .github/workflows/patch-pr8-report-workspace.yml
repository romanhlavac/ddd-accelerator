name: Patch PR8 Validation Report Workspace

on:
  push:
    branches:
      - feat/project-steering-and-documentation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-steering-and-documentation
          fetch-depth: 0
      - name: Record validation run workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/platform/Invoke-DDDAValidatePr.ps1')
          text = path.read_text(encoding='utf-8-sig')
          old = '''        SuitesJsonPath = $suitesPath
                  OutputRoot = $reportRoot
                  Diagnostics = @($diagnostics)'''.replace('                  ', '')
          new = '''        SuitesJsonPath = $suitesPath
                  OutputRoot = $reportRoot
                  Workspace = $validationRoot
                  Diagnostics = @($diagnostics)'''.replace('                  ', '')
          if text.count(old) != 1:
              raise SystemExit('Expected validation report argument block was not found exactly once.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8-sig', newline='\n')
          PY
          git config user.name 'DDDA Lifecycle Bot'
          git config user.email 'ddda-lifecycle@example.invalid'
          git add scripts/platform/Invoke-DDDAValidatePr.ps1
          git diff --cached --check
          git commit -m 'fix: record validation run workspace in report'
          git push origin HEAD:feat/project-steering-and-documentation

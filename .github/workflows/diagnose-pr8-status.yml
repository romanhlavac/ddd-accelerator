name: Diagnose PR8 Status

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-51-status:
    runs-on: windows-latest
    steps:
      - name: Download source and run compact steering diagnostic
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/zipball/$env:SOURCE_SHA" -OutFile source.zip
          Expand-Archive source.zip -DestinationPath source
          $root = (Get-ChildItem source -Directory | Select-Object -First 1).FullName
          git -C $root init -q
          git -C $root config core.autocrlf false
          git -C $root config user.name "DDDA Diagnostic"
          git -C $root config user.email "ddda-diagnostic@example.invalid"
          git -C $root add -A 2>$null
          git -C $root commit -qm baseline
          $output = @()
          try {
            $output = @(& (Join-Path $root "tests/powershell/Test-DDDAProjectSteering.ps1") -PlatformPath $root 6>&1 5>&1 4>&1 3>&1 2>&1)
            $code = $LASTEXITCODE
          }
          catch {
            $output += ($_ | Out-String)
            $code = 1
          }
          if ($code -ne 0) {
            $output | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
            exit $code
          }
          Write-Host 'PR8 Windows PowerShell 5.1 status diagnostic: PASS'

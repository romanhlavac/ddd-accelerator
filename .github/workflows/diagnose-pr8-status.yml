name: Diagnose PR8 Status

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-51-status:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run steering test and print compact failure
        shell: powershell
        run: |
          $output = @()
          try {
            $output = @(./tests/powershell/Test-DDDAProjectSteering.ps1 -PlatformPath $PWD 6>&1 5>&1 4>&1 3>&1 2>&1)
            $code = $LASTEXITCODE
          }
          catch {
            $output += ($_ | Out-String)
            $code = 1
          }
          if ($code -ne 0) {
            $output | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
            exit $code
          }
          Write-Host 'PR8 Windows PowerShell 5.1 status diagnostic: PASS'

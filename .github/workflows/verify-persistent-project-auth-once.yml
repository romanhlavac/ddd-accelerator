name: Verify persistent Project V2 credential once

on:
  push:
    branches:
      - feature/github-native-backlog-governance
    paths:
      - .github/workflows/verify-persistent-project-auth-once.yml

permissions:
  contents: write

jobs:
  verify:
    environment: ddda-backlog-governance
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DDDA_GITHUB_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-native-backlog-governance
          fetch-depth: 0

      - name: Verify credential on fresh runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh auth status --hostname github.com >/dev/null
          project_number="$(gh project list --owner romanhlavac --limit 100 --format json --jq '.projects[] | select(.title=="DDDA Platform Backlog" and (.closed|not)) | .number' | head -n1)"
          test -n "$project_number"
          items="$(gh project item-list "$project_number" --owner romanhlavac --limit 200 --format json)"
          for n in 54 55 56 57; do
            jq -e --argjson n "$n" '.items[] | select(.content.number==$n)' <<<"$items" >/dev/null
          done
          echo 'PERSISTENT_PROJECT_AUTH_FRESH_RUNNER_PASS'

      - name: Self-remove verification workflow
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/verify-persistent-project-auth-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-persistent-project-auth-once.yml
          git commit -m 'test(governance): remove persistent credential verification'
          unset GH_TOKEN
          git push origin HEAD:feature/github-native-backlog-governance

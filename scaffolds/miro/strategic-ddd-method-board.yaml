  title_cs: Jak board používat – rychlý průvodce
  mode: compact_panel_with_detailed_link
  steps_cs:
  - 'Začni v 00 (Control Center): zjisti aktuální stage, gate, blockery a next actions.'
  - V 01 si ověř celou DDD Starter journey, vyšší metodické skupiny a povolené návraty.
  - Přejdi do aktivního pracovního frame uvedeného u aktuální gate.
  - Použij podframe VZOR / LEGENDA jako návod; jeho obsah není projektová evidence.
  - Workshopový obsah konsoliduj do managed YAML artefaktů; Miro zůstává pracovní projekcí.
  - Otevřené otázky, hypotézy a rozhodnutí udržuj dohledatelné ke zdrojům a ownerům.
  - Automatizace může vytvořit ready_for_review, ale gate rozhoduje pouze oprávněný člověk.
  - Po rozhodnutí pokračuj, doplň podmínku, nebo se vrať do dřívější fáze podle nové evidence.
  details_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/product/03-miro-scaffolding.md
  cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/14-inicializace-ciloveho-miro-boardu.md
  method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/01-metodicky-tok-a-gates.md
  starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
  knowledge_index_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/00-knowledge-index.md

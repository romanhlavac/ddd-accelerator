artifact_status_tables:
  title_cs: Stavy artefaktů – synchronizováno z managed YAML
  native_table_support: unavailable_in_miro_rest_v2
  rendering: deterministic_grid
  statuses:
  - id: empty
    label_cs: SCAFFOLD
    aliases:
    - empty
  - id: generated
    label_cs: GENERATED
    aliases:
    - generated
  - id: workshop
    label_cs: WORKSHOP / CANDIDATE
    aliases:
    - workshop
    - candidate
    - draft
    - observed
  - id: validated
    label_cs: VALIDATED
    aliases:
    - validated
    - ready_for_review
  - id: accepted
    label_cs: ACCEPTED
    aliases:
    - accepted
    - passed
  - id: superseded
    label_cs: SUPERSEDED
    aliases:
    - superseded
    - deleted_pending
  columns:
  - artefakt
  - fáze
  - stav
  max_rows_per_status: 4
zone_transitions:
- id: understand-strategic
  from: zone-understand

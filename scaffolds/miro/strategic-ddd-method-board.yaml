- id: strategic-organization
  from: zone-strategic
  to: zone-organization
  label_cs: hranice → týmové ownership
  shape: straight
- id: organization-tactical
  from: zone-organization
  to: zone-tactical
  label_cs: ownership → detail a implementace
  shape: straight

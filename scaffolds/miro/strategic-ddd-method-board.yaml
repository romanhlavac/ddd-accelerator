rendering:
  include_method_spine: true
  include_gate_markers: true
  include_frame_numbers: true
  include_status_badges: true
  include_yaml_path_footer: true
  include_git_revision_footer: true
  create_mermaid_analogues: true
  mermaid_output_directory: artifacts/diagrams
  include_control_center: true
  include_zone_headers: true
  include_traceability: true
  human_visual_acceptance: required
gate_states:
- id: not_ready
  label_cs: NOT READY
  symbol: ⛔
  meaning_cs: Chybí povinná evidence nebo owner; nelze reviewovat.
  fill_color: '#FDE2E1'
- id: ready_for_review
  label_cs: READY FOR REVIEW
  symbol: ◉
  meaning_cs: Mechanické evidence jsou dostupné; čeká se na lidské rozhodnutí.
  fill_color: '#FFF2CC'
- id: conditional
  label_cs: CONDITIONAL
  symbol: △
  meaning_cs: Lidské rozhodnutí s otevřenou podmínkou, ownerem a termínem; gate
    není dokončena.
  fill_color: '#FCE5CD'
- id: rejected
  label_cs: REJECTED
  symbol: ✕
  meaning_cs: Lidské rozhodnutí gate odmítlo; workflow nepokračuje.
  fill_color: '#F4CCCC'
- id: passed
  label_cs: PASSED
  symbol: ✓
  meaning_cs: Gate byla explicitně schválena oprávněným člověkem.
  fill_color: '#D9EAD3'

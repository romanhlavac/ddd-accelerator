visual_contract:
  overview_frame: method-overview
  minimum_stage_card_width: 3200
  minimum_stage_card_height: 1900
  minimum_work_frame_width: 4800
  minimum_work_frame_height: 3600
  minimum_frame_gap: 600
  minimum_example_items: 3
  guide_anchor: top_left
  require_cookbook_links: true
  require_method_links: true
  require_iteration_transitions: 2
  developer_team_watermark: external_environment_not_rendered_by_ddda
  minimum_stage_visual_items: 4
  require_overview_resources: 4
  require_zone_connectors: 3
  require_example_panel: true
  require_example_sync_ignore: true
  minimum_connector_count: 20
method_transitions:
- id: align-discover
  from: align
  to: discover
  label_cs: sdílený problém → doménový obraz
  kind: forward
  shape: elbowed
- id: discover-decompose
  from: discover
  to: decompose
  label_cs: hotspoty, jazyk a pravidla
  kind: forward
  shape: elbowed
- id: decompose-strategize
  from: decompose
  to: strategize
  label_cs: hypotézy hranic → investiční fokus
  kind: forward
  shape: elbowed
- id: strategize-connect
  from: strategize
  to: connect
  label_cs: klasifikace → vztahy a ownership
  kind: forward
  shape: elbowed
- id: connect-organize
  from: connect
  to: organize
  label_cs: kontexty → týmové ownership
  kind: forward
  shape: elbowed
- id: organize-define
  from: organize
  to: define
  label_cs: ownership → detail BC
  kind: forward
  shape: elbowed
- id: define-code
  from: define
  to: code
  label_cs: validovaný model → implementace
  kind: forward
  shape: elbowed
- id: feedback-discover-align
  from: discover
  to: align
  label_cs: nová evidence může změnit cíl a scope
  kind: feedback
  shape: curved
- id: feedback-define-decompose
  from: define
  to: decompose
  label_cs: detail odhalí chybnou hranici – vrať hypotézu
  kind: feedback
  shape: curved

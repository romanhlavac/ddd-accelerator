schema_version: '2.2'
id: strategic-ddd-method-board
name_cs: DDDA DDD Starter – project steering board
description_cs: Deterministický onboarding, project steering a metodicky věrný workshop board podle DDD
  Starter Modelling Process. Miro je projekce; Git/YAML a explicitní lidské gate decision jsou autorita.
coordinate_system:
  origin: board_center
  unit: miro_canvas_unit
  stage_card:
    width: 3400
    height: 2000
  work_frame:
    width: 6000
    height: 4800
  horizontal_gap: 900
  vertical_gap: 800
  minimum_font_size:
    journey: 34
    stage_example: 24
    gate_legend: 26
    workshop_guide: 26
    workshop_example: 24
    zone_header: 34
localization:
  default_language: cs
  conversation_language: cs
  preserve_domain_terms:
  - EventStorming
  - Big Picture
  - Process Modeling
  - Design Level
  - Bounded Context
  - Context Map
  - Ubiquitous Language
  - Core Domain
  - Supporting Subdomain
  - Generic Subdomain
palette:
  method_primary: '#2F7E95'
  method_secondary: '#365A8C'
  frame_background: '#F8FAFC'
  frame_border: '#64748B'
  event: '#F6A04D'
  temporal_event: '#F6A04D'
  pivot_event_marker: '#F9E27D'
  command_action: '#86C5E8'
  policy_procedure: '#C49ACD'
  read_model: '#C8E986'
  external_system: '#F3B4C4'
  actor: '#F4DC67'
  hotspot: '#E84C3D'
  invariant: '#F8E58C'
  context_boundary: '#DDEFA9'
  team: '#B7D7F0'
  accepted: '#88C999'
  superseded: '#B8BEC7'
artifact_statuses:
- id: empty
  label_cs: Připravený scaffold
  border_style: dashed
- id: generated
  label_cs: Vygenerováno z YAML
  border_style: solid
- id: workshop
  label_cs: Rozpracováno ve workshopu
  border_style: solid
- id: validated
  label_cs: Validováno doménovými experty
  border_style: double
- id: accepted
  label_cs: Přijato
  border_style: double
- id: superseded
  label_cs: Nahrazeno
  border_style: dotted
metadata_contract:
  widget_metadata:
    dd_d_a_id: stabilní UUID artefaktu nebo prvku
    dd_d_a_artifact_type: typ YAML artefaktu
    dd_d_a_source_path: relativní cesta YAML souboru
    dd_d_a_revision: Git commit nebo lokální revize
    dd_d_a_stage: metodická fáze
    dd_d_a_status: stav artefaktu
    dd_d_a_managed: true | false
    dd_d_a_role: project_artifact | example | legend | navigation
    dd_d_a_sync: managed | ignore
    dd_d_a_exclude_from_ingestion: true | false
  merge_ownership:
    semantic_content: yaml
    visual_position_and_size: miro
    workshop_notes_and_hotspots: miro
    identifiers_and_traceability: yaml
    conflict_policy: explicit-review
method_flow:

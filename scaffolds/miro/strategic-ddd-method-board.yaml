    gate_after: G5
    y: -6200
    work_frame: connect-context-map
    visual_template: connect
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/product/04-synchronizace.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/07-integration-and-data-ownership.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
    shape: hexagon
  - id: organize
    order: 60
    title_cs: Organize
    subtitle_cs: Týmy, ownership a interakční režimy
    x: 6750
    gate_after: G6
    y: -6200
    work_frame: organize-teams
    visual_template: organize
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/01-metodicky-tok-a-gates.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/10-team-topologies-and-governance.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
    shape: hexagon
  - id: define
    order: 70
    title_cs: Define
    subtitle_cs: Role a odpovědnosti bounded contexts
    x: 11250
    gate_after: G7
    y: -6200
    work_frame: define-bounded-context
    visual_template: define
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/05-design-level-eventstorming.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/03-ddd-tactical-design.md

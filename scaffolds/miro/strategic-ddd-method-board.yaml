    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
    shape: hexagon
gates:
- id: G1
  label_cs: Cíl a scope jsou připraveny
  required_evidence:
  - business_goals
  - stakeholders
  - scope
  - assumptions
- id: G2
  label_cs: Doménový tok je dostatečně objeven
  required_evidence:
  - event_storming_big_picture
  - glossary
  - hotspots
  - lifecycle_observations
- id: G3
  label_cs: Existují validovatelné hypotézy rozkladu
  required_evidence:
  - process_slices
  - candidate_subdomains
  - candidate_lifecycles
- id: G4
  label_cs: Strategický fokus je přijat
  required_evidence:
  - subdomain_classification
  - investment_rationale
- id: G5
  label_cs: Vztahy a vlastnictví jsou explicitní
  required_evidence:
  - context_map
  - data_ownership
  - integration_contract_hypotheses
- id: G6
  label_cs: Týmové ownership je proveditelné
  required_evidence:
  - team_topology
  - interaction_modes
  - cognitive_load_risks
- id: G7
  label_cs: Bounded contexts jsou připraveny pro detailní návrh
  required_evidence:
  - bounded_context_canvases
  - design_level_event_storming
  - validated_lifecycle_models
  - quality_attribute_scenarios
- id: G8
  label_cs: Taktický návrh je implementovatelný
  required_evidence:
  - aggregates_and_invariants
  - domain_events
  - architecture_decisions
  - implementation_views
frames:
- id: control-center
  stage: control
  title_cs: 00 – Navigace, legenda a stav artefaktů (Control Center)
  x: -11000
  y: 4500
  width: 7000
  height: 6000
  scaffold:
  - board_index
  - method_flow_legend
  - artifact_status_legend
  - event_storming_legend
  - open_questions
  - sync_status
  purpose_cs: Orientace, stav, rozhodovací otázka, blokery a nejmenší další krok.
  example_template: navigation
  guide:
    start_cs: Najdi aktuální gate, rozhodovací otázku a nejmenší další krok.
    outputs_cs: Aktuální stav, gate legenda, blokery a next actions.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/17-status-gates-a-dalsi-krok.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/01-metodicky-tok-a-gates.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/
- id: method-overview
  role: overview
  stage: overview
  title_cs: 01 – DDD Starter journey, gates a iterace
  x: 0
  y: -5000
  width: 40000
  height: 13000
  scaffold:
  - method_flow_legend
  purpose_cs: Čitelná navigační mapa metodiky s gate stavy, situačními mini-vzory a povolenými návraty.
- id: align-intake
  stage: align
  title_cs: 10 – Align / Intake
  x: -11000
  y: 11500
  width: 6000
  height: 4800
  scaffold:
  - project_charter
  - business_goals
  - user_needs
  - stakeholders
  - scope_and_out_of_scope
  - assumptions_and_constraints
  - success_metrics
  purpose_cs: Vyjasnit business problém, cíl, scope, aktéry a oprávnění rozhodnout.
  example_template: align
  guide:
    start_cs: Začni business problémem a rozhodnutím, které má projekt umožnit.
    outputs_cs: Project charter, scope, success metrics a konkrétní decision owner.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/16-zalozeni-rizeneho-projektu.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/01-metodicky-tok-a-gates.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: discover-big-picture-es
  stage: discover
  title_cs: '20 – EventStorming: Big Picture'
  x: -11000
  y: 17000
  width: 6500
  height: 4800
  mandatory: true
  visual_rules:
    timeline: horizontal
    legend_position: left
    hotspot_lane: top
    temporal_and_pivot_markers: true
    free_exploration_area: true
  scaffold:
  - event_timeline
  - temporal_events
  - pivot_events
  - actors_and_systems
  - hotspots
  - questions
  - value_up_down_markers
  purpose_cs: Vytvořit sdílený obraz doménového dění, jazyka, pravidel a hotspotů.
  example_template: big_picture
  guide:
    start_cs: S doménovými experty rozlož dění v čase od událostí a hotspotů.
    outputs_cs: Big Picture, pivoty, hotspoty, otázky a první ubiquitous language.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/03-big-picture-eventstorming.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/03-eventstorming-facilitace.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: discover-evidence
  stage: discover
  title_cs: 21 – Zdroje, slovník a pozorované stavy
  x: -14000
  y: 22500
  width: 5000
  height: 3800
  scaffold:
  - source_inventory
  - domain_glossary
  - actors_and_systems
  - observed_lifecycle_snapshots
  - contradictions
  - unanswered_questions
  purpose_cs: Vytvořit sdílený obraz doménového dění, jazyka, pravidel a hotspotů.
  example_template: evidence
  guide:
    start_cs: Sesbírej zdroje, rozpory, termíny a pozorované stavy.
    outputs_cs: Source inventory, glossary, contradictions a unanswered questions.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/03-big-picture-eventstorming.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/02-ddd-strategic-design.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: discover-process-modeling
  stage: discover
  title_cs: '22 – EventStorming: Process Modeling'
  x: -8000
  y: 22500
  width: 5000
  height: 3800
  mandatory: false
  entry_criteria:
  - selected_business_flow
  - big_picture_segment
  visual_rules:
    sequence: actor → command/action → policy/procedure → system → event → read model
    legend_position: left
    process_rows: true
  scaffold:
  - selected_process_slices
  - commands_actions
  - policies_procedures
  - read_models
  - external_systems
  - events
  - hotspots
  purpose_cs: Vytvořit sdílený obraz doménového dění, jazyka, pravidel a hotspotů.
  example_template: process
  guide:
    start_cs: Vyber hodnotný nebo problematický procesní slice.
    outputs_cs: Actor-command-policy-event-read model tok a hotspoty.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/04-process-modeling.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/03-eventstorming-facilitace.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: decompose-domain
  stage: decompose
  title_cs: 30 – Rozklad domény
  x: -2500
  y: 4500
  width: 6000
  height: 4800
  scaffold:
  - business_capability_candidates
  - candidate_subdomains
  - language_and_rule_clusters
  - change_coupling_clusters
  - candidate_bounded_contexts
  - decomposition_rationale
  purpose_cs: Formulovat a porovnat hypotézy doménových hranic.
  example_template: decompose
  guide:
    start_cs: Clusteruj jazyk, pravidla, lifecycle a změnový coupling.
    outputs_cs: Kandidátní subdomény, BC hranice, alternativy a rationale.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/06-stavove-modely.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/02-ddd-strategic-design.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: decompose-lifecycles
  stage: decompose
  title_cs: 31 – Kandidátní životní cykly a stavové modely
  x: -2500
  y: 10000
  width: 5000
  height: 3800
  mandatory: true
  visual_rules:
    one_model_per_key_domain_object: true
    distinguish_fact_from_hypothesis: true
    show_forbidden_transitions: true
    show_command_and_resulting_event: true
    show_invariant_on_transition: true
  scaffold:
  - state_inventory
  - candidate_state_transition_diagrams
  - forbidden_transitions
  - lifecycle_owners
  - lifecycle_questions
  purpose_cs: Formulovat a porovnat hypotézy doménových hranic.
  example_template: lifecycle
  guide:
    start_cs: Vyber klíčové doménové objekty s netriviálním lifecycle.
    outputs_cs: Stavy, přechody, zakázané přechody, invarianty a owners.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/06-stavove-modely.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/03-ddd-tactical-design.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: strategize-classification
  stage: strategize
  title_cs: 40 – Strategická klasifikace
  x: -2500
  y: 15500
  width: 6000
  height: 4800
  scaffold:
  - core_supporting_generic_matrix
  - differentiation_vs_complexity
  - build_buy_partner_retire
  - investment_rationale
  - optional_wardley_map
  purpose_cs: Určit diferenciaci, investiční fokus a build/buy/SaaS přístup.
  example_template: strategize
  guide:
    start_cs: Porovnej diferenciaci, komplexitu a evoluční fázi capability.
    outputs_cs: Core/supporting/generic, investiční rationale a build/buy/SaaS.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/01-metodicky-tok-a-gates.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/02-ddd-strategic-design.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: connect-context-map
  stage: connect
  title_cs: 50 – Context Map a data ownership
  x: -2500
  y: 27500
  width: 6000
  height: 4800
  scaffold:
  - bounded_context_map
  - upstream_downstream
  - context_mapping_patterns
  - source_of_truth
  - integration_contracts
  - acl_and_translation
  - integration_risks
  purpose_cs: Zviditelnit vztahy bounded contexts, data ownership a kontrakty.
  example_template: context_map
  guide:
    start_cs: Nakresli explicitní vztahy mezi bounded contexts.
    outputs_cs: Upstream/downstream, data ownership, kontrakty, ACL a rizika.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/product/04-synchronizace.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/07-integration-and-data-ownership.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: organize-teams
  stage: organize
  title_cs: 60 – Team Topologies
  x: 5000
  y: 4500
  width: 6000
  height: 4800
  scaffold:
  - stream_aligned_ownership
  - platform_and_enabling_support
  - complicated_subsystem_candidates
  - interaction_modes
  - cognitive_load
  - governance_guardrails
  purpose_cs: Sladit ownership se strukturou týmů a cognitive load.
  example_template: teams
  guide:
    start_cs: Přiřaď ownership reálným týmům a ověř cognitive load.
    outputs_cs: Team Topologies typ, ownership a interaction mode.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/methodology/01-metodicky-tok-a-gates.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/10-team-topologies-and-governance.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: define-bounded-context
  stage: define
  title_cs: 70 – Bounded Context Canvases
  x: 13000
  y: 4500
  width: 6000
  height: 4800
  repeat_for: bounded_context
  scaffold:
  - purpose
  - strategic_classification
  - domain_roles
  - ubiquitous_language
  - business_decisions
  - inbound_communication
  - outbound_communication
  - assumptions
  - verification_metrics
  - open_questions
  purpose_cs: Vymezit bounded context pro detailní návrh a validaci.
  example_template: bc_canvas
  guide:
    start_cs: Vyplň canvas pro vybraný bounded context.
    outputs_cs: Purpose, jazyk, business decisions, komunikace a assumptions.
    cookbook_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/docs/cookbooks/05-design-level-eventstorming.md
    method_url: https://github.com/romanhlavac/ddd-accelerator/blob/main/knowledge/02-ddd-strategic-design.md
    starter_reference_url: https://ddd-crew.github.io/ddd-starter-modelling-process/#kicking-off-a-major-program-of-work
- id: define-design-level-es
  stage: define
  title_cs: '71 – EventStorming: Design Level'
  x: 13000
  y: 10000
  width: 6000
  height: 4800
  repeat_for: selected_bounded_context
  mandatory_for:
  - core
  - complex_supporting
  visual_rules:
    sequence: actor → command/action → policy/procedure → aggregate/system → event → projection
    invariants_visible: true
    aggregate_candidates_visible: true
    no_cross_context_transaction: true
  scaffold:
  - commands
  - policies
  - aggregate_candidates
  - invariants
  - domain_events
  - read_models
  - external_dependencies
  - hotspots
  purpose_cs: Vymezit bounded context pro detailní návrh a validaci.
  example_template: design_es
  guide:
    start_cs: Modeluj detail pouze uvnitř jednoho BC.
    outputs_cs: Commands, policies, aggregate candidates, invariants a events.

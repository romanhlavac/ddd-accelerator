    x: 3500
    y: 4450
    width: 5700
    font_size: 48
    content: '<p><strong>3 artefakty</strong> · SCAFFOLD 1 · WORKING 2 · ATTENTION 1 · BLOCKING 0</p><p><a href="https://github.com/romanhlavac/ddd-accelerator/blob/feat/project-steering-and-documentation/examples/minimal/projects/acceptance-claims-modernization/docs/artifacts/index.md">OTEVŘÍT PROJEKTOVÝ ARTIFACT REGISTRY →</a></p><p>Project-owned Git/YAML je source of truth. Tato projekce ani technický PASS neschvalují gate.</p>'
  - id: '3458764679756523140'

    width: 3000
    font_size: 64
    content: '<p><strong>CONTROL CENTER — začněte zde</strong></p><p>Tento projekt modernizuje vyhodnocování pojistných událostí. Cílem je zpřístupnit rozhodovací pravidla, zrychlit bezpečnou změnu a umožnit vysvětlitelné rozhodnutí.</p>'
  - id: '3458764679756505810'
    type: text
    frame: control
    x: 5200
    y: 700
    width: 3000
    font_size: 36
    content: '<p><strong>Jak board použít poprvé</strong></p><p>1. Přečtěte aktuální stav a otázku rozhodnutí. 2. Otevřete zvýrazněnou fázi ve framu 01. 3. Doplňte evidence v pracovním framu. 4. Oprávněný člověk zapíše rozhodnutí do Git decision recordu. Miro ani technický PASS gate neschvalují.</p>'

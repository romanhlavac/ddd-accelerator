    x: 2600
    y: 250
    width: 4500
    font_size: 48
    content: '<p><strong>01 — DDD STARTER JOURNEY</strong></p><p>Čtěte zleva doprava. Velký referenční obraz ukazuje celou cestu a pin zvýrazňuje aktuální fázi. Karta pod ním vysvětluje rozhodovací gate; spodní prvky ukazují pracovní jazyk.</p>'
  - id: '3458764679756523198'

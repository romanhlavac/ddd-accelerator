    content: '<p><strong>3 ARTEFAKTY</strong></p><p><br /></p><p>Summary maturity:</p><p><strong>SCAFFOLD: 1</strong><br /><strong>WORKING: 2</strong><br />…<br /><strong>SUPERSEDED: 0</strong></p><p>Summary review flagů:</p><p><strong>🟧 ATTENTION: 1</strong><br /><strong>🟩 BLOCKING: 0</strong></p>'
  - id: '3458764679756523220'
    type: text
    frame: control
    x: 3500
    y: 4820
    width: 6300
    font_size: 28
    style:
      color: '#1F3B64'
      textAlign: left
    content: '<p><strong>MATURITY:</strong> světlejší modrá = ranější úroveň; tmavší modrá = pokročilejší úroveň. <strong>REVIEW FLAGS:</strong> 🟧 ATTENTION vyžaduje lidskou kontrolu nebo doplnění, ale nemusí zastavit gate. 🟩 BLOCKING = 0 znamená bez blockeru; 🟥 BLOCKING &gt; 0 znamená zastavit postup.</p>'

    x: 3500
    y: 3800
    width: 6400
    height: 1900
    font_size: 48
    content: '<p><strong>ARTIFACT HEALTH — acceptance-claims-modernization</strong></p><p><strong>MATURITY:</strong> <strong>SCAFFOLD</strong> je výchozí struktura; <strong>WORKING</strong> se doplňuje; <strong>CANDIDATE</strong> čeká na review; <strong>VALIDATED</strong> prošel kontrolou; <strong>ACCEPTED</strong> vyžaduje explicitní lidské přijetí; <strong>SUPERSEDED</strong> byl nahrazen.</p><p><strong>ATTENTION</strong> znamená nutnost lidské kontroly nebo doplnění. Neznamená automaticky blokaci. Tu vyjadřuje pouze explicitní <strong>BLOCKING</strong> položka.</p>'
  - id: '3458764679756523219'
    type: shape
    frame: control
    x: 3500
    y: 3100
    width: 5800
    height: 500
    font_size: 64

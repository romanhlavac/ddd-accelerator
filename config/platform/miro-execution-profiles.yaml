schema_version: 2
contract: ddda-miro-execution-profiles
status: active

principles:
  deterministic_transport: rest-api
  mcp_role: interactive-ai-control-plane
  mcp_required_for_technical_gate: false
  raw_tokens_in_git: forbidden
  credential_indirection: env-or-secret-name-only
  technical_evidence_source: github-actions-exact-sha
  active_development_profiles:
    - platform_lab
    - github_ci
    - hvr
  deferred_profiles:
    - example_project
    - project_runtime

profiles:
  platform_lab:
    enabled: true
    purpose: persistent DDDA platform fast-loop and remediation target
    transport: rest-api
    identity_ref_env: DDDA_MIRO_PLATFORM_LAB_IDENTITY
    access_token_secret: MIRO_PLATFORM_LAB_ACCESS_TOKEN
    team_id_env: DDDA_MIRO_PLATFORM_LAB_TEAM_ID
    board_id_env: DDDA_MIRO_PLATFORM_LAB_BOARD_ID
    board_name: DDDA_PLATFORM_LAB
    current_board_id_fallback: uXjVH0doLYY=
    lifecycle: persistent
    cleanup_scope: managed-items-only
    single_writer: true
    mcp_required: false

  github_ci:
    enabled: true
    purpose: authoritative deterministic GitHub Actions Miro validation target
    transport: rest-api
    identity_ref_env: DDDA_MIRO_GH_CI_IDENTITY
    access_token_secret: MIRO_GH_CI_ACCESS_TOKEN
    team_id_env: DDDA_MIRO_GH_CI_TEAM_ID
    board_id_env: DDDA_MIRO_GH_CI_BOARD_ID
    board_name: DDDA_GH_CI
    current_board_id_fallback: uXjVHy7iQD4=
    lifecycle: persistent
    reset_policy: clear-all-items-before-run
    ownership: machine-only
    mcp_allowed: false

  hvr:
    enabled: true
    purpose: dedicated Human Visual Review materialization target
    transport: rest-api
    identity_ref_env: DDDA_MIRO_HVR_IDENTITY
    access_token_secret: MIRO_HVR_ACCESS_TOKEN
    team_id_env: DDDA_MIRO_HVR_TEAM_ID
    board_id_env: DDDA_MIRO_HVR_BOARD_ID
    board_name: DDDA_HVR
    board_resolution: exact-name
    source_profile: platform_lab
    materialization: replace-by-server-side-board-copy
    lifecycle: logical-persistent-slot
    technical_pass_requires_mcp: false
    human_review_channels:
      - miro-gui
      - screenshot
      - mcp-when-available

  mcp:
    enabled: true
    purpose: optional interactive ChatGPT Miro access during platform development
    transport: mcp
    identity_ref_env: DDDA_MIRO_MCP_IDENTITY
    credential_provider: external-oauth-connector
    token_in_repository: forbidden
    token_in_github_secrets: not-required
    budgeted: true
    technical_gate_required: false

  example_project:
    enabled: false
    activation_phase: platform-deployment-and-initialization
    purpose: populated example project proving installed/released platform usability
    transport: rest-api
    configuration_status: deferred
    board_creation: create-if-missing-when-activated

  project_runtime:
    enabled: false
    activation_phase: per-project-deployment-and-initialization
    purpose: per-DDDA-project Cursor runtime Miro integration
    transport: rest-api
    configuration_status: contract-only
    configuration_source: project.yaml
    identity_ref_field: miro.identity_ref
    access_token_env_field: miro.access_token_env
    team_id_field: miro.team_id
    team_id_env_field: miro.team_id_env
    space_id_field: miro.project_id
    space_id_env_field: miro.project_id_env
    board_id_field: miro.board_id
    board_id_env_field: miro.board_id_env
    board_creation: create-if-missing-when-activated
    board_name_pattern: "DDDA – {project.name}"
    mcp_optional: true

migration:
  pr8:
    legacy_secret_fallback_allowed: false
    platform_lab_board_bootstrap: uXjVH0doLYY=
    github_ci_board_bootstrap: uXjVHy7iQD4=
    hvr_board_bootstrap_name: DDDA_HVR
    exact_active_secrets:
      - MIRO_PLATFORM_LAB_ACCESS_TOKEN
      - MIRO_GH_CI_ACCESS_TOKEN
      - MIRO_HVR_ACCESS_TOKEN
    hvr2_previous_evidence: superseded-by-three-profile-binding

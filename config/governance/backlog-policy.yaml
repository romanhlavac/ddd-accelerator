priority_semantics:
  P0: release_safety_or_data_integrity_blocker
  P1: highest_active_product_priority
  P2: important_planned_increment
  P3: long_term_or_opportunistic

branch_naming:
  feature: 'feature/<issue>-<short-name>'
  fix: 'fix/<issue>-<short-name>'
  docs: 'docs/<issue>-<short-name>'
  release: 'release/<version>'

pr_linking:
  partial_delivery: 'Implements #<issue>'
  complete_delivery: 'Closes #<issue>'

milestones:
  naming: 'DDDA <semver>'
  initial:
    - name: DDDA 0.1.0
      scope: PR8 and approved release blockers
  parent_work_packages_counted_in_release_progress: false
  unplanned_work_packages_target_release: TBD

ready_entry_criteria:
  - goal_defined
  - problem_defined
  - in_scope_defined
  - out_of_scope_defined
  - acceptance_criteria_testable
  - classification_defined
  - impact_defined
  - migration_impact_defined
  - dependencies_known
  - owner_or_ownership_plan_known

in_progress_entry_criteria:
  - issue_ready_or_exception_documented
  - branch_exists
  - draft_pr_created_after_first_coherent_commit
  - no_direct_main_work

done_exit_criteria:
  - acceptance_evidence_complete
  - implementation_pr_merged
  - required_ci_pass
  - required_validation_report_pass
  - docs_adr_changelog_migration_updated_as_required
  - human_review_completed_if_required
  - parent_work_package_updated
  - roadmap_updated

scope_review_statuses:
  - covered
  - partial
  - missing
  - scope_creep

work_packages:
  WP-08:
    title: Platform lifecycle and project steering
    state: active_blocked
    target_release: 0.1.0
    outcome_summary: Reproducible platform lifecycle, G1-G8 steering and human-controlled release governance.
    start_date: null
    target_date: null
  WP-09:
    title: Strategy, portfolio and program lifecycle
    state: backlog
    target_release: TBD
    outcome_summary: Strategy, Wardley, portfolio and P0-P10 program governance linked to DDD and teams.
    start_date: null
    target_date: null
  WP-10:
    title: Enterprise ingestion
    state: backlog
    target_release: TBD
    outcome_summary: Secure and auditable ingestion with normalized evidence, Markdown materialization, YAML registration and source provenance.
    start_date: null
    target_date: null
  WP-11:
    title: EventStorming and multi-agent orchestration
    state: backlog
    target_release: TBD
    outcome_summary: Executable EventStorming, evidence-to-workshop integration and bounded multi-agent workflows with explicit human checkpoints.
    start_date: null
    target_date: null

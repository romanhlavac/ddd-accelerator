baseline_compatibility:
  PR8:
    ingestion:
      owner: WP-10-27
      rule: extend_or_version_with_migration
    agent_contract:
      owner: WP-11-36
      rule: extend_or_version_with_migration
    generic_miro_runtime:
      owner: WP-08
      eventstorming_extension_owner: WP-11-35
      duplicate_generic_runtime_forbidden: true
    methodology:
      owner: WP-08
      gap_remediation_owner: WP-11-48
      duplicate_starter_process_forbidden: true

milestones:
  naming: 'DDDA <semver>'
  initial:
    - name: DDDA 0.1.0
      issues: [9, 10, 11, 12, 13, 14, 15]
      pulls: [8]
      excluded_future_items: [45]
  parent_work_packages_counted_in_release_progress: false
  unplanned_work_packages_target_release: TBD
  membership_is_release_scope_not_approval: true

priority_semantics:
  P0: release_safety_or_data_integrity_blocker
  P1: highest_active_product_priority
  P2: important_planned_increment
  P3: long_term_or_opportunistic

ready_entry_criteria:
  - goal_defined
  - problem_defined
  - in_scope_defined
  - out_of_scope_defined
  - acceptance_criteria_testable
  - classification_defined
  - impact_defined
  - migration_impact_defined
  - direct_dependencies_known
  - consumed_contracts_identified
  - owner_or_ownership_plan_known

in_progress_entry_criteria:
  - issue_ready_or_exception_documented
  - branch_exists
  - draft_pr_created_after_first_coherent_commit
  - no_direct_main_work

done_exit_criteria:
  - acceptance_evidence_complete
  - implementation_pr_merged
  - required_ci_pass
  - required_validation_report_pass
  - docs_adr_changelog_migration_updated_as_required
  - human_review_completed_if_required
  - parent_work_package_updated
  - roadmap_updated

work_packages:
  WP-08:
    title: Platform lifecycle and project steering
    state: active_blocked
    target_release: 0.1.0
    outcome_summary: Reproducible platform lifecycle, G1-G8 steering and human-controlled release governance.
  WP-09:
    title: Strategy, portfolio and program lifecycle
    state: backlog
    target_release: TBD
    outcome_summary: Strategy, Wardley, portfolio, traceability, roadmap, benefits and P0-P10 governance.
  WP-10:
    title: Enterprise ingestion
    state: backlog
    target_release: TBD
    outcome_summary: Secure auditable ingestion with normalized evidence, Markdown materialization, YAML registration and provenance.
  WP-11:
    title: EventStorming and multi-agent orchestration
    state: backlog
    target_release: TBD
    outcome_summary: Executable EventStorming, evidence-to-workshop integration, methodology guidance and bounded agents.

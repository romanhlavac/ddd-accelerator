schema_version: 1
policy_id: ddda-platform-backlog-governance
status: proposed

scope:
  product: DDDA platform
  excludes:
    - client workspace delivery backlog
    - client project gates G1-G8

principles:
  git_is_source_of_truth: true
  pr_is_unit_of_change: true
  main_direct_changes_forbidden: true
  planned_prs_as_backlog_forbidden: true
  active_implementation_prs_project_membership_required: true
  pr_project_item_is_delivery_projection_not_backlog_authority: true
  automated_human_approval_forbidden: true
  milestone_membership_is_not_release_approval: true
  parent_membership_is_not_release_scope: true
  dependency_priority_and_business_value_are_distinct: true
  governance_projection_is_same_transaction: true
  project_readback_zero_required_before_ready_done_or_merge_recommendation: true

dependency_semantics:
  direct_blocked_by: native issue dependency; work cannot complete before blocker
  transitive_prerequisite: inherited through direct dependency graph; do not duplicate natively
  consumed_contract: another capability contract is reused but does not necessarily block start
  related_work: informational relationship without scheduling semantics
  no_automatic_priority_dates_release_or_human_review: true

work_item_hierarchy:
  - level: gap
    authority: github_issue
    id_pattern: null
  - level: work_package
    authority: github_parent_issue
    id_pattern: '^WP-[0-9]{2}$'
  - level: change_request
    authority: github_child_issue
    id_pattern: null
  - level: implementation
    authority: branch_and_draft_pr
    starts_when: implementation_begins

artifact_authority:
  idea_or_gap: github_issue
  roadmap_block: github_parent_issue_work_package
  implementation_requirement: github_child_issue
  priority_and_order: github_project
  target_version: github_milestone
  current_implementation: branch_and_draft_pr
  architecture_decision: repository_adr
  implemented_change: pr_and_changelog
  breaking_impact: migration_note
  test_evidence: ci_and_validation_report
  human_release_decision: hrdr_and_review_evidence
  long_term_product_vision: versioned_roadmap_document

project:
  name: DDDA Platform Backlog & Delivery
  fields:
    status:
      type: single_select
      values: [Backlog, Discovery, Triaged, Ready, In progress, In review, Blocked, Done, Cancelled]
    priority:
      type: single_select
      values: [P0, P1, P2, P3]
    work_package:
      type: single_select
      values: [WP-08, WP-09, WP-10, WP-11, WP-12, WP-13, Other]
    item_type:
      type: single_select
      values: [GAP, Work Package, Change Request, Defect, Risk, Enabler]
    platform_area:
      type: single_select
      values: [DOC, METHODOLOGY, TEMPLATE, SCHEMA, ORCHESTRATION, INGESTION, CLI, WORKSPACE-GENERATOR, EXAMPLE, TESTING, RELEASE, SECURITY-GOVERNANCE]
    impact:
      type: single_select
      values: [LOW, MEDIUM, HIGH, BREAKING]
    target_release:
      type: text_or_iteration
      default: TBD
    start_date:
      type: date
      default: null
    target_date:
      type: date
      default: null
    outcome_summary:
      type: text
    owner:
      type: native_assignees
    blocked:
      type: single_select
      values: [No, Yes]
      default: No
    human_review:
      type: single_select
      values: [Not required, Pending, PASS, FAIL, Accepted risks]
    dependency:
      type: text
  system_fields:
    - Parent issue
    - Sub-issue progress
    - Milestone
    - Linked pull requests
    - Assignees
  hierarchy:
    use_native_sub_issues_when_available: true
    parent_issue_is_authoritative: true
    text_prefix_is_navigation_only: true
  dependencies:
    use_native_blocked_by_when_available: true
    dependency_field_is_projection: true
    exact_dates_must_not_be_invented: true
  status_projection:
    closed_or_merged: Done
    reopened: Triaged
    configured_values_are_bootstrap_defaults: true
    closed_item_blocked_value: No
  views:
    - Plánování a Backlog
    - Implementace a Delivery
  view_contract:
    planning:
      name: Plánování a Backlog
      layout: table
      filter: is:issue
    delivery:
      name: Implementace a Delivery
      layout: table
      filter: is:pr is:open
  delivery_projection:
    open_implementation_pr_membership_required: true
    primary_change_request_relation: Implements_or_Closes
    work_package_source: primary_change_request
    project_item_type_field: unset
    draft_status: In progress
    ready_status: In review
    blocked_override: Blocked
    blocked_source: primary_change_request_unresolved_dependency_projection
    project_blocked_field_is_projection_only: true
    fresh_authority_readback_required: true


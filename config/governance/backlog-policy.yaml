schema_version: 1
policy_id: ddda-platform-backlog-governance
status: proposed

scope:
  product: DDDA platform
  excludes:
    - client workspace delivery backlog
    - client project gates G1-G8

principles:
  git_is_source_of_truth: true
  pr_is_unit_of_change: true
  main_direct_changes_forbidden: true
  planned_prs_as_backlog_forbidden: true
  automated_human_approval_forbidden: true

work_item_hierarchy:
  - level: gap
    authority: github_issue
    id_pattern: null
  - level: work_package
    authority: github_parent_issue
    id_pattern: '^WP-[0-9]{2}$'
  - level: change_request
    authority: github_child_issue
    id_pattern: null
  - level: implementation
    authority: branch_and_draft_pr
    starts_when: implementation_begins

artifact_authority:
  idea_or_gap: github_issue
  roadmap_block: github_parent_issue_work_package
  implementation_requirement: github_child_issue
  priority_and_order: github_project
  target_version: github_milestone
  current_implementation: branch_and_draft_pr
  architecture_decision: repository_adr
  implemented_change: pr_and_changelog
  breaking_impact: migration_note
  test_evidence: ci_and_validation_report
  human_release_decision: hrdr_and_review_evidence
  long_term_product_vision: versioned_roadmap_document

project:
  name: DDDA Platform Backlog
  fields:
    status:
      type: single_select
      values:
        - Backlog
        - Discovery
        - Triaged
        - Ready
        - In progress
        - In review
        - Blocked
        - Done
        - Cancelled
    priority:
      type: single_select
      values: [P0, P1, P2, P3]
    work_package:
      type: single_select
      values:
        - WP-08
        - WP-09
        - WP-10
        - WP-11
        - Other
    item_type:
      type: single_select
      values:
        - GAP
        - Work Package
        - Change Request
        - Defect
        - Risk
        - Enabler
    platform_area:
      type: single_select
      values:
        - DOC
        - METHODOLOGY
        - TEMPLATE
        - SCHEMA
        - ORCHESTRATION
        - INGESTION
        - CLI
        - WORKSPACE-GENERATOR
        - EXAMPLE
        - TESTING
        - RELEASE
        - SECURITY-GOVERNANCE
    impact:
      type: single_select
      values: [LOW, MEDIUM, HIGH, BREAKING]
    target_release:
      type: text_or_iteration
      default: TBD
    start_date:
      type: date
      default: null
    target_date:
      type: date
      default: null
    outcome_summary:
      type: text
    owner:
      type: person
    blocked:
      type: boolean
      default: false
    human_review:
      type: single_select
      values:
        - Not required
        - Pending
        - PASS
        - FAIL
        - Accepted risks
    dependency:
      type: text
  system_fields:
    - Parent issue
    - Sub-issue progress
    - Milestone
    - Linked pull requests
  views:
    - Work Packages
    - WP hierarchy
    - Delivery board
    - Roadmap by Work Package
    - Release scope
    - Blocked and P0
    - Human review queue
    - Ready without owner
    - Recently completed
  roadmap:
    start_field: Start date
    target_field: Target date
    group_by: Work Package
    milestone_markers: true
    exact_dates_required: false
    unscheduled_items_allowed: true
  hierarchy:
    use_native_sub_issues_when_available: true
    parent_issue_is_authoritative: true
    text_prefix_is_navigation_only: true
  dependencies:
    use_native_blocked_by_when_available: true
    dependency_field_is_projection: true
    exact_dates_must_not_be_invented: true

native_sub_issue_mapping:
  WP-08:
    parent_issue: 17
    children: [9, 10, 11, 12, 13, 14, 15]
  WP-09:
    parent_issue: 18
    children: [21, 22, 23, 24, 25, 26]
  WP-10:
    parent_issue: 19
    children: [27, 28, 29, 30, 31, 32, 33]
  WP-11:
    parent_issue: 20
    children: [34, 35, 36, 37, 38, 39, 40, 47, 41, 46]


baseline_compatibility:
  PR8:
    ingestion:
      owner: WP-10-27
      rule: extend_or_version_with_migration
    agent_contract:
      owner: WP-13-36
      rule: extend_or_version_with_migration
    generic_miro_runtime:
      owner: WP-08
      platform_environment_owner: WP-12
      eventstorming_extension_owner: WP-11-35
      duplicate_generic_runtime_forbidden: true
    methodology:
      owner: WP-08
      gap_remediation_owner: WP-11-48
      duplicate_starter_process_forbidden: true

milestones:
  naming: 'DDDA <semver>'
  initial:
    - name: DDDA 0.1.0
      state: closed
      issues: [10, 11, 13, 14]
      pulls: [8]
      excluded_future_items: [9, 12, 45, 53, 54, 55, 56, 57, 65, 66, 67, 68, 69, 70, 73, 75, 85, 88]
    - name: DDDA 0.1.1
      state: open
      issues: [9, 12, 67, 68, 70]
      pulls: []
      pre_release_prerequisites: [44]
      explicitly_deferred_items: [65, 66, 69, 73, 85, 88]
  parent_work_packages_counted_in_release_progress: false
  unplanned_work_packages_target_release: TBD
  membership_is_release_scope_not_approval: true

priority_semantics:
  P0: release_safety_or_data_integrity_blocker
  P1: highest_active_product_priority
  P2: important_planned_increment
  P3: long_term_or_opportunistic

implementation_order:
  - {rank: 1, work_package: WP-08, issue: 17, priority: P0}
  - {rank: 2, work_package: WP-11, issue: 20, priority: P1}
  - {rank: 3, work_package: WP-12, issue: 60, priority: P2, note: may_overlap_WP11_after_stable_miro_baseline}
  - {rank: 4, work_package: WP-13, issue: 61, priority: P3}

ready_entry_criteria:
  - goal_defined
  - problem_defined
  - in_scope_defined
  - out_of_scope_defined
  - acceptance_criteria_testable
  - classification_defined
  - impact_defined
  - migration_impact_defined
  - direct_dependencies_known
  - consumed_contracts_identified
  - owner_or_ownership_plan_known

in_progress_entry_criteria:
  - issue_ready_or_exception_documented
  - branch_exists
  - draft_pr_created_after_first_coherent_commit
  - no_direct_main_work

done_exit_criteria:
  - acceptance_evidence_complete
  - implementation_pr_merged
  - required_ci_pass
  - required_validation_report_pass
  - docs_adr_changelog_migration_updated_as_required
  - human_review_completed_if_required
  - parent_work_package_updated
  - roadmap_updated

work_packages:
  WP-08:
    title: DDDA 0.1.0 platform foundation and PR8 closure
    state: released_with_stabilization_tail
    target_release: 0.1.0
    outcome_summary: Preserve released DDDA 0.1.0 foundation truth and hand off only the finite approved 0.1.1 stabilization tail through #75.
  WP-09:
    title: Strategy, portfolio and program lifecycle
    state: backlog
    target_release: TBD
    outcome_summary: Strategy, Wardley, portfolio, traceability, roadmap, benefits and P0-P10 governance.
  WP-10:
    title: Enterprise ingestion
    state: backlog
    target_release: TBD
    outcome_summary: Secure auditable ingestion with normalized evidence, Markdown materialization, YAML registration and provenance.
  WP-11:
    title: EventStorming methodology and workshop runtime
    state: backlog
    target_release: TBD
    outcome_summary: EventStorming facilitation, executable sessions, Miro round-trip, evidence integration and package-first acceptance.
  WP-12:
    title: Miro platform environments and lifecycle
    state: backlog
    target_release: TBD
    outcome_summary: Platform Lab, CI/HVR/Example/Project board lifecycle, environment rebinding and profile credential isolation.
  WP-13:
    title: Multi-agent orchestration and evidence synthesis
    state: backlog
    target_release: TBD
    outcome_summary: Bounded capabilities, fan-out/fan-in, human checkpoints, recovery and package-first multi-agent acceptance.

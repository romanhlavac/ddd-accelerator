schema_version: 1
gates:
  G1:
    stage: align
    question: Proč projekt existuje, jaké rozhodnutí má umožnit a kdo je oprávněn rozhodnout?
    evidence:
      - project-intake.yaml
      - project-profile.yaml
      - artifacts/align/project-charter.yaml
  G2:
    stage: discover
    question: Máme sdílený obraz doménového dění, aktérů, událostí, pravidel a rozporů?
    evidence:
      - ingestion/catalog.yaml
      - artifacts/discover/**/*.yaml
  G3:
    stage: decompose
    question: Jsou kandidátní hranice podloženy rozdílným jazykem, pravidly, lifecycle nebo tempem změn?
    evidence:
      - artifacts/decompose/**/*.yaml
  G4:
    stage: strategize
    question: Je jasné, kde organizace diferencuje a kam má investovat?
    evidence:
      - artifacts/strategize/**/*.yaml
  G5:
    stage: connect
    question: Jsou explicitní vztahy bounded contexts, data ownership a integrační kontrakty?
    evidence:
      - artifacts/connect/context-map.yaml
  G6:
    stage: organize
    question: Je navržený ownership proveditelný pro reálné týmy a jejich cognitive load?
    evidence:
      - artifacts/organize/**/*.yaml
  G7:
    stage: define
    question: Je konkrétní bounded context dostatečně vymezen pro detailní návrh?
    evidence:
      - artifacts/define/**/*.yaml
  G8:
    stage: code
    question: Chrání implementace invarianty a splňuje provozní quality attributes?
    evidence:
      - artifacts/code/**/*.yaml
      - decisions/**/*.md

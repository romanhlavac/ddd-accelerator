schema_version: 1
git_policy:
  approval_boundary: Git commit records a reviewed project state; Git push and merge are always explicit.
  default:
    auto_commit: false
    auto_push: false
    auto_merge: false
  allowed_explicit_commits:
    project_initialization: "chore: initialize DDDA project steering"
    gate_review: "docs(gate): record {gate} {outcome}"
    lifecycle_step: "docs(lifecycle): complete {gate}"
  guards:
    - Do not commit secrets or Miro access tokens.
    - Show git diff before a gate-related commit.
    - Do not mix platform and project changes in one repository.
    - Do not commit unresolved semantic conflicts as accepted decisions.

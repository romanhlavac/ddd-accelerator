    name: Obousměrná YAML a Miro synchronizace
    purpose: Synchronizuje spravované artefakty s common-base, konflikty a explicitní promotion.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Invoke-DDDAMiroSync.ps1]
    documentation: [docs/product/04-synchronizace.md, docs/cookbooks/07-synchronizace-miro-yaml-git.md]
    tests: [runtime/miro/tests]
    miro: required
  - id: miro.polling-worker
    name: Řízený polling worker
    purpose: Opakovaně provádí kontrolovaný sync a zastaví se při konfliktu.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Start-DDDAMiroSyncWorker.ps1]
    documentation: [docs/product/04-synchronizace.md, USAGE.md]
    tests: [runtime/miro/tests]
    miro: required
  - id: miro.smoke-test
    name: Automatizovaný Miro smoke test
    purpose: Ověří online doctor, render, round-trip, promotion, worker, idempotenci a cleanup.
    status: implemented
    starter_stages: []
    commands: [scripts/Invoke-DDDAMiroSmokeTest.ps1, scripts/Test-DDDAAcceptance.ps1]
    documentation: [docs/cookbooks/13-inicializace-po-clone.md, docs/getting-started/01-clone-smoke-example.md]
    tests: [tests/powershell/Test-DDDAMiroAutomation.ps1]
    miro: required
  - id: acceptance.project-steering
    name: Acceptance suite project steering
    purpose: Jedním příkazem ověří intake, tailoring, gates, status a volitelně projektový Miro board.
    status: implemented
    starter_stages: [align, discover]
    commands: [scripts/Test-DDDAAcceptance.ps1]
    documentation: [docs/getting-started/02-testovani-pr8.md, docs/reference/cli.md]
    tests: [scripts/Test-DDDAAcceptance.ps1]
    miro: optional
  - id: methodology.starter
    name: DDD starter metodika
    purpose: Zachovává tok Align až Code a gaty G1 až G8 jako kanonické metodické jádro.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: []
    documentation: [docs/methodology/01-metodicky-tok-a-gates.md, docs/methodology/05-rizeni-projektu-a-tailoring.md]
    tests: [runtime/steering/tests/test_engine.py]
    miro: optional
  - id: diagrams.mermaid
    name: Mermaid projekce
    purpose: Poskytuje textové diagramy pro chat, dokumentaci a review bez změny canonical YAML.
    status: implemented
    starter_stages: [discover, decompose, connect, organize, define, code]
    commands: []
    documentation: [docs/product/01-architektura-ddda.md]
    tests: []

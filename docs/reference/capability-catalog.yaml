    commands: [scripts/Initialize-DDDAMiroBoard.ps1, scripts/Initialize-DDDAProjectMiro.ps1]
    documentation: [docs/product/03-miro-scaffolding.md, docs/cookbooks/14-inicializace-ciloveho-miro-boardu.md]
    tests: [runtime/miro/tests, tests/powershell/Test-DDDAMiroAutomation.ps1]

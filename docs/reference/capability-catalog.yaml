schema_version: 1
capabilities:
  - id: platform.stable-cli
    name: Stabilní platformní CLI
    purpose: Poskytuje jediný doporučený entry point pro doctor, test suites, validate-pr a promote-pr.
    status: implemented
    starter_stages: []
    commands: [ddda.ps1]
    documentation: [README.md, docs/reference/cli.md, docs/user-guide/validate-and-promote-pr.md]
    tests: [scripts/Test-DDDAInstallation.ps1, tests/powershell/Test-DDDAPlatformLifecycle.ps1]
    miro: optional
  - id: platform.candidate-package
    name: Candidate a release package
    purpose: Vytváří distribuovatelný ZIP z čistého versioned source state a váže jej na přesný Git commit.
    status: implemented
    starter_stages: []
    commands: [scripts/platform/New-DDDAPlatformPackage.ps1, scripts/platform/Test-DDDAPlatformPackage.ps1]
    documentation: [docs/adr/0001-platform-development-lifecycle.md, docs/developer-guide/platform-development-lifecycle.md]
    tests: [tests/powershell/Test-DDDAPlatformLifecycle.ps1, tests/powershell/Test-DDDAPlatformSecurity.ps1]
    miro: none
  - id: platform.validate-pr
    name: Exact-SHA validace PR
    purpose: V izolovaném checkoutu vytvoří candidate package, spustí test suites a vytvoří report pro konkrétní PR head SHA.
    status: implemented
    starter_stages: []
    commands: [ddda.ps1, scripts/platform/Invoke-DDDAValidatePr.ps1]
    documentation: [docs/user-guide/validate-and-promote-pr.md, docs/developer-guide/testing-strategy.md]
    tests: [tests/powershell/Test-DDDAPlatformLifecycle.ps1, tests/powershell/Test-DDDAPlatformSecurity.ps1]
    miro: optional
  - id: platform.promote-pr
    name: Kontrolovaný promotion a release
    purpose: Fail-closed ověří CI, validation report, review a exact SHA před explicitně potvrzeným merge a release validací.
    status: implemented
    starter_stages: []
    commands: [ddda.ps1, scripts/platform/Invoke-DDDAPromotePr.ps1]
    documentation: [docs/user-guide/validate-and-promote-pr.md, docs/adr/0001-platform-development-lifecycle.md]
    tests: [tests/powershell/Test-DDDAPlatformSecurity.ps1]
    miro: optional
  - id: platform.example-ingestion
    name: Generovaný minimal example a manifest-driven ingestion
    purpose: Z package vytvoří izolovaný syntetický workspace, ingestuje manifestované vstupy a prokáže tok Align/G1 až Discover/G2.
    status: implemented
    starter_stages: [align, discover]
    commands: [scripts/platform/Invoke-DDDAExampleIngestion.ps1, scripts/platform/New-DDDAValidationWorkspace.ps1]
    documentation: [docs/developer-guide/platform-development-lifecycle.md, docs/developer-guide/testing-strategy.md]
    tests: [tests/powershell/Test-DDDAPlatformLifecycle.ps1]
    miro: optional
  - id: platform.validation-report
    name: Validation a release report
    purpose: Uchovává PR nebo release původ, exact SHA, package hash, suites a diagnostické cesty v JSON a Markdown formátu.
    status: implemented
    starter_stages: []
    commands: [scripts/platform/New-DDDAValidationReport.ps1]
    documentation: [docs/user-guide/validate-and-promote-pr.md, docs/reference/contracts.md]
    tests: [tests/powershell/Test-DDDAPlatformLifecycle.ps1]
    miro: optional
  - id: platform.security-isolation
    name: Bezpečnost a izolace platformního lifecycle
    purpose: Zabraňuje path escape, secret leak, klientským datům a lokálním cache nebo Git metadata v package.
    status: implemented
    starter_stages: []
    commands: [scripts/platform/Test-DDDAPlatformPackage.ps1]
    documentation: [docs/developer-guide/testing-strategy.md, docs/adr/0001-platform-development-lifecycle.md]
    tests: [tests/powershell/Test-DDDAPlatformSecurity.ps1, runtime/platform/validate_repository.py]
    miro: none
  - id: workspace.multi-project
    name: Multi-project workspace
    purpose: Odděluje platformu od samostatných projektových Git repozitářů.
    status: implemented
    starter_stages: []
    commands: [scripts/Initialize-DDDAWorkspace.ps1, scripts/New-DDDAProject.ps1]
    documentation: [docs/product/02-workspace-a-projekty.md, docs/cookbooks/01-zalozeni-projektu.md]
    tests: [tests/powershell/Test-DDDAFirstRun.ps1]
    miro: none
  - id: onboarding.first-run
    name: Automatizovaný první start
    purpose: Po clone ověří platformu, vytvoří workspace a example projekt a volitelně provede Miro smoke testy.
    status: implemented
    starter_stages: []
    commands: [scripts/Initialize-DDDAFirstRun.ps1]
    documentation: [docs/getting-started/01-clone-smoke-example.md, docs/cookbooks/15-prvni-spusteni-a-example-projekt.md]
    tests: [tests/powershell/Test-DDDAFirstRun.ps1]
    miro: optional
  - id: onboarding.project-steering
    name: Řízený první start vlastního projektu
    purpose: Z intake vytvoří projekt, tailoring, gate records, current status a další kroky.
    status: implemented
    starter_stages: [align]
    commands: [scripts/Initialize-DDDAProjectFirstRun.ps1]
    documentation: [USAGE.md, docs/cookbooks/16-zalozeni-rizeneho-projektu.md]
    tests: [tests/powershell/Test-DDDAProjectSteering.ps1]
    miro: optional
  - id: steering.intake-tailoring
    name: Intake a lifecycle tailoring
    purpose: Zachytí business problém, rozhodnutí, scope, aktéry, ownery a zvolí rozšíření nad starter metodikou.
    status: implemented
    starter_stages: [align]
    commands: [scripts/Initialize-DDDAProjectFirstRun.ps1]
    documentation: [docs/methodology/05-rizeni-projektu-a-tailoring.md, docs/cookbooks/16-zalozeni-rizeneho-projektu.md]
    tests: [runtime/steering/tests/test_engine.py]
    miro: optional
  - id: steering.status-menu
    name: Current status a konverzační rozcestník
    purpose: Určí aktuální fázi, další gate, chybějící evidence, doporučené akce a chatový prompt.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Get-DDDAProjectStatus.ps1]
    documentation: [docs/cookbooks/17-status-gates-a-dalsi-krok.md]
    tests: [runtime/steering/tests/test_engine.py, tests/powershell/Test-DDDAProjectSteering.ps1]
    miro: optional
  - id: steering.evidence-gates
    name: Evidence-driven gate engine
    purpose: Připraví gate evidence status a zaznamená pouze explicitní lidské rozhodnutí.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Test-DDDAGates.ps1, scripts/Complete-DDDALifecycleStep.ps1]
    documentation: [docs/methodology/01-metodicky-tok-a-gates.md, docs/cookbooks/17-status-gates-a-dalsi-krok.md]
    tests: [runtime/steering/tests/test_engine.py, tests/powershell/Test-DDDAProjectSteering.ps1]
    miro: optional
  - id: steering.agent-contract
    name: Agentní scope a handoff kontrakt
    purpose: Vymezuje vstupy, výstupy, povolené cesty, zakázané akce a validační pravidla chatového orchestrátoru.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Initialize-DDDAProjectFirstRun.ps1]
    documentation: [docs/reference/contracts.md, docs/cookbooks/11-chat-first-pracovni-rezim.md]
    tests: [runtime/steering/tests/test_engine.py]
    miro: none
  - id: steering.knowledge-pack
    name: Přenosný knowledge pack
    purpose: Mapuje architektonické úlohy na stručné metodické playbooky dostupné po clone.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: []
    documentation: [knowledge/00-knowledge-index.md, docs/capabilities/README.md]
    tests: []
    miro: none
  - id: miro.render
    name: Miro scaffold renderer
    purpose: Vytváří a aktualizuje projektový metodický board se stabilním mappingem.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Initialize-DDDAMiroBoard.ps1, scripts/Initialize-DDDAProjectMiro.ps1]
    documentation: [docs/product/03-miro-scaffolding.md, docs/cookbooks/14-inicializace-ciloveho-miro-boardu.md]
    tests: [runtime/miro/tests, tests/powershell/Test-DDDAMiroAutomation.ps1]
    miro: required
  - id: miro.bidirectional-sync
    name: Obousměrná YAML a Miro synchronizace
    purpose: Synchronizuje spravované artefakty s common-base, konflikty a explicitní promotion.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Invoke-DDDAMiroSync.ps1]
    documentation: [docs/product/04-synchronizace.md, docs/cookbooks/07-synchronizace-miro-yaml-git.md]
    tests: [runtime/miro/tests]
    miro: required
  - id: miro.polling-worker
    name: Řízený polling worker
    purpose: Opakovaně provádí kontrolovaný sync a zastaví se při konfliktu.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: [scripts/Start-DDDAMiroSyncWorker.ps1]
    documentation: [docs/product/04-synchronizace.md, USAGE.md]
    tests: [runtime/miro/tests]
    miro: required
  - id: miro.smoke-test
    name: Automatizovaný Miro smoke test
    purpose: Ověří online doctor, render, round-trip, promotion, worker, idempotenci a cleanup.
    status: implemented
    starter_stages: []
    commands: [scripts/Invoke-DDDAMiroSmokeTest.ps1, scripts/Test-DDDAAcceptance.ps1]
    documentation: [docs/cookbooks/13-inicializace-po-clone.md, docs/getting-started/01-clone-smoke-example.md]
    tests: [tests/powershell/Test-DDDAMiroAutomation.ps1]
    miro: required
  - id: acceptance.project-steering
    name: Acceptance suite project steering
    purpose: Jedním příkazem ověří intake, tailoring, gates, status a volitelně projektový Miro board.
    status: implemented
    starter_stages: [align, discover]
    commands: [scripts/Test-DDDAAcceptance.ps1]
    documentation: [docs/getting-started/02-testovani-pr8.md, docs/reference/cli.md]
    tests: [scripts/Test-DDDAAcceptance.ps1]
    miro: optional
  - id: methodology.starter
    name: DDD starter metodika
    purpose: Zachovává tok Align až Code a gaty G1 až G8 jako kanonické metodické jádro.
    status: implemented
    starter_stages: [align, discover, decompose, strategize, connect, organize, define, code]
    commands: []
    documentation: [docs/methodology/01-metodicky-tok-a-gates.md, docs/methodology/05-rizeni-projektu-a-tailoring.md]
    tests: [runtime/steering/tests/test_engine.py]
    miro: optional
  - id: diagrams.mermaid
    name: Mermaid projekce
    purpose: Poskytuje textové diagramy pro chat, dokumentaci a review bez změny canonical YAML.
    status: implemented
    starter_stages: [discover, decompose, connect, organize, define, code]
    commands: []
    documentation: [docs/product/01-architektura-ddda.md]
    tests: []
    miro: none
